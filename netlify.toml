[build]
  command = "npm run build"
  publish = "dist"
  ignore = "node ./scripts/netlify-ignore.mjs"

[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"


# ── SEO: www -> non-www (301 permanent) ──
[[redirects]]
  from = "https://www.maximusscpi.com/*"
  to = "https://maximusscpi.com/:splat"
  status = 301
  force = true

# ── SCPI retirée du catalogue public ──
[[redirects]]
  from = "/gma-essentialis/*"
  to = "/comparateur-scpi/"
  status = 301
  force = true

# ── Funnel analytics: existing Supabase table via validated function ──
[[redirects]]
  from = "/api/funnel-event"
  to = "/.netlify/functions/funnel-event"
  status = 200
  force = true

# ── SPA fallback ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Isolated visual QA of SCPI 67-68. Production uses the exact certified cohort.
[context."feature/scpi-67-68-release-circuit-v3".environment]
  VITE_BNPP_CANDIDATE_PREVIEW = "true"
