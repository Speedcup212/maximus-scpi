[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"


# ── SEO: www -> non-www (301 permanent) ──
[[redirects]]
  from = "https://www.maximusscpi.com/*"
  to = "https://maximusscpi.com/:splat"
  status = 301
  force = true

# ── SCPI retirée du catalogue public ──
[[redirects]]
  from = "/gma-essentialis/*"
  to = "/comparateur-scpi/"
  status = 301
  force = true

# ── SPA fallback ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

