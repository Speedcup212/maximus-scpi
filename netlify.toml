[build]
  # Étape 1 : build Vite + assets
  # Étape 2 : regénérer le sitemap (garantit la fraîcheur sur l'artefact Netlify)
  # Étape 3 : copier public/ → dist/
  # Étape 4 : valider dist/sitemap.xml (bloque si articles absents)
  command = "npm run build && npx tsx scripts/generateSitemapFromDB.ts && node scripts/copyFinalSitemapToDist.js && node scripts/assertFinalSitemap.js"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# ── SEO: www -> non-www (301 permanent) ──
[[redirects]]
  from = "https://www.maximusscpi.com/*"
  to = "https://maximusscpi.com/:splat"
  status = 301
  force = true

# ── SPA fallback ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

