name: MaximusSCPI - Sofidy T1 history + T3 current issuer proofs
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-history-current-source.yml'
      - 'scripts/agents/sofidy_t3_source_discovery.py'
      - 'scripts/agents/sofidy_t3_source_discovery_test.py'
      - 'scripts/agents/publisher-families/sofidy-2026-t1.json'
      - 'scripts/agents/publisher-families/sofidy-2026-t3-proven.json'
      - 'scripts/agents/sofidy_t3_page_review.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-history-current-source.yml'
      - 'scripts/agents/sofidy_t3_source_discovery.py'
      - 'scripts/agents/sofidy_t3_source_discovery_test.py'
      - 'scripts/agents/publisher-families/sofidy-2026-t1.json'
      - 'scripts/agents/publisher-families/sofidy-2026-t3-proven.json'
      - 'scripts/agents/sofidy_t3_page_review.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sofidy-history-current-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source audit engine
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Validate exact 3 original T1 URLs and T3 discovery safety
        run: python -m unittest scripts/agents/sofidy_t3_source_discovery_test.py -v

  prove-original-t1:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slug: [sofiboutique, sofipierre, sofidy-europe-invest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF validation engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Establish original publisher TLS trust from OS roots
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Independently verify T1 2026 exact issuer original
        run: |
          python scripts/agents/publisher_family_proof.py \
            --manifest scripts/agents/publisher-families/sofidy-2026-t1.json \
            --slug ${{ matrix.slug }} \
            --output test-results/sofidy-history/${{ matrix.slug }}-2026-T1.json
      - name: Retain original PDF proof or explicit QA block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-t1-${{ matrix.slug }}-${{ github.run_id }}
          path: test-results/sofidy-history/${{ matrix.slug }}-2026-T1.json
          if-no-files-found: error
          retention-days: 14

  discover-published-t3:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF reader and search tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify publisher TLS intermediate against OS root
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Discover only real T3 2026 PDFs from official Sofidy news and double-read originals
        run: |
          python scripts/agents/sofidy_t3_source_discovery.py \
            --out test-results/sofidy-current/sofidy-2026-T3.json
      - name: Archive real T3 source proof or explicit block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-t3-discovery-${{ github.run_id }}
          path: test-results/sofidy-current/sofidy-2026-T3.json
          if-no-files-found: error
          retention-days: 14

  review-t3-issuer-pages:
    needs: [preflight, discover-published-t3]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        slug: [sofiboutique, sofipierre, sofidy-europe-invest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify issuer TLS CA against pretrusted root
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Render all relevant T3 pages after original SHA and Poppler validation
        run: |
          python scripts/agents/sofidy_t3_page_review.py \
            --manifest scripts/agents/publisher-families/sofidy-2026-t3-proven.json \
            --slug ${{ matrix.slug }} \
            --out test-results/sofidy-t3-review/${{ matrix.slug }}
      - name: Archive visual page checks without giving financial approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-t3-pages-${{ matrix.slug }}-${{ github.run_id }}
          path: test-results/sofidy-t3-review/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 14
