name: Legacy progressive publisher (retired — Netlify native)
on:
  workflow_run:
    workflows: [Build verification]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: scpi-progressive-delegated-release
  cancel-in-progress: false
jobs:
  publish:
    # Avoid repeating the two missing GitHub Secrets failures. Production
    # release now runs inside the trusted Netlify onSuccess build plugin.
    if: false
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 14
    steps:
      - name: Checkout exact verified main build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve real browser artifact from successful build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: scpi-progressive-public-${{ github.event.workflow_run.id }}
          path: test-results/scpi-progressive-public/
      - name: Protected partial review and exact Netlify production verification
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          NETLIFY_SITE_ID: e4f16f87-663d-4965-8de8-00f6840f1aa7
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/scpi-candidates/autonomousProgressiveRelease.mjs
