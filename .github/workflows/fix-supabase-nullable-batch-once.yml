name: Fix nullable Supabase batch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-supabase-nullable-batch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded nullable Supabase fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Public/utilities
          replace_once('src/components/MoneyPageTools.tsx',
              "    let cancelled = false;\n    const load = async () => {\n      const { data, error } = await supabase\n",
              "    const client = supabase;\n    let cancelled = false;\n    const load = async () => {\n      const { data, error } = await client\n")

          replace_once('src/components/PingSupabase.tsx',
              "  const handlePing = async () => {\n    try {\n      const { data, error } = await supabase.from(\"pg_tables\").select(\"*\").limit(1);\n",
              "  const handlePing = async () => {\n    if (!supabase) {\n      setResult(\"❌ Supabase non configuré\");\n      return;\n    }\n    try {\n      const { error } = await supabase.from(\"pg_tables\").select(\"*\").limit(1);\n")

          replace_once('src/components/anon/AnonVideoView.tsx',
              "  useEffect(() => {\n    async function fetchVideoData() {\n",
              "  useEffect(() => {\n    if (!supabase) {\n      setLoading(false);\n      return;\n    }\n    const client = supabase;\n    async function fetchVideoData() {\n")
          p = Path('src/components/anon/AnonVideoView.tsx')
          text = p.read_text()
          if text.count('await supabase') != 2:
              raise SystemExit('AnonVideoView: expected exactly 2 await supabase usages')
          p.write_text(text.replace('await supabase', 'await client'))

          # Expert auth
          for path in ['src/components/expert/ExpertLogin.tsx', 'src/components/expert/ExpertRegister.tsx']:
              replace_once(path,
                  "  useEffect(() => {\n    const checkSession = async () => {\n      const { data: { session } } = await supabase.auth.getSession();\n",
                  "  useEffect(() => {\n    if (!supabase) return;\n    const client = supabase;\n    const checkSession = async () => {\n      const { data: { session } } = await client.auth.getSession();\n")

          replace_once('src/components/expert/ExpertLogin.tsx',
              "    setLoading(true);\n\n    const { error: authError } = await supabase.auth.signInWithPassword({ email, password });\n",
              "    setLoading(true);\n    if (!supabase) {\n      setError('Service de connexion indisponible.');\n      setLoading(false);\n      return;\n    }\n\n    const { error: authError } = await supabase.auth.signInWithPassword({ email, password });\n")
          replace_once('src/components/expert/ExpertLogin.tsx',
              "    setGoogleLoading(true);\n\n    const { error: googleError } = await supabase.auth.signInWithOAuth({\n",
              "    setGoogleLoading(true);\n    if (!supabase) {\n      setError('Service de connexion indisponible.');\n      setGoogleLoading(false);\n      return;\n    }\n\n    const { error: googleError } = await supabase.auth.signInWithOAuth({\n")

          replace_once('src/components/expert/ExpertRegister.tsx',
              "    setLoading(true);\n\n    if (password !== confirmPassword) {\n",
              "    setLoading(true);\n\n    if (password !== confirmPassword) {\n")
          replace_once('src/components/expert/ExpertRegister.tsx',
              "    const { error: authError } = await supabase.auth.signUp({ email, password });\n",
              "    if (!supabase) {\n      setError('Service d’inscription indisponible.');\n      setLoading(false);\n      return;\n    }\n    const { error: authError } = await supabase.auth.signUp({ email, password });\n")
          replace_once('src/components/expert/ExpertRegister.tsx',
              "    setGoogleLoading(true);\n\n    const { error: googleError } = await supabase.auth.signInWithOAuth({\n",
              "    setGoogleLoading(true);\n    if (!supabase) {\n      setError('Service d’inscription indisponible.');\n      setGoogleLoading(false);\n      return;\n    }\n\n    const { error: googleError } = await supabase.auth.signInWithOAuth({\n")

          # Pro login
          replace_once('src/components/pro/ProCgpLogin.tsx',
              "  useEffect(() => {\n    const checkSession = async () => {\n      const { data: { session } } = await supabase.auth.getSession();\n",
              "  useEffect(() => {\n    if (!supabase) return;\n    const client = supabase;\n    const checkSession = async () => {\n      const { data: { session } } = await client.auth.getSession();\n")
          replace_once('src/components/pro/ProCgpLogin.tsx',
              "    setLoading(true);\n\n    const { error: authError } = await supabase.auth.signInWithPassword({ email, password });\n",
              "    setLoading(true);\n    if (!supabase) {\n      setError('Service de connexion indisponible.');\n      setLoading(false);\n      return;\n    }\n\n    const { error: authError } = await supabase.auth.signInWithPassword({ email, password });\n")
          replace_once('src/components/pro/ProCgpLogin.tsx',
              "    setGoogleLoading(true);\n    await supabase.auth.signInWithOAuth({\n",
              "    setGoogleLoading(true);\n    if (!supabase) {\n      setError('Service de connexion indisponible.');\n      setGoogleLoading(false);\n      return;\n    }\n    await supabase.auth.signInWithOAuth({\n")

          # Pro comparator
          replace_once('src/components/pro/ProComparator.tsx',
              "async function loadPremiumMeta(): Promise<SCPIPremiumMeta[]> {\n  if (premiumMetaCache) return premiumMetaCache;\n  try {\n    // Depuis Supabase scpi_catalog pour les données enrichies\n    const { data } = await supabase\n",
              "async function loadPremiumMeta(): Promise<SCPIPremiumMeta[]> {\n  if (premiumMetaCache) return premiumMetaCache;\n  if (!supabase) return [];\n  const client = supabase;\n  try {\n    // Depuis Supabase scpi_catalog pour les données enrichies\n    const { data } = await client\n")
          replace_once('src/components/pro/ProComparator.tsx',
              "  const loadAllowedScpi = useCallback(async () => {\n    if (!user || allowedLoaded) return;\n    try {\n      const { data } = await supabase\n",
              "  const loadAllowedScpi = useCallback(async () => {\n    if (!user || allowedLoaded || !supabase) return;\n    const client = supabase;\n    try {\n      const { data } = await client\n")

          # Pro layout
          replace_once('src/components/pro/ProLayout.tsx',
              "        <button onClick={async () => { await supabase.auth.signOut(); onSignOut(); }}\n",
              "        <button onClick={async () => { if (supabase) await supabase.auth.signOut(); onSignOut(); }}\n")

          # Pro reports
          replace_once('src/components/pro/ProRapports.tsx',
              "  const fetchReports = useCallback(async () => {\n    if (!user) return;\n    setLoading(true);\n    try {\n      const { data, error } = await supabase\n",
              "  const fetchReports = useCallback(async () => {\n    if (!user || !supabase) return;\n    const client = supabase;\n    setLoading(true);\n    try {\n      const { data, error } = await client\n")
          replace_once('src/components/pro/ProRapports.tsx',
              "  const handleDelete = async (id: string) => {\n    if (!confirm('Supprimer ce rapport ? Cette action est irréversible.')) return;\n    try {\n      await supabase.from('pro_reports').delete().eq('id', id);\n",
              "  const handleDelete = async (id: string) => {\n    if (!confirm('Supprimer ce rapport ? Cette action est irréversible.') || !supabase) return;\n    try {\n      await supabase.from('pro_reports').delete().eq('id', id);\n")

          # Pro settings
          replace_once('src/components/pro/ProSettings.tsx',
              "  useEffect(() => {\n    const fetchProfile = async () => {\n      try {\n        const { data: { session } } = await supabase.auth.getSession();\n",
              "  useEffect(() => {\n    if (!supabase) {\n      setLoading(false);\n      return;\n    }\n    const client = supabase;\n    const fetchProfile = async () => {\n      try {\n        const { data: { session } } = await client.auth.getSession();\n")
          replace_once('src/components/pro/ProSettings.tsx',
              "        const { data, error } = await supabase\n",
              "        const { data, error } = await client\n")
          replace_once('src/components/pro/ProSettings.tsx',
              "    try {\n      const { data: { session } } = await supabase.auth.getSession();\n      if (!session) throw new Error(\"Pas de session active\");\n\n      const { error } = await supabase\n",
              "    try {\n      if (!supabase) throw new Error(\"Supabase non configuré\");\n      const client = supabase;\n      const { data: { session } } = await client.auth.getSession();\n      if (!session) throw new Error(\"Pas de session active\");\n\n      const { error } = await client\n")

          # Pro signup
          replace_once('src/components/pro/ProSignup.tsx',
              "    setLoading(true);\n\n    try {\n",
              "    setLoading(true);\n    if (!supabase) {\n      setError('Service d’inscription indisponible.');\n      setLoading(false);\n      return;\n    }\n    const client = supabase;\n\n    try {\n")
          p = Path('src/components/pro/ProSignup.tsx')
          text = p.read_text()
          if text.count('await supabase') != 2:
              raise SystemExit('ProSignup: expected exactly 2 await supabase usages')
          p.write_text(text.replace('await supabase', 'await client'))

      - name: Install dependencies
        run: npm ci
      - name: Verify target diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          set -e
          total=$(grep -E -c 'error TS[0-9]+:' /tmp/typecheck.log || true)
          echo "TypeScript diagnostics after nullable batch: ${total}"
          targets='MoneyPageTools|PingSupabase|AnonVideoView|ExpertLogin|ExpertRegister|ProCgpLogin|ProComparator|ProLayout|ProRapports|ProSettings|ProSignup'
          if grep -E "src/components/.*(${targets}).*error TS18047:" /tmp/typecheck.log; then
            echo 'Target TS18047 diagnostics remain.' >&2
            exit 1
          fi
          if [ "$total" -ge 915 ]; then
            echo 'Nullable batch did not improve global debt.' >&2
            exit 1
          fi
      - name: Production build
        run: npm run build
      - name: Commit validated batch
        shell: bash
        run: |
          git config user.name 'maximus-agents'
          git config user.email 'maximus-agents@users.noreply.github.com'
          git add src/components/MoneyPageTools.tsx src/components/PingSupabase.tsx src/components/anon/AnonVideoView.tsx src/components/expert/ExpertLogin.tsx src/components/expert/ExpertRegister.tsx src/components/pro/ProCgpLogin.tsx src/components/pro/ProComparator.tsx src/components/pro/ProLayout.tsx src/components/pro/ProRapports.tsx src/components/pro/ProSettings.tsx src/components/pro/ProSignup.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(auth): guard nullable Supabase across expert and pro flows [skip netlify]'
          git push origin HEAD:main
