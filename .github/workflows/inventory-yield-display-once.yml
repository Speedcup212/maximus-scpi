name: Inventory yield display diagnostics once

on:
  push:
    branches:
      - diagnostic/yield-display-errors-20261005
    paths:
      - '.github/workflows/inventory-yield-display-once.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inventory yieldDisplay diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          set -e
          grep -E '^src/utils/yieldDisplay.ts' /tmp/typecheck.log || true
          echo "yieldDisplay diagnostics: $(grep -E -c '^src/utils/yieldDisplay.ts' /tmp/typecheck.log || true)"
