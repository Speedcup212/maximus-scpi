name: Secure Netlify deployment relay

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.actor == github.repository_owner && github.event.issue.title == '[internal-deploy] Netlify relay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Create ephemeral encryption key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/netlify-relay-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/netlify-relay-private.pem -pubout -out /tmp/netlify-relay-public.pem >/dev/null 2>&1
          PUBLIC_KEY_B64="$(base64 -w0 /tmp/netlify-relay-public.pem)"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "NETLIFY_PUBLIC_KEY:${PUBLIC_KEY_B64}"

      - name: Receive encrypted Netlify capability and deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            BODY="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --paginate --jq '[.[] | .body | select(startswith("NETLIFY_ENVELOPE:"))][-1] // ""')"
            if [[ -n "$BODY" ]]; then
              PAYLOAD="${BODY#NETLIFY_ENVELOPE:}"
              RSA_B64="${PAYLOAD%%:*}"
              REST="${PAYLOAD#*:}"
              IV_HEX="${REST%%:*}"
              CIPHER_B64="${REST#*:}"

              printf '%s' "$RSA_B64" | base64 -d > /tmp/netlify-aes-key.enc
              openssl pkeyutl -decrypt -inkey /tmp/netlify-relay-private.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/netlify-aes-key.enc -out /tmp/netlify-aes-key.bin
              KEY_HEX="$(xxd -p -c 256 /tmp/netlify-aes-key.bin)"
              PROXY_PATH="$(printf '%s' "$CIPHER_B64" | base64 -d | openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX")"

              case "$PROXY_PATH" in
                https://netlify-mcp.netlify.app/proxy/*) ;;
                *)
                  gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body 'NETLIFY_DEPLOY_ERROR: decrypted capability has an invalid origin.'
                  exit 1
                  ;;
              esac

              echo "::add-mask::$PROXY_PATH"
              npx -y @netlify/mcp@latest --site-id e4f16f87-663d-4965-8de8-00f6840f1aa7 --proxy-path "$PROXY_PATH"
              gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "NETLIFY_DEPLOY_SUCCESS:${GITHUB_SHA}"
              gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed
              exit 0
            fi
            sleep 5
          done

          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body 'NETLIFY_DEPLOY_ERROR: encrypted capability not received before timeout.'
          exit 1
