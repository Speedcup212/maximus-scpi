name: MaximusSCPI - official Sofidy 2024-2025 statutes source proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-statutes-proof.yml'
      - 'scripts/agents/sofidy_statutes_original_proof.py'
      - 'scripts/agents/sofidy_statutes_original_proof_test.py'
      - 'scripts/agents/publisher-families/sofidy-statutes-official-editions.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-statutes-proof.yml'
      - 'scripts/agents/sofidy_statutes_original_proof.py'
      - 'scripts/agents/sofidy_statutes_original_proof_test.py'
      - 'scripts/agents/publisher-families/sofidy-statutes-official-editions.json'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify exact statute versions and no publication
        run: python -m unittest scripts/agents/sofidy_statutes_original_proof_test.py -v

  issuer-statutes:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slug: [sofiboutique, sofipierre, sofidy-europe-invest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poppler and MuPDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify Sofidy issuer intermediate with trusted system root
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Check exact publisher statute edition and independent document kind
        run: |
          python scripts/agents/sofidy_statutes_original_proof.py \
            --manifest scripts/agents/publisher-families/sofidy-statutes-official-editions.json \
            --slug ${{ matrix.slug }} \
            --out test-results/sofidy-statutes/${{ matrix.slug }}.json
      - name: Archive original source SHA and block if invalid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-statutes-${{ matrix.slug }}-${{ github.run_id }}
          path: test-results/sofidy-statutes/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 14
