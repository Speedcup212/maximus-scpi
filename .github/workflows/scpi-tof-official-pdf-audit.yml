name: Read-only official issuer TOF PDF audit
on:
  push:
    branches:
      - audit/scpi-official-tof-20261028
    paths:
      - scripts/tof_official_bulletin_audit.py
      - .github/workflows/scpi-tof-official-pdf-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text reader
        run: python -m pip install 'PyMuPDF>=1.24,<2' 'requests>=2.31,<3'
      - name: Inspect official quarter PDF evidence (read only)
        run: python scripts/tof_official_bulletin_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-tof-pdf-evidence-20261028
          path: tof_pdf_evidence.json
          retention-days: 7
