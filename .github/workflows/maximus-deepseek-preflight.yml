name: MaximusSCPI - DeepSeek API connection test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maximus-deepseek-preflight.yml"

permissions:
  contents: read

concurrency:
  group: maximus-deepseek-preflight
  cancel-in-progress: true

jobs:
  check-deepseek:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: DeepSeek API key missing - no model calls
        if: env.DEEPSEEK_API_KEY == ''
        run: echo 'DEEPSEEK_API_KEY not configured. Add it in Settings > Secrets and variables > Actions.'

      - name: Verify DeepSeek API (one minimal request)
        if: env.DEEPSEEK_API_KEY != ''
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const apiKey = process.env.DEEPSEEK_API_KEY;
          if (!apiKey) throw new Error("DEEPSEEK_API_KEY is missing");
          const response = await fetch("https://api.deepseek.com/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: "deepseek-v4-flash",
              thinking: { type: "disabled" },
              max_tokens: 24,
              stream: false,
              messages: [
                { role: "system", content: "Réponds par le seul mot OK." },
                { role: "user", content: "Test de connexion DeepSeek pour MaximusSCPI." }
              ]
            }),
            signal: AbortSignal.timeout(25000)
          });
          if (!response.ok) {
            // Never print request headers or key. The HTTP status is sufficient.
            throw new Error(`DeepSeek API failed, HTTP ${response.status}`);
          }
          const data = await response.json();
          if (!data?.choices?.[0]?.message?.content) {
            throw new Error("DeepSeek returned no completion");
          }
          console.log("DeepSeek API connection: SUCCESS");
          console.log(`Model: ${data.model || "deepseek-v4-flash"}`);
          console.log(`Total tokens for test: ${data.usage?.total_tokens ?? "unknown"}`);
          console.log("This connection test does NOT run AI agents, read Supabase or deploy Netlify.");
          NODE

      - name: Diagnose coding agent gateway without claiming any SCPI task
        if: env.DEEPSEEK_API_KEY != ''
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-flash
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          npm install -g @anthropic-ai/claude-code --no-audit --no-fund
          set +e
          timeout 80 claude -p 'Reply only with OK.' --model deepseek-flash --max-turns 1 \
            --permission-mode dontAsk --output-format json \
            > /tmp/deepseek-agent-check.json 2>/tmp/deepseek-agent-check.err
          result_code=$?
          set -e
          echo "Coding agent exit status: $result_code"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let o={};
          try { o=JSON.parse(fs.readFileSync('/tmp/deepseek-agent-check.json','utf8')); } catch {}
          const raw=fs.existsSync('/tmp/deepseek-agent-check.json')?fs.readFileSync('/tmp/deepseek-agent-check.json','utf8'):'';
          const err=fs.existsSync('/tmp/deepseek-agent-check.err')?fs.readFileSync('/tmp/deepseek-agent-check.err','utf8'):'';
          // No credentials in output: display only SDK result subtype and clipped error metadata.
          console.log('CLI result type:',o.type||'unavailable');
          console.log('CLI result subtype:',o.subtype||'unavailable');
          console.log('CLI is_error:',o.is_error??'unknown');
          console.log('CLI session status:',String(o.result||o.error||raw||'empty').slice(0,450));
          console.log('CLI diagnostics:',err.slice(0,450));
          NODE
          exit "$result_code"
