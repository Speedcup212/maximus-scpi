name: MaximusSCPI - DeepSeek API connection test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maximus-deepseek-preflight.yml"

permissions:
  contents: read

concurrency:
  group: maximus-deepseek-preflight
  cancel-in-progress: true

jobs:
  check-deepseek:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: DeepSeek API key missing - no model calls
        if: env.DEEPSEEK_API_KEY == ''
        run: echo 'DEEPSEEK_API_KEY not configured. Add it in Settings > Secrets and variables > Actions.'

      - name: Verify DeepSeek API (one minimal request)
        if: env.DEEPSEEK_API_KEY != ''
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const apiKey = process.env.DEEPSEEK_API_KEY;
          if (!apiKey) throw new Error("DEEPSEEK_API_KEY is missing");
          const response = await fetch("https://api.deepseek.com/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: "deepseek-flash",
              max_tokens: 24,
              stream: false,
              messages: [
                { role: "system", content: "Réponds par le seul mot OK." },
                { role: "user", content: "Test de connexion DeepSeek pour MaximusSCPI." }
              ]
            }),
            signal: AbortSignal.timeout(25000)
          });
          if (!response.ok) {
            // Never print request headers or key. The HTTP status is sufficient.
            throw new Error(`DeepSeek API failed, HTTP ${response.status}`);
          }
          const data = await response.json();
          if (!data?.choices?.[0]?.message?.content) {
            throw new Error("DeepSeek returned no completion");
          }
          console.log("DeepSeek API connection: SUCCESS");
          console.log(`Model: ${data.model || "deepseek-flash"}`);
          console.log(`Total tokens for test: ${data.usage?.total_tokens ?? "unknown"}`);
          console.log("This connection test does NOT run AI agents, read Supabase or deploy Netlify.");
          NODE
