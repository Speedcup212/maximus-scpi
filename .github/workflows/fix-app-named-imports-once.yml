name: Fix App named lazy imports once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-app-named-imports-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact App import fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          replacements = {
            "m.FondsEurosOuScpiArticle || m.default": "m.FondsEurosOuScpiArticle",
            "m.ScpiDirectOuAssuranceVieArticle || m.default": "m.ScpiDirectOuAssuranceVieArticle",
            "m.InvestirScpiTmi11PourcentFiscaliteOptimaleArticle || m.default": "m.InvestirScpiTmi11PourcentFiscaliteOptimaleArticle",
            "m.ScpiTmi30PourcentArbitrageAvDirectArticle || m.default": "m.ScpiTmi30PourcentArbitrageAvDirectArticle",
            "m.ForteImpositionTmi41ScpiAssuranceVieArticle || m.default": "m.ForteImpositionTmi41ScpiAssuranceVieArticle",
            "m.IfiScpiImpotFortuneImmobiliereStrategiesArticle || m.default": "m.IfiScpiImpotFortuneImmobiliereStrategiesArticle",
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
            text = text.replace(old, new)
          path.write_text(text)
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript targets
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          set -e
          total=$(grep -E -c 'error TS[0-9]+:' /tmp/typecheck.log || true)
          echo "TypeScript diagnostics after patch: ${total}"
          if grep -E 'App\.tsx\((126|127|133|134|135|145),' /tmp/typecheck.log; then
            echo 'Target lazy-import diagnostics still present.' >&2
            exit 1
          fi
      - name: Production build
        run: npm run build
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name 'maximus-agents'
          git config user.email 'maximus-agents@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(app): use verified named article exports [skip netlify]'
          git push origin HEAD:main
