name: RECOVERY-114 Claude Code subscription adapter — safe contract

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/agents/subscriptionCliRunner.mjs"
      - "scripts/agents/subscriptionCliRunner.test.mjs"
      - "scripts/agents/claudeSubscriptionPreflight.mjs"
      - "scripts/agents/claudeSubscriptionPreflight.test.mjs"
      - "agents/autonomous/claude-code-subscription.md"
      - "supabase/functions/maximus-search-agent-oidc/index.ts"
      - ".github/workflows/maximus-claude-local-worker.yml"
      - "scripts/agents/claudeLocalWorkflowContract.test.mjs"
      - ".github/workflows/maximus-claude-subscription-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-contract:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static syntax — no Claude subscription required
        run: |
          node --check scripts/agents/subscriptionCliRunner.mjs
          node --check scripts/agents/claudeSubscriptionPreflight.mjs
          node --test scripts/agents/claudeSubscriptionPreflight.test.mjs
          node --test scripts/agents/claudeLocalWorkflowContract.test.mjs
          node --test scripts/agents/subscriptionCliRunner.test.mjs
          node --test scripts/agents/deepseekCorrectiveRunner.test.mjs
          node --test scripts/agents/deepseekWorkflowContract.test.mjs
      - name: Guard against hidden external-billing fallback and production deployment
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=fs.readFileSync('scripts/agents/subscriptionCliRunner.mjs','utf8');
          const workflow=fs.readFileSync('.github/workflows/maximus-claude-subscription-contract.yml','utf8');
          for(const required of ["ANTHROPIC_","OPENAI_","DEEPSEEK_","'--restricted'","'--tools'","'--permission-prompts'","'CLAUDE_SUBSCRIPTION_AUTH_ONLY_NO_API_BILLING'"]) {
            if(!a.includes(required))throw Error('Subscription protection missing: '+required);
          }
          // Inspect only executable workflow steps, not this assertion's own source.
          const executableSteps=workflow.split('      - name: Guard against hidden external-billing fallback')[0];
          if(/netlify deploy|gh pr merge|git push origin main/.test(executableSteps))
            throw Error('Unexpected deploy command in workflow steps');
          if(!workflow.includes('permissions:') || !workflow.includes('  contents: read'))
            throw Error('Workflow must have read-only GitHub permissions');
          console.log('SUBSCRIPTION_CONTRACT_VERIFIED_WITHOUT_MODEL_SPEND');
          NODE
