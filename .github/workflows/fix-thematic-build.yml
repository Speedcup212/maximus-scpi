name: Repair thematic generator and verify full build

on:
  push:
    paths:
      - '.github/workflows/fix-thematic-build.yml'

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair malformed thematic entry
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/generateOptimizedThematicPages.js')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          changed = False
          out = []
          for line in lines:
              if "'Selectipierre 2':" in line and '": "SCPI alimentaire SFDR Article 9' in line:
                  marker = '": "SCPI alimentaire SFDR Article 9'
                  line = line.split(marker, 1)[0] + '",\n'
                  changed = True
              out.append(line)
          if not changed:
              raise SystemExit('Expected malformed Selectipierre 2 line not found')
          p.write_text(''.join(out), encoding='utf-8')
          wf = Path('.github/workflows/fix-thematic-build.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore valid thematic generator syntax"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full production build
        run: npm run build
