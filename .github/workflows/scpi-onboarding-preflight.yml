name: RECOVERY-070 generic SCPI onboarding preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/scpi-onboarding/**'
      - '.github/workflows/scpi-onboarding-preflight.yml'
      - 'src/data/certified_scpi_cohort.json'
      - 'src/data/scpi_complet.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scpi-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test generic cohort, provenance, absence and period guards
        run: node --test scripts/scpi-onboarding/preflight.test.mjs scripts/scpi-onboarding/datedEvidence.test.mjs scripts/scpi-onboarding/discovery.test.mjs scripts/scpi-onboarding/roundedAllocationPolicy.test.mjs scripts/scpi-onboarding/candidateConsistency.test.mjs scripts/scpi-onboarding/autoRemediate.test.mjs
      - name: Verify independent-review boundaries, 15-part discrepancy and period-correct fee bases
        run: node --test scripts/scpi-onboarding/sourceFinancialSemantics.test.mjs scripts/scpi-candidates/autonomousPreparedRelease.test.mjs
      - name: Regression preflight on the two published BNP candidates
        run: node scripts/scpi-onboarding/preflight.mjs --manifest scripts/scpi-onboarding/fixtures/bnpp-2026-t3.json
      - name: Discovery gate on the prospective 69th SCPI (no financial publication)
        run: node scripts/scpi-onboarding/discovery.mjs --manifest scripts/scpi-onboarding/fixtures/sofidynamic-69-discovery.json
      - name: Autonomous detector and safe-remediation dry run (never public)
        run: node scripts/scpi-onboarding/autoRemediate.mjs --scan --report test-results/scpi-auto-recovery/preflight.json
      - name: Install Chromium
        run: npx puppeteer browsers install chrome
      - name: Generic desktop/mobile candidate interface matrix
        run: node scripts/scpi-onboarding/browser.mjs
      - name: Sofidynamic 69 private verified financial surfaces only (no publication)
        run: node scripts/scpi-onboarding/privateSofidynamicBrowser.mjs
      - name: Preserve BNP browser baseline report
        run: cp test-results/scpi-onboarding/report.json test-results/scpi-onboarding/report-bnpp.json
      - name: Private Sofidynamic desktop/mobile UI validation, never public
        run: node scripts/scpi-onboarding/privateCandidateBrowser.mjs
      - name: Preserve Sofidynamic browser proof separately
        if: always()
        run: |
          if [ -f test-results/scpi-onboarding/report.json ]; then
            cp test-results/scpi-onboarding/report.json test-results/scpi-onboarding/report-sofidynamic.json
          fi
      - name: Save candidate browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpi-onboarding-${{ github.run_id }}
          path: test-results/scpi-onboarding/
      - name: Archive automatic issue classification and repair plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpi-auto-recovery-preflight-${{ github.run_id }}
          path: test-results/scpi-auto-recovery/
          retention-days: 14
          if-no-files-found: warn
