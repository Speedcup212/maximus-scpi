name: RECOVERY-070 generic SCPI onboarding preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/scpi-onboarding/**'
      - 'scripts/scpi-history/**'
      - 'scripts/scpi-candidates/**'
      - 'supabase/migrations/**'
      - 'src/components/**'
      - 'src/utils/**'
      - 'src/app/**'
      - 'src/data/**'
      - 'plugins/maximus-scpi-native-release/**'
      - 'docs/scpi/evidence/**'
      - '.github/workflows/scpi-onboarding-preflight.yml'
      - 'src/data/certified_scpi_cohort.json'
      - 'src/data/scpi_complet.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scpi-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test generic cohort, provenance, absence and period guards
        run: node --test scripts/scpi-onboarding/*.test.mjs
      - name: Verify private screenshot ZIP integrity and 12-case content
        run: python3 -m unittest discover -s scripts/scpi-onboarding -p 'test_verify_browser_artifact.py' -v
      - name: Verify independent-review boundaries, 15-part discrepancy and period-correct fee bases
        run: node --test scripts/scpi-onboarding/sourceFinancialSemantics.test.mjs scripts/scpi-candidates/autonomousPreparedRelease.test.mjs
      - name: Regression preflight on the two published BNP candidates
        run: node scripts/scpi-onboarding/preflight.mjs --manifest scripts/scpi-onboarding/fixtures/bnpp-2026-t3.json
      - name: Discovery gate on the prospective 69th SCPI (no financial publication)
        run: node scripts/scpi-onboarding/discovery.mjs --manifest scripts/scpi-onboarding/fixtures/sofidynamic-69-discovery.json
      - name: Autonomous detector and safe-remediation dry run (never public)
        run: node scripts/scpi-onboarding/autoRemediate.mjs --scan --report test-results/scpi-auto-recovery/preflight.json
      - name: Install Chromium
        run: npx puppeteer browsers install chrome
      - name: Generic desktop/mobile candidate interface matrix
        run: node scripts/scpi-onboarding/browser.mjs
      - name: Progressive SCPI official-source caveats on six real React surfaces, desktop and mobile
        run: node scripts/scpi-onboarding/progressivePublicBrowser.mjs
      - name: Store twelve source-backed provisional browser cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpi-progressive-public-${{ github.run_id }}
          path: test-results/scpi-progressive-public/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve BNP browser baseline report
        run: cp test-results/scpi-onboarding/report.json test-results/scpi-onboarding/report-bnpp.json
      - name: Sofidynamic 69 private verified financial surfaces only (no publication)
        run: node scripts/scpi-onboarding/privateSofidynamicBrowser.mjs
      - name: Private Sofidynamic trajectory desktop/mobile, no fabricated 2026 valuation
        run: node scripts/scpi-history/sofidynamicPrivateTrajectoryBrowser.mjs
      - name: Preserve only a real Sofidynamic private browser report (never re-label BNP)
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const folder='test-results/scpi-onboarding/';
          const current=folder+'report.json';
          const candidate=folder+'report-sofidynamic.json';
          fs.rmSync(candidate,{force:true});
          if(!fs.existsSync(current)){
            console.log('SOFIDYNAMIC_PRIVATE_REPORT_NOT_PRODUCED: no report.json');
            process.exit(0);
          }
          const report=JSON.parse(fs.readFileSync(current,'utf8'));
          const cases=Array.isArray(report.cases)?report.cases:[];
          const expected=new Set([390,1440].flatMap(w=>['profile','comparator_analysis','radar','simulator','client_card'].map(s=>w+':'+s)));
          const own=cases.filter(c=>c.slug==='sofidynamic');
          const valid=report.status==='PASS' && cases.length===10 && own.length===10 &&
            report.mode==='generic-private-stage-integration-not-production' &&
            /^[a-f0-9]{40}$/.test(report.commit||'') &&
            new Set(own.map(c=>c.width+':'+c.surface)).size===10 &&
            own.every(c=>c.status==='PASS' && expected.has(c.width+':'+c.surface));
          if(valid){
            fs.copyFileSync(current,candidate);
            console.log('SOFIDYNAMIC_PRIVATE_REPORT_PROVENANCE_PRESENT');
          }else {
            console.log('SOFIDYNAMIC_PRIVATE_REPORT_NOT_EXECUTED: no candidate-specific 10-case proof; BNP report never reused');
          }
          JS
      - name: Bind private 10+2 browser screenshots to one hashed case manifest
        run: |
          if test -f test-results/scpi-onboarding/report-sofidynamic.json; then
            node scripts/scpi-onboarding/combinePrivateBrowserEvidence.mjs
          else
            echo "NO_SOFIDYNAMIC_PRIVATE_REPORT: no 12-case bundle certified"
          fi
      - name: Save candidate browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpi-onboarding-${{ github.run_id }}
          path: test-results/scpi-onboarding/
      - name: Save separate Sofidynamic trajectory browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpi-sofidynamic-trajectory-${{ github.run_id }}
          path: test-results/scpi-sofidynamic-trajectory/
          if-no-files-found: warn
      - name: Archive automatic issue classification and repair plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpi-auto-recovery-preflight-${{ github.run_id }}
          path: test-results/scpi-auto-recovery/
          retention-days: 14
          if-no-files-found: warn
