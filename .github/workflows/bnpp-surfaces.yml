name: BNP candidate full component and route preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: node scripts/scpi-candidates/bnppSurfacesBrowser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnpp-surfaces-${{ github.run_id }}
          path: test-results/bnpp-surfaces/
          if-no-files-found: error
