name: Package Netlify source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build source archive
        run: git archive --format=zip --output=/tmp/source.zip HEAD

      - name: Upload source archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-source-${{ github.sha }}
          path: /tmp/source.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: netlify-source-package
          path: package-branch
          fetch-depth: 1

      - name: Update source package
        run: |
          cp /tmp/source.zip package-branch/source.zip
          cd package-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.zip
          if git diff --cached --quiet; then
            echo "source.zip already up to date"
            exit 0
          fi
          git commit -m "chore: refresh Netlify source package from ${GITHUB_SHA}"
          git push origin HEAD:netlify-source-package
