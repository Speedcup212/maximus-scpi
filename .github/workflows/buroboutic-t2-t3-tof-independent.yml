name: Buroboutic 2026 T2 T3 independent TOF original PDF review
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/buroboutic-t2-t3-tof-independent.yml"
      - "scripts/agents/buroboutic_2026_tof_independent_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-two-quarter-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently install PDF engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Check original issuer SHA, separate page 4 bar values, and previous rejected components
        run: python scripts/agents/buroboutic_2026_tof_independent_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buroboutic-2026-t2-t3-originals-tof
          path: test-results/buroboutic-2026-tof/
          retention-days: 21
          if-no-files-found: warn
