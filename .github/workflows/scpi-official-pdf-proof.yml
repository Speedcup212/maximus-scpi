name: RECOVERY-070 official issuer PDF binary QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/scpi-onboarding/**'
      - '.github/workflows/scpi-official-pdf-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-binary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection library
        run: python -m pip install --quiet pymupdf==1.26.5
      - name: Source QA unit tests (no external network)
        run: python -m unittest discover -s scripts/scpi-onboarding -p 'test_publisherPdfAudit.py' -v
      - name: Diagnose the Sofidy TLS chain (read-only, no insecure downloads)
        run: |
          echo | timeout 20 openssl s_client -connect www.sofidy.com:443 -servername www.sofidy.com -showcerts 2>&1 | grep -E 'Certificate chain| s:| i:|Verify return code|verify error|depth=' | head -20 || true
          curl --head --verbose --max-time 20 'https://www.sofidy.com/solutions/sofidynamic/' 2>&1 | grep -E 'subject:|issuer:|SSL certificate|Server certificate|HTTP/|CAfile' | head -18 || true
          curl --head --verbose --max-time 20 'https://sofidy.com/solutions/sofidynamic/' 2>&1 | grep -E 'subject:|issuer:|SSL certificate|Server certificate|HTTP/|CAfile' | head -18 || true
          echo | timeout 20 openssl s_client -connect www.sofidy.com:443 -servername www.sofidy.com -showcerts 2>/dev/null | openssl x509 -noout -text | sed -n '/Authority Information Access/,+7p' || true
      - name: Real Sofidy issuer binary, source period and SHA-256 (NO DB write)
        run: |
          python scripts/scpi-onboarding/publisherPdfAudit.py \
            --manifest scripts/scpi-onboarding/fixtures/sofidynamic-69-discovery.json \
            --output test-results/scpi-source-validation/sofidynamic-69.json
      - name: Store technical SHA evidence only, no PDF binary or approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidynamic-publisher-pdf-${{ github.run_id }}
          path: test-results/scpi-source-validation/
          retention-days: 30
          if-no-files-found: warn
