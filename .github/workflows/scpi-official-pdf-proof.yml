name: RECOVERY-070 official issuer PDF binary QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/scpi-onboarding/**'
      - '.github/workflows/scpi-official-pdf-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-binary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify issuer registry security and pending provenance
        run: node --test scripts/scpi-onboarding/issuerRegistryPolicy.test.mjs scripts/scpi-onboarding/pendingCandidateEvidence.test.mjs scripts/scpi-onboarding/legalAuthorityGuard.test.mjs
      - name: Install PDF inspection library
        run: python -m pip install --quiet pymupdf==1.26.5
      - name: Source QA unit tests (no external network)
        run: python -m unittest discover -s scripts/scpi-onboarding -p 'test_*.py' -v
      - name: Restore missing issuer intermediate only after system-root verification
        run: python scripts/scpi-onboarding/buildVerifiedPublisherChain.py --output /tmp/verified-sofidy-ca.pem
      - name: Discover official regulatory PDF links (URL evidence only)
        run: |
          python scripts/scpi-onboarding/discoverSofidyRegulatory.py \
            --ca-bundle /tmp/verified-sofidy-ca.pem \
            --out test-results/scpi-source-validation/sofidynamic-regulatory-discovery.json
      - name: Real Sofidy issuer binary, source period and SHA-256 (NO DB write)
        env:
          SCPI_PUBLISHER_CA_BUNDLE: /tmp/verified-sofidy-ca.pem
          SCPI_PDF_RENDER_ANOMALIES: test-results/scpi-source-validation/
          SCPI_PDF_ARCHIVE_DIR: test-results/scpi-source-validation/sources/
        run: |
          python scripts/scpi-onboarding/publisherPdfAudit.py \
            --manifest scripts/scpi-onboarding/fixtures/sofidynamic-69-discovery.json \
            --output test-results/scpi-source-validation/sofidynamic-69.json
      - name: Reconcile all 29 primary-source financial fields in immutable PDF evidence
        run: |
          python scripts/scpi-onboarding/secondPassPdfEvidence.py \
            --manifest scripts/scpi-onboarding/fixtures/sofidynamic-69-second-pass.json \
            --archive-dir test-results/scpi-source-validation/sources/ \
            --report test-results/scpi-source-validation/sofidynamic-69-second-pass-report.json
      - name: Registry 2026 statutes discovery probe (never a regulatory approval)
        run: |
          python scripts/scpi-onboarding/inspectRegistryStatutes2026.py \
            --output test-results/scpi-source-validation/sofidynamic-2026-register-statutes.json
      - name: Execute four-fund bounded industrial documentary trial (no publication)
        run: |
          python scripts/scpi-onboarding/industrialBatch.py \
            --registry scripts/scpi-onboarding/fixtures/industrial-pilots-20261104.json \
            --out test-results/scpi-source-validation/industrial
      - name: Store verified public source binaries and page evidence (no approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidynamic-publisher-pdf-${{ github.run_id }}
          path: test-results/scpi-source-validation/
          retention-days: 30
          if-no-files-found: warn
