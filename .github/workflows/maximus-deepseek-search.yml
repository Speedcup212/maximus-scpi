name: MaximusSCPI - DeepSeek corrective worker (DATA and SEARCH)

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      role:
        description: DATA or SEARCH exact code scope
        required: true
        default: DATA
        type: choice
        options: [DATA, SEARCH]
  push:
    branches: [main]
    paths:
      - ".github/workflows/maximus-deepseek-search.yml"
      - "scripts/agents/deepseekCorrectiveRunner.mjs"
      - "supabase/functions/maximus-search-agent-oidc/index.ts"
      - "supabase/migrations/20261016_deepseek_scoped_corrective_worker.sql"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maximus-deepseek-search.yml"
      - "scripts/agents/deepseekCorrectiveRunner.mjs"
      - "scripts/agents/deepseekCorrectiveRunner.test.mjs"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: maximus-deepseek-corrective
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bounded worker without DeepSeek spend
        run: |
          node --check scripts/agents/deepseekCorrectiveRunner.mjs
          node --test scripts/agents/deepseekCorrectiveRunner.test.mjs

  corrective:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${ secrets.DEEPSEEK_API_KEY }
      CORRECTIVE_ROLE: ${ github.event_name == 'workflow_dispatch' && inputs.role || (github.event.schedule == '17 12 * * *' && 'SEARCH' || 'DATA') }
      GH_TOKEN: ${ github.token }
    steps:
      - name: Checkout current source without automatic publication
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate configured secret and allowed role
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::DEEPSEEK_API_KEY absent"; exit 1; }
          case "$CORRECTIVE_ROLE" in DATA|SEARCH) ;; *) exit 1;; esac
      - name: Claim one existing exact-scope task with GitHub OIDC
        id: claim
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const url='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-search-agent-oidc';
            const oidc=await core.getIDToken('maximus-agent-worker-ygvsddcpohsnaowofuwc');
            async function call(body){
              const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+oidc,'Content-Type':'application/json'},
                body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
              if(!r.ok)throw Error('OIDC corrective bridge HTTP '+r.status);
              return r.json();
            }
            await call({op:'prepare'});
            const result=await call({op:'claim',role:process.env.CORRECTIVE_ROLE});
            if(!result.task){
              core.setOutput('claimed','no');
              core.notice('Worker ready / no eligible DATA or SEARCH exact-scope task. Zero model calls. '+String(result.reason||''));
            }else{
              const t=result.task;
              if(t.role!==process.env.CORRECTIVE_ROLE||t.kind!=='execute'||!t.lease_token||
                 !Array.isArray(t.payload?.issues)||t.payload.issues.length!==1)throw Error('Bad scope claim');
              fs.writeFileSync('/tmp/maximus-corrective-task.json',JSON.stringify(t),{mode:0o600});
              fs.writeFileSync('/tmp/maximus-corrective-scope.json',JSON.stringify(t.payload.issues[0].scope),{mode:0o600});
              core.setOutput('claimed','yes');
            }
      - name: Setup Node
        if: steps.claim.outputs.claimed == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Single DeepSeek direct API call with no shell tools
        if: steps.claim.outputs.claimed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/agents/deepseekCorrectiveRunner.test.mjs
          npm ci --no-audit --no-fund
          node scripts/agents/deepseekCorrectiveRunner.mjs --task /tmp/maximus-corrective-task.json
      - name: Verify candidate and create PR, never merge or deploy
        if: steps.claim.outputs.claimed == 'yes' && success()
        shell: bash
        run: |
          set -euo pipefail
          role="$(echo "$CORRECTIVE_ROLE" | tr '[:upper:]' '[:lower:]')"
          candidate="agents/execution-${role}-${GITHUB_RUN_ID}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const untracked=execFileSync('git',['ls-files','--others','--exclude-standard'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          fs.writeFileSync('/tmp/maximus-corrective-paths.json',JSON.stringify([...new Set([...changed,...untracked])]));
          NODE
          node agents/autonomous/validate-change-scope.mjs --scope /tmp/maximus-corrective-scope.json \
            --paths /tmp/maximus-corrective-paths.json --branch "$candidate"
          npm run build
          node scripts/scpi-candidates/auditCorumE2e.mjs
          git switch -c "$candidate"
          git config user.name "maximus-deepseek-corrective[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const paths=JSON.parse(fs.readFileSync('/tmp/maximus-corrective-paths.json','utf8'));
          if(paths.length!==1)throw Error('Exact one-file candidate required');
          execFileSync('git',['add','--',paths[0]]);
          NODE
          git commit -m "fix(agents): scoped $role correction via DeepSeek [no-deploy]"
          git push origin "HEAD:refs/heads/$candidate"
          gh pr create --base main --head "$candidate" \
            --title "fix(agents): $role DeepSeek candidate (independent QA required)" \
            --body "One scoped code file. Static scope PASS; build PASS. Requires independent QA; no automatic merge, financial certification or Netlify deploy. [no-deploy]"
          pr_url="$(gh pr view "$candidate" --json url --jq '.url')"
          test -n "$pr_url"
          echo "CORRECTIVE_PR=$pr_url" >> "$GITHUB_ENV"
          echo "CORRECTIVE_TESTS_PASS=true" >> "$GITHUB_ENV"
      - name: Record accurate outcome in Supabase
        if: always() && steps.claim.outputs.claimed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const task=JSON.parse(fs.readFileSync('/tmp/maximus-corrective-task.json','utf8'));
            const passed=Boolean(process.env.CORRECTIVE_PR&&process.env.CORRECTIVE_TESTS_PASS==='true');
            const result={
              summary:passed?'One scoped DeepSeek correction tested and submitted as candidate PR, independent QA required':
                'No passing candidate PR; manual review necessary; no production write',
              verdict:passed?'PASS':'REVIEW',
              evidence:[{source:'GitHub Actions bounded corrective runner',
                observed_at:new Date().toISOString(),
                finding:passed?process.env.CORRECTIVE_PR:'No passing candidate; no release authorized'}],
              ...(passed?{implementation_reference:process.env.CORRECTIVE_PR,
                tests:[{name:'exact file scope',status:'PASS'},
                  {name:'production build',status:'PASS'},
                  {name:'CORUM static QA guard',status:'PASS'},
                  {name:'runner tests',status:'PASS'}]}:{})
            };
            const oidc=await core.getIDToken('maximus-agent-worker-ygvsddcpohsnaowofuwc');
            const r=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-search-agent-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+oidc,'Content-Type':'application/json'},
              body:JSON.stringify({op:'complete',task_id:task.id,lease_token:task.lease_token,
                status:passed?'done':'blocked',result}),
              signal:AbortSignal.timeout(20000)
            });
            if(!r.ok)throw Error('Cannot record actual outcome: '+r.status);
            core.notice(passed?'Candidate PR recorded; QA remains necessary':'Candidate blocked, no fabricated PASS');
