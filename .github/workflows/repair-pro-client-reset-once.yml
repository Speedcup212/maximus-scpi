name: Repair Pro and reset Client V1 once

on:
  push:
    branches:
      - repair/pro-client-rebuild-20261005
    paths:
      - '.github/workflows/repair-pro-client-reset-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore exact pre-Client-V1 files
        shell: bash
        run: |
          set -euo pipefail
          BASE=22c1f5c9c2d2481abeddc5423a8d65a87f5b9495
          for f in \
            src/app/components/AppLayout.tsx \
            src/app/components/AuthGuard.tsx \
            src/app/components/RoleGuard.tsx \
            src/app/pages/AppEntry.tsx \
            src/app/pages/AppLogin.tsx \
            src/app/pages/ClientDashboard.tsx \
            src/main.tsx; do
            git show "$BASE:$f" > "$f"
          done
          rm -f supabase/migrations/20261005165000_create_client_scpi_positions.sql
          rm -f supabase/migrations/20261005171500_harden_client_scpi_positions.sql
          cat > supabase/migrations/20261005215000_remove_client_scpi_positions_v1.sql <<'SQL'
          drop table if exists public.client_scpi_positions;
          SQL
      - name: Repair Pro routing and auth context
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()
          old_route = "if (path.startsWith('pro')) {"
          new_route = "if (path === 'pro' || path.startsWith('pro/')) {"
          if s.count(old_route) != 1:
              raise SystemExit(f'Expected one Pro matcher, found {s.count(old_route)}')
          app.write_text(s.replace(old_route, new_route, 1))

          main = Path('src/main.tsx')
          m = main.read_text()
          import_anchor = "import HomeApp from './HomeApp';"
          auth_import = "import { AuthProvider } from './contexts/AuthContext';"
          if auth_import not in m:
              if m.count(import_anchor) != 1:
                  raise SystemExit('HomeApp import anchor not found exactly once')
              m = m.replace(import_anchor, import_anchor + "\n" + auth_import, 1)
          old_fallback = "  const module = await import('./App');\n  return module.default;"
          new_fallback = "  const module = await import('./App');\n  const LegacyApp = module.default;\n  const LegacyAppWithAuth = () => (\n    <AuthProvider>\n      <LegacyApp />\n    </AuthProvider>\n  );\n  return LegacyAppWithAuth;"
          if m.count(old_fallback) != 1:
              raise SystemExit(f'Legacy App fallback anchor count={m.count(old_fallback)}')
          main.write_text(m.replace(old_fallback, new_fallback, 1))
      - name: Verify reset invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "client_scpi_positions" -n src || (echo 'Client V1 table reference remains in src' && exit 1)
          ! grep -R "maximusPostLoginPath\|maximusLoginEmailHint" -n src || (echo 'Client V1 auth routing remains in src' && exit 1)
          ! grep -R "URL directe de l'espace client" -n src || (echo 'Client V1 direct rewrite remains' && exit 1)
          grep -q "path === 'pro' || path.startsWith('pro/')" src/App.tsx
          grep -q "import { AuthProvider } from './contexts/AuthContext';" src/main.tsx
          grep -q '<AuthProvider>' src/main.tsx
          test ! -e supabase/migrations/20261005165000_create_client_scpi_positions.sql
          test ! -e supabase/migrations/20261005171500_harden_client_scpi_positions.sql
          for f in \
            src/app/components/AppLayout.tsx \
            src/app/components/AuthGuard.tsx \
            src/app/components/RoleGuard.tsx \
            src/app/pages/AppEntry.tsx \
            src/app/pages/AppLogin.tsx \
            src/app/pages/ClientDashboard.tsx; do
            cmp -s "$f" <(git show 22c1f5c9c2d2481abeddc5423a8d65a87f5b9495:"$f") || { echo "$f differs from pre-V1 baseline"; exit 1; }
          done
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Start preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/maximus-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/maximus-vite.log
          exit 1
      - name: Browser smoke Pro portal and CGP login
        run: node scripts/smoke-professionnels.mjs
      - name: Commit verified repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'maximus-repair'
          git config user.email 'maximus-repair@users.noreply.github.com'
          git rm .github/workflows/repair-pro-client-reset-once.yml
          git add src/App.tsx \
            src/app/components/AppLayout.tsx \
            src/app/components/AuthGuard.tsx \
            src/app/components/RoleGuard.tsx \
            src/app/pages/AppEntry.tsx \
            src/app/pages/AppLogin.tsx \
            src/app/pages/ClientDashboard.tsx \
            src/main.tsx \
            scripts/smoke-professionnels.mjs \
            supabase/migrations/20261005215000_remove_client_scpi_positions_v1.sql
          git add -u supabase/migrations
          git diff --cached --quiet && exit 0
          git commit -m 'fix(pro): restore auth and remove client V1 [skip netlify]'
          git push origin HEAD:repair/pro-client-rebuild-20261005
