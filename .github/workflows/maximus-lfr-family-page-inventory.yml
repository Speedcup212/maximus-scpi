name: MaximusSCPI - 14 La Francaise issuer originals page inventory (source only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-lfr-family-page-inventory.yml'
      - 'scripts/agents/la_francaise_family_field_inventory.py'
      - 'scripts/agents/la_francaise_family_field_inventory_test.py'
      - 'scripts/agents/publisher-families/la-francaise-2026-s1-source-inventory.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-lfr-family-page-inventory.yml'
      - 'scripts/agents/la_francaise_family_field_inventory.py'
      - 'scripts/agents/la_francaise_family_field_inventory_test.py'
      - 'scripts/agents/publisher-families/la-francaise-2026-s1-source-inventory.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfr-issuer-page-inventory-${{ github.event_name == 'pull_request' && format('pr-{0}',github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF parser
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Reject forged hosts, changed originals, invented active fund status
        run: python -m unittest scripts/agents/la_francaise_family_field_inventory_test.py -v

  issuer-family-page-inventory:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        slug: [lf-croissance-et-territoires, lf-grand-paris-habitation, lf-les-grands-palais, lf-renovimmo, multihabitation-10, multihabitation-2, multihabitation-3, multihabitation-4, multihabitation-5, multihabitation-6, multihabitation-7, multihabitation-8, multihabitation-9, ufg-pierre-et-vacances]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install two independent PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify exact original issuer SHA, PDF identity/period and inventory page labels only
        run: |
          python scripts/agents/la_francaise_family_field_inventory.py \
            --manifest scripts/agents/publisher-families/la-francaise-2026-s1-source-inventory.json \
            --slug ${{ matrix.slug }} \
            --output test-results/la-francaise/${{ matrix.slug }}.json
      - name: Keep one read-only evidence report per candidate, including explicit block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-francaise-inventory-${{ matrix.slug }}-${{ github.run_id }}
          path: test-results/la-francaise/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 14
