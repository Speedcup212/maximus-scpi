name: MaximusSCPI — existing 5 agents parallel audit

on:
  schedule:
    # Twice per day, Paris timezone handled by existing SQL daily quota.
    - cron: "27 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maximus-agent-parallel.yml"
      - "scripts/agents/parallelAuditRunner.mjs"
      - "scripts/agents/parallelAuditRunner.test.mjs"
      - "scripts/agents/candidateDocumentEvidence.test.mjs"
      - "scripts/agents/candidate_pdf_binary_proof.py"
      - "scripts/agents/candidate_pdf_binary_proof_test.py"
      - "scripts/agents/candidateBinaryEvidence.mjs"
      - "scripts/agents/candidateBinaryEvidence.test.mjs"
      - "supabase/functions/maximus-agent-audit-oidc/index.ts"
      - "supabase/migrations/20261106_recovery117_parallel_readonly_audits.sql"
      - "supabase/migrations/20261106_recovery118_candidate_documentary_handoff.sql"
      - "supabase/migrations/20261106_recovery119_candidate_retry_guards.sql"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maximus-agent-parallel.yml"
      - "scripts/agents/parallelAuditRunner.mjs"
      - "scripts/agents/parallelAuditRunner.test.mjs"
      - "scripts/agents/candidateDocumentEvidence.test.mjs"
      - "scripts/agents/candidate_pdf_binary_proof.py"
      - "scripts/agents/candidate_pdf_binary_proof_test.py"
      - "scripts/agents/candidateBinaryEvidence.mjs"
      - "scripts/agents/candidateBinaryEvidence.test.mjs"
      - "supabase/functions/maximus-agent-audit-oidc/index.ts"
      - "supabase/migrations/20261106_recovery117_parallel_readonly_audits.sql"
      - "supabase/migrations/20261106_recovery118_candidate_documentary_handoff.sql"
      - "supabase/migrations/20261106_recovery119_candidate_retry_guards.sql"

permissions:
  contents: read

concurrency:
  group: maximus-parallel-audit
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Safety and deterministic parallel audit contract
        run: |
          node --check scripts/agents/parallelAuditRunner.mjs
          node --test scripts/agents/parallelAuditRunner.test.mjs scripts/agents/candidateDocumentEvidence.test.mjs scripts/agents/candidateBinaryEvidence.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing PDF auditor dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF==1.26.5"
      - name: Deterministic publisher-binary security tests
        run: python -m unittest scripts/agents/candidate_pdf_binary_proof_test.py -v

  control:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: CONTROL — prepare existing task queue through GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const oidc=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            // Candidate integration has priority over repetitive generic
            // monitoring. Do not spend DATA/SEARCH/ANALYST daily quotas on the
            // generic audit while the candidate queue remains actionable.
            const endpoint='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc';
            async function prepare(op){
              const res=await fetch(endpoint,{
                method:'POST',headers:{Authorization:'Bearer '+oidc,'Content-Type':'application/json'},
                body:JSON.stringify({op}),signal:AbortSignal.timeout(20000)});
              if(!res.ok)throw Error('CONTROL '+op+' bridge HTTP '+res.status);
              return res.json();
            }
            const candidateResult=await prepare('prepare_candidate');
            if(candidateResult.prepared===true){
              if(candidateResult.cycle?.deploy_allowed!==false)
                throw Error('Candidate source mission cannot authorize publication');
              core.notice('CONTROL reserved this cycle for candidate '+candidateResult.cycle.scpi_slug+
                '; generic audit deliberately skipped to preserve role quotas.');
            }else{
              // Generic monitoring is a fallback, not a competing daily
              // consumer of the strict 2-claim-per-role quota.
              const mondayUTC=new Date().getUTCDay()===1;
              if(candidateResult.cycle?.reason==='agents_disabled')
                throw Error('CONTROL agents disabled');
              if(mondayUTC){
                const generic=await prepare('prepare');
                if(generic.prepared!==true||generic.cycle?.deploy_allowed!==false)
                  throw Error('CONTROL refused generic monitoring preparation');
                core.notice('Weekly generic health audit prepared (no eligible candidate).');
              }else{
                core.notice('No candidate prepared: generic audit deferred until weekly fallback; no model calls.');
              }
            }

  source-proof:
    needs: control
    if: needs.control.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch exact current candidate manifest over authorized GitHub OIDC
        uses: actions/github-script@v7
        id: candidate
        with:
          script: |
            const fs=require('node:fs');
            const jwt=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},
              body:JSON.stringify({op:'candidate_manifest'}),signal:AbortSignal.timeout(20000)});
            if(!res.ok)throw Error('OIDC candidate manifest rejected HTTP '+res.status);
            const manifest=await res.json();
            if(manifest.deploy_allowed!==false)throw Error('Unsafe candidate publication flag');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/candidate-manifest.json',
              JSON.stringify(manifest),{mode:0o600});
            core.setOutput('exists',manifest.exists===true?'yes':'no');
            core.notice('Source proof selection: '+(manifest.candidate_slug||'no candidate')+
              '; registered PDFs '+(manifest.documents?.length||0)+'; no release.');
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only existing PDF auditor and independent Poppler
        if: steps.candidate.outputs.exists == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check "PyMuPDF==1.26.5"
      - name: Live official PDF download, identity, period, SHA and two-reader proof
        if: steps.candidate.outputs.exists == 'yes'
        env:
          CANDIDATE_SOURCE_MANIFEST: ${{ runner.temp }}/candidate-manifest.json
          CANDIDATE_BINARY_OUT: ${{ runner.temp }}/candidate-binary-proof
        run: |
          python scripts/agents/candidate_pdf_binary_proof.py \
            --manifest "$CANDIDATE_SOURCE_MANIFEST" --out "$CANDIDATE_BINARY_OUT"
      - name: Explicit no-candidate checkpoint
        if: steps.candidate.outputs.exists == 'no'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/candidate-binary-proof"
          printf '%s\n' '{"status":"no_candidate","candidate_slug":null,"documents":[],"financial_certified":false,"deploy_allowed":false}' > "${{ runner.temp }}/candidate-binary-proof/proof.json"
      - name: Retain issuer source binary and page proof for independent QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-binary-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-binary-proof/
          retention-days: 7
          if-no-files-found: error

  workers:
    needs: control
    if: needs.control.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        role: [DATA, SEARCH, ANALYST]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Claim exactly one existing audit per role
        id: claim
        uses: actions/github-script@v7
        env:
          WORKER_ROLE: ${{ matrix.role }}
        with:
          script: |
            const fs=require('node:fs');
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const response=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'claim',role:process.env.WORKER_ROLE}),
              signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('Worker claim bridge HTTP '+response.status);
            const result=await response.json();
            if(!result.task){core.setOutput('claimed','no');core.notice('No eligible '+process.env.WORKER_ROLE+' audit, no model call. '+(result.reason||''));}
            else{
              if(result.task.role!==process.env.WORKER_ROLE||result.task.kind!=='audit'||
                 result.task.deploy_allowed!==false||!result.task.lease_token)
                 throw Error('Worker task mismatch');
              fs.writeFileSync(process.env.RUNNER_TEMP+'/maximus-parallel-task.json',
                JSON.stringify(result.task),{mode:0o600});
              core.setOutput('claimed','yes');
            }
      - uses: actions/checkout@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          node-version: "22"
      - name: One bounded DeepSeek read-only investigation
        if: steps.claim.outputs.claimed == 'yes'
        env:
          AGENT_ROLE: ${{ matrix.role }}
          AGENT_TASK_FILE: ${{ runner.temp }}/maximus-parallel-task.json
          AGENT_RESULT_FILE: ${{ runner.temp }}/maximus-parallel-result.json
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/agents/parallelAuditRunner.mjs
      - name: Record actual audit result in existing Supabase run
        if: always() && steps.claim.outputs.claimed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const root=process.env.RUNNER_TEMP+'/maximus-parallel-';
            const task=JSON.parse(fs.readFileSync(root+'task.json','utf8'));
            let outcome;
            try{outcome=JSON.parse(fs.readFileSync(root+'result.json','utf8'));}
            catch{
              outcome={status:'blocked',result:{summary:'No recorded worker result; no PASS or release',
                verdict:'REVIEW',deploy_allowed:false,
                evidence:[{source:'GitHub Actions',observed_at:new Date().toISOString(),
                  finding:'Worker step did not produce verified output'}]}};
            }
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const response=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'complete',task_id:task.id,lease_token:task.lease_token,
                status:outcome.status,result:outcome.result}),
              signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('Cannot record audited run HTTP '+response.status);
            core.notice('Recorded '+task.role+' '+outcome.status+'/'+outcome.result.verdict+'; publication not authorized');

  qa:
    needs: [control, workers, source-proof]
    if: needs.control.result == 'success' && needs.workers.result == 'success' && needs.source-proof.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: QA — claim only after all three prior audit records
        id: claim
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const endpoint='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc';
            async function call(body){
              const response=await fetch(endpoint,{method:'POST',
                headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw Error('QA bridge HTTP '+response.status);
              return response.json();
            }
            const result=await call({op:'claim',role:'QA'});
            if(!result.task){
              core.setOutput('claimed','no');
              const status=await call({op:'candidate_status'});
              const rows=Array.isArray(status.tasks)?status.tasks:[];
              if(rows.length===4&&rows.some(t=>t.status!=='done')){
                core.setFailed('Candidate documentary cycle incomplete; no QA approval. '+rows.map(t=>t.role+':'+t.status).join(','));
              }else{
                core.notice('No eligible QA audit, no model call. '+(result.reason||''));
              }
            }
            else{
              if(result.task.role!=='QA'||result.task.kind!=='audit'||result.task.deploy_allowed!==false)
                throw Error('Untrusted QA task');
              const upstream=await call({op:'qa_context',task_id:result.task.id,
                lease_token:result.task.lease_token});
              fs.writeFileSync(process.env.RUNNER_TEMP+'/maximus-parallel-task.json',
                JSON.stringify(result.task),{mode:0o600});
              fs.writeFileSync(process.env.RUNNER_TEMP+'/maximus-parallel-qa.json',
                JSON.stringify(upstream),{mode:0o600});
              core.setOutput('claimed','yes');
            }
      - uses: actions/checkout@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          node-version: "22"
      - name: Restore verified publisher PDF artifacts for QA
        if: steps.claim.outputs.claimed == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: candidate-binary-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-binary-proof
      - name: Validate provenance of source-proof report
        if: steps.claim.outputs.claimed == 'yes'
        env:
          AGENT_TASK_FILE: ${{ runner.temp }}/maximus-parallel-task.json
          AGENT_BINARY_PROOF_FILE: ${{ runner.temp }}/candidate-binary-proof/proof.json
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {verifyCandidateBinaryEvidence} from './scripts/agents/candidateBinaryEvidence.mjs'; const task=JSON.parse(fs.readFileSync(process.env.AGENT_TASK_FILE,'utf8')); const proof=JSON.parse(fs.readFileSync(process.env.AGENT_BINARY_PROOF_FILE,'utf8')); const state=verifyCandidateBinaryEvidence(task,proof); console.log('Independent PDF provenance: '+(state.kind||'not required')+' financial_certified=false');"
      - name: Deterministic independent QA — never approve publication
        if: steps.claim.outputs.claimed == 'yes'
        env:
          AGENT_ROLE: QA
          AGENT_TASK_FILE: ${{ runner.temp }}/maximus-parallel-task.json
          AGENT_RESULT_FILE: ${{ runner.temp }}/maximus-parallel-result.json
          AGENT_QA_CONTEXT_FILE: ${{ runner.temp }}/maximus-parallel-qa.json
          AGENT_BINARY_PROOF_FILE: ${{ runner.temp }}/candidate-binary-proof/proof.json
        run: node scripts/agents/parallelAuditRunner.mjs
      - name: Store independent QA audit in existing queue
        if: always() && steps.claim.outputs.claimed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const root=process.env.RUNNER_TEMP+'/maximus-parallel-';
            const task=JSON.parse(fs.readFileSync(root+'task.json','utf8'));
            let outcome;
            try{outcome=JSON.parse(fs.readFileSync(root+'result.json','utf8'));}
            catch{outcome={status:'blocked',result:{summary:'Independent QA failed to produce evidence',
                verdict:'REVIEW',deploy_allowed:false,evidence:[
                {source:'GitHub Actions',observed_at:new Date().toISOString(),
                finding:'QA failed closed; no independent acceptance'}]}};}
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const response=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'complete',task_id:task.id,lease_token:task.lease_token,
                status:outcome.status,result:outcome.result}),
              signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('QA recording failure HTTP '+response.status);
            core.notice('QA completed with '+outcome.result.verdict+' (NOT SCPI admission)');
