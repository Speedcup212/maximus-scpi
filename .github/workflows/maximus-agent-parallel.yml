name: MaximusSCPI — 20 SCPI candidate dossiers daily (existing 5 agents)

on:
  schedule:
    - cron: "27 6 * * *"
    # Recovery window: the daily SQL cohort is idempotent; no duplicate claims.
    - cron: "43 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maximus-agent-parallel.yml"
      - "scripts/agents/parallelAuditRunner.mjs"
      - "scripts/agents/controlEvidenceRouting.mjs"
      - "scripts/agents/controlEvidenceRouting.test.mjs"
      - "supabase/migrations/20261109_recovery195_orphan_running_lease_guard.sql"
      - "scripts/agents/agentSchedulingCrash.test.mjs"
      - "supabase/migrations/20261107_recovery177_control_missing_metric_routing.sql"
      - "supabase/migrations/20261108_recovery179_true_strict_admission_routes.sql"
      - "supabase/migrations/20261108_recovery180_reconcile_verified_tof_backfill.sql"
      - "supabase/migrations/20261108_recovery182_semantic_evidence_quarantine.sql"
      - "supabase/migrations/20261108_recovery183_aestiam_horizon_source_provenance.sql"
      - "supabase/migrations/20261108_recovery184_historical_tof_diagnostics.sql"
      - "supabase/migrations/20261108_recovery184_control_historical_tof_summary.sql"
      - "supabase/migrations/20261108_recovery185_historical_tof_live_queue.sql"
      - "supabase/migrations/20261108_recovery192_staged_historical_tof_geometry_qa.sql"
      - "supabase/migrations/20261108_recovery191_iroko_atlas_independent_tof_and_source_attestation.sql"
      - "supabase/migrations/20261108_recovery181_attest_issuer_source_sha.sql"
      - "supabase/functions/scpi-bulletin-watch/index.ts"
      - "supabase/functions/scpi-bulletin-watch/sourceProvenance.mjs"
      - "scripts/scpi-onboarding/publisherPdfAudit.py"
      - "scripts/agents/candidate_pdf_binary_proof_test.py"
      - "scripts/agents/candidate_pdf_binary_proof.py"
      - "scripts/agents/historicalArchiveProof.py"
      - "scripts/agents/historicalTofGeometry.py"
      - "scripts/agents/historical_tof_geometry_test.py"
      - "scripts/agents/historical_archive_proof_test.py"
      - "supabase/migrations/20261108_recovery186_original_archive_retry.sql"
      - "scripts/agents/candidateBinaryEvidence.mjs"
      - "supabase/functions/maximus-agent-audit-oidc/index.ts"
      - "supabase/migrations/20261106_recovery122_candidate20.sql"
      - "supabase/migrations/20261106_recovery126_evidence_first_gates.sql"
      - "supabase/migrations/20261106_recovery127_watchdog_allowed_state.sql"
      - "scripts/agents/recovery126IndustrialGates.test.mjs"
      - "scripts/agents/candidateSchedulingRecovery.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maximus-agent-parallel.yml"
      - "scripts/agents/parallelAuditRunner.mjs"
      - "scripts/agents/controlEvidenceRouting.mjs"
      - "scripts/agents/controlEvidenceRouting.test.mjs"
      - "supabase/migrations/20261109_recovery195_orphan_running_lease_guard.sql"
      - "scripts/agents/agentSchedulingCrash.test.mjs"
      - "supabase/migrations/20261107_recovery177_control_missing_metric_routing.sql"
      - "supabase/migrations/20261108_recovery179_true_strict_admission_routes.sql"
      - "supabase/migrations/20261108_recovery180_reconcile_verified_tof_backfill.sql"
      - "supabase/migrations/20261108_recovery182_semantic_evidence_quarantine.sql"
      - "supabase/migrations/20261108_recovery183_aestiam_horizon_source_provenance.sql"
      - "supabase/migrations/20261108_recovery184_historical_tof_diagnostics.sql"
      - "supabase/migrations/20261108_recovery184_control_historical_tof_summary.sql"
      - "supabase/migrations/20261108_recovery185_historical_tof_live_queue.sql"
      - "supabase/migrations/20261108_recovery192_staged_historical_tof_geometry_qa.sql"
      - "supabase/migrations/20261108_recovery191_iroko_atlas_independent_tof_and_source_attestation.sql"
      - "supabase/migrations/20261108_recovery181_attest_issuer_source_sha.sql"
      - "supabase/functions/scpi-bulletin-watch/index.ts"
      - "supabase/functions/scpi-bulletin-watch/sourceProvenance.mjs"
      - "scripts/scpi-onboarding/publisherPdfAudit.py"
      - "scripts/agents/candidate_pdf_binary_proof_test.py"
      - "scripts/agents/candidate_pdf_binary_proof.py"
      - "scripts/agents/historicalArchiveProof.py"
      - "scripts/agents/historicalTofGeometry.py"
      - "scripts/agents/historical_tof_geometry_test.py"
      - "scripts/agents/historical_archive_proof_test.py"
      - "supabase/migrations/20261108_recovery186_original_archive_retry.sql"
      - "scripts/agents/candidateDocumentEvidence.test.mjs"
      - "scripts/agents/parallelAuditRunner.test.mjs"
      - "scripts/agents/agentSchedulingCrash.test.mjs"
      - "scripts/agents/candidate20Batch.test.mjs"
      - "supabase/functions/maximus-agent-audit-oidc/index.ts"
      - "supabase/migrations/20261106_recovery122_candidate20.sql"
      - "supabase/migrations/20261106_recovery126_evidence_first_gates.sql"
      - "supabase/migrations/20261106_recovery127_watchdog_allowed_state.sql"
      - "scripts/agents/recovery126IndustrialGates.test.mjs"

permissions:
  contents: read

concurrency:
  # PR contract tests must never wait behind a 20-SCPI production matrix.
  # Production schedule/dispatch/push still share one collision-safe lane.
  group: ${{ github.event_name == 'pull_request' && format('maximus-existing-agent-candidate20-pr-{0}', github.event.pull_request.number) || 'maximus-existing-agent-candidate20' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contract, crash, cross-SCPI and admission safety
        run: |
          node --check scripts/agents/parallelAuditRunner.mjs
          node --test scripts/agents/parallelAuditRunner.test.mjs scripts/agents/candidateDocumentEvidence.test.mjs scripts/agents/candidateBinaryEvidence.test.mjs scripts/agents/agentSchedulingCrash.test.mjs scripts/agents/candidate20Batch.test.mjs scripts/agents/recovery126IndustrialGates.test.mjs scripts/agents/candidateSchedulingRecovery.test.mjs scripts/agents/controlEvidenceRouting.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF auditor for mock publisher security tests
        run: python -m pip install --disable-pip-version-check "PyMuPDF==1.26.5"
      - name: PDF issuer and SHA proof security tests
        run: python -m unittest scripts/agents/candidate_pdf_binary_proof_test.py -v
      - name: Historical original archive SHA and independent-read security tests
        run: python -m unittest scripts/agents/historical_archive_proof_test.py -v
      - name: Historical TOF bbox semantics regression
        run: python -m unittest scripts/agents/historical_tof_geometry_test.py -v

  control:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      slugs: ${{ steps.dispatch.outputs.slugs || '[]' }}
      historical: ${{ steps.historical.outputs.documents || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: CONTROL — prepare exactly one 20-SCPI cohort on existing Supabase queue
        id: dispatch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'prepare_batch20'}),signal:AbortSignal.timeout(25000)});
            if(!res.ok)throw Error('CONTROL candidate20 preparation HTTP '+res.status);
            const payload=await res.json();
            if(payload.deploy_allowed!==false||payload.cycle?.deploy_allowed!==false)
              throw Error('Financial publication is forbidden');
            const slugs=payload.cycle?.slugs;
            if(!Array.isArray(slugs)||slugs.length>20||
               slugs.some(s=>typeof s!=='string'||!/^[a-z0-9-]{2,100}$/.test(s))||
               new Set(slugs).size!==slugs.length)throw Error('Invalid candidate cohort');
            core.setOutput('slugs',JSON.stringify(slugs));
            core.notice('CONTROL selected '+slugs.length+' distinct SCPI; 0 finance certified, 0 deployments');

      - name: CONTROL — classify existing SCPI evidence without new tasks or AI spend
        uses: actions/github-script@v7
        with:
          script: |
            const path=require('node:path');
            const {pathToFileURL}=require('node:url');
            const {validateEvidenceRoutingPlan}=await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,
                'scripts/agents/controlEvidenceRouting.mjs')).href);
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
                method:'POST',
                headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                body:JSON.stringify({op:'control_existing_metric_triage'}),
                signal:AbortSignal.timeout(25000)
              });
            if(!res.ok)throw Error('CONTROL triage OIDC HTTP '+res.status);
            const plan=await res.json();
            const counts=validateEvidenceRoutingPlan(plan);
            core.notice('CONTROL existing: '+counts.strict_pass+'/'+counts.existing_total+
              ' strict PASS; '+counts.strict_fail+' FAIL, '+counts.families+
              ' evidence families, '+counts.evidence_items+
              ' overlapping evidence/strict issues. 0 tasks created, 0 AI calls.');
            for(const family of plan.families){
              core.notice('CONTROL route '+family.route_family+' → '+family.owner_role+
                '; '+family.funds+' SCPI; '+family.evidence_items+
                ' cases; overlap in '+family.existing_role_task_overlaps+' current tasks');
            }

      - name: CONTROL — dispatch historical TOF QA jobs on existing task queue
        id: historical
        uses: actions/github-script@v7
        with:
          script: |
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'historical_prepare'}),signal:AbortSignal.timeout(25000)});
            if(!res.ok)throw Error('Historical TOF dispatch HTTP '+res.status);
            const p=await res.json();
            if(p.deploy_allowed!==false||p.financial_certified!==false||
               !Array.isArray(p.documents)||p.documents.length>3||
               p.documents.some(x=>!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(x.scpi_slug)||
                 !/^20[0-9]{2}-T[1-4]$/.test(x.source_period)))
              throw Error('Unsafe historical dispatch');
            core.setOutput('documents',JSON.stringify(p.documents));
            core.notice('Historical source QA: '+p.documents.length+' jobs, '+p.prepared+
              ' newly queued; 0 certifications');

  historical-tof-financial-geometry:
    # Read-only follow-up to RECOVERY-186 on three original source PDFs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - scpi_slug: novapierre-1
            period: 2024-T4
            sha: 3296b51f63b420914be88a4004179d40cf3b2f2bdd3baee9cd4d8e4f241f1c54
          - scpi_slug: novapierre-residentiel
            period: 2022-T1
            sha: 6997ac5572b2907f6ab4e3b4d1f8dce08a750e266b1431dc8dbe6dab4a450708
          - scpi_slug: cristal-rente
            period: 2026-T2
            sha: d3cdc6ce4955a226accf191df1c1a9a2ffda38605f1bece8d76cac9761fe680a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Retrieve exact original private issuer PDF, bound to completed QA
        uses: actions/github-script@v7
        env:
          SOURCE_SLUG: ${{ matrix.scpi_slug }}
          SOURCE_PERIOD: ${{ matrix.period }}
          SOURCE_SHA: ${{ matrix.sha }}
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'historical_metric_original',
                scpi_slug:process.env.SOURCE_SLUG,source_period:process.env.SOURCE_PERIOD}),
              signal:AbortSignal.timeout(30000)});
            if(!res.ok)throw Error('Original archive PDF HTTP '+res.status);
            if(res.headers.get('content-type')?.split(';')[0]!=='application/pdf'||
               res.headers.get('x-scpi-slug')!==process.env.SOURCE_SLUG||
               res.headers.get('x-source-period')!==process.env.SOURCE_PERIOD||
               res.headers.get('x-original-sha256')!==process.env.SOURCE_SHA)
              throw Error('Original issuer SHA/source header mismatch');
            const bytes=Buffer.from(await res.arrayBuffer());
            const sha=crypto.createHash('sha256').update(bytes).digest('hex');
            if(bytes.length<1024||bytes.length>20000000||sha!==process.env.SOURCE_SHA)
              throw Error('Original PDF bytes changed');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/historical-financial-original.pdf',bytes,{mode:0o600});
            fs.writeFileSync(process.env.RUNNER_TEMP+'/historical-financial-manifest.json',
              JSON.stringify({scpi_slug:process.env.SOURCE_SLUG,
                source_period:process.env.SOURCE_PERIOD,sha256:sha}),{mode:0o600});
            core.notice('Exact publisher archive '+process.env.SOURCE_SLUG+
              '/'+process.env.SOURCE_PERIOD+' verified; finance not certified');
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install both geometry readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check "PyMuPDF==1.26.5"
      - name: Independent TOF geometry, semantic labels, exact issuer period
        env:
          SOURCE_SLUG: ${{ matrix.scpi_slug }}
        run: |
          python scripts/agents/historicalTofGeometry.py --slug "$SOURCE_SLUG" \
            --pdf "$RUNNER_TEMP/historical-financial-original.pdf" \
            --manifest "$RUNNER_TEMP/historical-financial-manifest.json" \
            --out "$RUNNER_TEMP/historical-tof-geometry.json"
      - name: Retain only the geometry report, never the private PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery187-tof-geometry-${{ matrix.scpi_slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}/historical-tof-geometry.json
          if-no-files-found: warn
          retention-days: 7

  historical-tof-proof:
    needs: control
    if: needs.control.result == 'success' && needs.control.outputs.historical != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        document: ${{ fromJSON(needs.control.outputs.historical) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Claim exact historical publisher PDF task
        id: claim
        uses: actions/github-script@v7
        env:
          HISTORICAL_SLUG: ${{ matrix.document.scpi_slug }}
          HISTORICAL_PERIOD: ${{ matrix.document.source_period }}
        with:
          script: |
            const fs=require('node:fs');
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'historical_claim',scpi_slug:process.env.HISTORICAL_SLUG,
                source_period:process.env.HISTORICAL_PERIOD}),signal:AbortSignal.timeout(25000)});
            if(!res.ok)throw Error('Historical claim HTTP '+res.status);
            const x=await res.json();
            if(!x.task)throw Error('No historical QA task: '+x.reason);
            if(x.deploy_allowed!==false||x.financial_certified!==false||
               x.task.scpi_slug!==process.env.HISTORICAL_SLUG||
               x.task.source_period!==process.env.HISTORICAL_PERIOD||
               x.manifest?.candidate_slug!==process.env.HISTORICAL_SLUG||
               x.manifest?.documents?.length!==1)
              throw Error('Cross-fund historical claim');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/historical-task.json',
              JSON.stringify(x.task),{mode:0o600});
            fs.writeFileSync(process.env.RUNNER_TEMP+'/historical-manifest.json',
              JSON.stringify(x.manifest),{mode:0o600});
            core.setOutput('has_work','yes');
      - uses: actions/setup-python@v5
        if: steps.claim.outputs.has_work == 'yes'
        with:
          python-version: "3.12"
      - name: Install two independent official PDF readers
        if: steps.claim.outputs.has_work == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check "PyMuPDF==1.26.5"
      - name: Verify exact publisher bytes, period, identity and SHA
        id: issuer
        if: steps.claim.outputs.has_work == 'yes'
        continue-on-error: true
        run: |
          python scripts/agents/candidate_pdf_binary_proof.py --manifest \
            "$RUNNER_TEMP/historical-manifest.json" --out "$RUNNER_TEMP/historical-proof"
      - name: Recover exact originally archived PDF when publisher is unavailable
        id: archived
        if: steps.issuer.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const base=process.env.RUNNER_TEMP;
            const task=JSON.parse(fs.readFileSync(base+'/historical-task.json','utf8'));
            const manifest=JSON.parse(fs.readFileSync(base+'/historical-manifest.json','utf8'));
            const expected=manifest.documents[0].pdf_sha256;
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const endpoint='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc';
            const res=await fetch(endpoint,{method:'POST',
              headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'historical_archive_pdf',task_id:task.id,lease_token:task.lease_token}),
              signal:AbortSignal.timeout(30000)});
            if(!res.ok)throw Error('Exact private archived issuer PDF not accessible, status='+res.status);
            if(res.headers.get('content-type')?.split(';')[0]!=='application/pdf')
              throw Error('Private archive content type mismatch');
            const buffer=Buffer.from(await res.arrayBuffer());
            const actual=crypto.createHash('sha256').update(buffer).digest('hex');
            if(buffer.length<1024||buffer.length>20000000||expected!==actual||
               res.headers.get('x-original-sha256')!==expected)
              throw Error('Archived issuer PDF identity or SHA mismatch');
            fs.writeFileSync(base+'/historical-archived-original.pdf',buffer,{mode:0o600});
            core.setOutput('got_original','yes');
            core.notice('Exact archived original SHA validated: '+task.scpi_slug+'/'+task.source_period);
      - name: Independent archive PDF review (not financial certification)
        if: steps.archived.outputs.got_original == 'yes'
        run: |
          python scripts/agents/historicalArchiveProof.py --manifest \
            "$RUNNER_TEMP/historical-manifest.json" \
            --pdf "$RUNNER_TEMP/historical-archived-original.pdf" \
            --out "$RUNNER_TEMP/historical-proof"
      - name: Report real source proof back to the existing QA task
        if: always() && steps.claim.outputs.has_work == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const root=process.env.RUNNER_TEMP;
            const task=JSON.parse(fs.readFileSync(root+'/historical-task.json'));
            const manifest=JSON.parse(fs.readFileSync(root+'/historical-manifest.json'));
            let proof;
            try{proof=JSON.parse(fs.readFileSync(root+'/historical-proof/proof.json'));}
            catch{
              const d=manifest.documents[0];
              proof={status:'blocked',candidate_slug:manifest.candidate_slug,
                documents:[{status:'blocked',source_url:d.source_url,source_period:d.source_period,
                  expected_sha256:d.pdf_sha256,error_code:'PDF_AUDIT_TOOL_FAILED',
                  financial_certified:false}],financial_certified:false,deploy_allowed:false};
            }
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'historical_complete',task_id:task.id,
                lease_token:task.lease_token,proof}),signal:AbortSignal.timeout(25000)});
            if(!res.ok)throw Error('Historical completion HTTP '+res.status);
            const x=await res.json();
            if(x.deploy_allowed!==false||x.financial_certified!==false)
              throw Error('Unexpected financial claim');
            core.notice('Historical PDF '+task.scpi_slug+'/'+task.source_period+
              ' status='+x.result?.status+', finance=REVIEW');
            if(x.result?.status!=='done')core.setFailed('PDF origin/SHA validation blocked');
      - name: Retain evidence manifest (no financial publication)
        if: always() && steps.claim.outputs.has_work == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: historical-tof-${{ matrix.document.scpi_slug }}-${{ matrix.document.source_period }}-${{ github.run_id }}
          path: ${{ runner.temp }}/historical-proof/proof.json
          if-no-files-found: warn
          retention-days: 7

  source-proof:
    needs: control
    if: needs.control.result == 'success' && needs.control.outputs.slugs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scpi_slug: ${{ fromJSON(needs.control.outputs.slugs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Fetch only this candidate's official allowlisted PDF manifest via OIDC
        id: manifest
        uses: actions/github-script@v7
        env:
          SCPI_SLUG: ${{ matrix.scpi_slug }}
        with:
          script: |
            const fs=require('node:fs');
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const res=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'batch_manifest',scpi_slug:process.env.SCPI_SLUG}),
              signal:AbortSignal.timeout(25000)});
            if(!res.ok)throw Error('Candidate PDF manifest HTTP '+res.status);
            const p=await res.json();
            if(p.candidate_slug!==process.env.SCPI_SLUG||
               p.deploy_allowed!==false||p.financial_certified!==false||
               !Array.isArray(p.documents))throw Error('Cross-fund PDF manifest mismatch');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/candidate-manifest.json',
              JSON.stringify(p),{mode:0o600});
            core.setOutput('has_docs',p.documents.length>0?'yes':'no');
            core.notice('SCPI '+p.candidate_slug+' registered PDF documents: '+p.documents.length);
      - uses: actions/setup-python@v5
        if: steps.manifest.outputs.has_docs == 'yes'
        with:
          python-version: "3.12"
      - name: Install two readers only for verified-source candidates
        if: steps.manifest.outputs.has_docs == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check "PyMuPDF==1.26.5"
      - name: Download and inspect each registered official PDF from scratch
        if: steps.manifest.outputs.has_docs == 'yes'
        run: |
          python scripts/agents/candidate_pdf_binary_proof.py --manifest \
            "$RUNNER_TEMP/candidate-manifest.json" --out "$RUNNER_TEMP/candidate-binary-proof"
      - name: Explicit source-gap evidence without invented PDF
        if: steps.manifest.outputs.has_docs == 'no'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/candidate-manifest.json'));
            if(p.documents.length!==0)throw Error('Cannot claim source gap when docs exist');
            const root=process.env.RUNNER_TEMP+'/candidate-binary-proof';
            fs.mkdirSync(root,{recursive:true});
            fs.writeFileSync(path.join(root,'proof.json'),JSON.stringify({
              status:'no_verified_documents',candidate_slug:p.candidate_slug,
              documents:[],financial_certified:false,deploy_allowed:false}));
      - name: Persist independent source proof, per SCPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate20-proof-${{ matrix.scpi_slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-binary-proof/
          if-no-files-found: error
          retention-days: 7

  workers:
    needs: control
    if: needs.control.result == 'success' && needs.control.outputs.slugs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scpi_slug: ${{ fromJSON(needs.control.outputs.slugs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Three independent role-specific missions for this SCPI
        uses: actions/github-script@v7
        env:
          SCPI_SLUG: ${{ matrix.scpi_slug }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          script: |
            const {pathToFileURL}=require('node:url'),path=require('node:path');
            const {runModelAudit,candidateSnapshotSha256}=await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,
                'scripts/agents/parallelAuditRunner.mjs')).href);
            const slug=process.env.SCPI_SLUG;
            const endpoint='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc';
            async function call(body){
              const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
              const response=await fetch(endpoint,{
                method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                body:JSON.stringify(body),signal:AbortSignal.timeout(25000)});
              if(!response.ok)throw Error('SCPI role API '+body.op+' HTTP '+response.status);
              return response.json();
            }
            async function execute(role){
              const claimed=await call({op:'batch_claim',role,scpi_slug:slug});
              const task=claimed.task;
              if(!task){
                // Rerun must never consume model tokens or report an already
                // completed REVIEW as an error. An unfinished task still fails.
                const existing=await call({op:'batch_status',scpi_slug:slug});
                const prior=existing.tasks?.find(t=>t.role===role);
                if(prior?.status==='done'&&prior?.verdict==='REVIEW'){
                  return {role,status:'done',tokens:0,reused:true};
                }
                return {role,status:'not_claimed',reason:claimed.reason||'quota_or_dependency'};
              }
              if(task.role!==role||task.payload?.scpi_slug!==slug||
                 task.payload?.batch_mode!=='candidate20'||task.deploy_allowed!==false)
                throw Error('Cross-SCPI task rejected');
              let outcome;
              try{
                const docs=task.payload?.candidate_evidence?.documents||[];
                if(docs.length===0&&role!=='SEARCH'){
                  const snap=task.payload.candidate_evidence;
                  outcome={status:'done',result:{
                    summary:'No verified official PDF for '+slug+
                      '; '+role+' financial metrics are intentionally unverified.',
                    verdict:'REVIEW',deploy_allowed:false,
                    financial_certified:false,
                    model:'none',provider:'deterministic_source_gap',usage:{total_tokens:0},
                    candidate_slug:slug,
                    candidate_snapshot_sha256:candidateSnapshotSha256(snap),
                    evidence:[{source:'maximus_agents.scpi_candidate_pdf_validation',
                      observed_at:new Date().toISOString(),
                      finding:{candidate_slug:slug,verified_pdf_count:0,
                        financial_metrics_certifiable:0,reason:'SOURCE_DOCUMENT_MISSING'}}]}};
                }else{
                  outcome=await runModelAudit(task,{apiKey:process.env.DEEPSEEK_API_KEY});
                }
              }catch(err){
                const message=String(err?.message||'');
                const code=/^[A-Z0-9_]{5,70}$/.test(message)?message:'WORKER_MODEL_ERROR';
                outcome={status:'blocked',result:{
                  summary:'Read-only '+role+' SCPI mission blocked: '+code,
                  verdict:'REVIEW',deploy_allowed:false,
                  evidence:[{source:'GitHub candidate20 worker',observed_at:new Date().toISOString(),
                    finding:{scpi_slug:slug,role,error_code:code,no_release:true}}]}};
              }
              await call({op:'complete',task_id:task.id,
                lease_token:task.lease_token,status:outcome.status,result:outcome.result});
              return {role,status:outcome.status,
                tokens:outcome.result.usage?.total_tokens||0};
            }
            const results=await Promise.allSettled(['DATA','SEARCH','ANALYST'].map(execute));
            const safe=results.map((r,i)=>r.status==='fulfilled'?r.value:
              {role:['DATA','SEARCH','ANALYST'][i],status:'failed_api'});
            for(const r of safe)core.notice('SCPI '+slug+' '+r.role+' '+r.status+
              ' tokens='+(r.tokens||0));
            if(safe.some(r=>r.status!=='done'))
              core.setFailed('SCPI '+slug+' not all DATA/SEARCH/ANALYST done; QA remains restricted.');

  qa:
    needs: [control, workers, source-proof]
    if: always() && needs.control.result == 'success' && needs.control.outputs.slugs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scpi_slug: ${{ fromJSON(needs.control.outputs.slugs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve only this fund's independent binary proof
        uses: actions/download-artifact@v4
        with:
          name: candidate20-proof-${{ matrix.scpi_slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-binary-proof/
      - name: QA role checks 3 agent results plus this fund's live binary PDF evidence
        uses: actions/github-script@v7
        env:
          SCPI_SLUG: ${{ matrix.scpi_slug }}
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const {pathToFileURL}=require('node:url');
            const {buildQAResult}=await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,'scripts/agents/parallelAuditRunner.mjs')).href);
            const slug=process.env.SCPI_SLUG;
            const endpoint='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc';
            async function call(body){
              const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
              const res=await fetch(endpoint,{
                method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                body:JSON.stringify(body),signal:AbortSignal.timeout(25000)});
              if(!res.ok)throw Error('SCPI QA API '+body.op+' HTTP '+res.status);
              return res.json();
            }
            const result=await call({op:'batch_claim',role:'QA',scpi_slug:slug});
            if(!result.task){
              const status=await call({op:'batch_status',scpi_slug:slug});
              const rows=status.tasks||[];
              const alreadyReviewed=rows.length===4&&
                rows.every(t=>t.status==='done'&&t.verdict==='REVIEW');
              if(alreadyReviewed){
                core.notice('QA '+slug+' already completed REVIEW in this cohort; no additional claim or financial PASS');
                return;
              }
              core.setFailed('Independent QA not eligible for '+slug+' (upstream or quota): '+
                JSON.stringify(rows.map(t=>({role:t.role,status:t.status}))));
              return;
            }
            const task=result.task;
            if(task.role!=='QA'||task.payload?.scpi_slug!==slug||
               task.deploy_allowed!==false)throw Error('Cross-SCPI QA task rejected');
            let outcome;
            try{
              const upstream=await call({op:'qa_context',task_id:task.id,
                lease_token:task.lease_token});
              const proof=JSON.parse(fs.readFileSync(path.join(
                process.env.RUNNER_TEMP,'candidate-binary-proof','proof.json'),'utf8'));
              outcome=buildQAResult(task,upstream.upstream,new Date().toISOString(),proof);
            }catch(err){
              outcome={status:'blocked',result:{
                summary:'Independent candidate20 QA cannot validate '+slug+' PDF and model evidence.',
                verdict:'REVIEW',deploy_allowed:false,independent_qa:true,
                evidence:[{source:'GitHub candidate20 QA',observed_at:new Date().toISOString(),
                  finding:{scpi_slug:slug,code:'SOURCE_OR_UPSTREAM_PROOF_REJECTED'}}]}};
            }
            await call({op:'complete',task_id:task.id,lease_token:task.lease_token,
              status:outcome.status,result:outcome.result});
            core.notice('QA '+slug+' '+outcome.status+'/'+outcome.result.verdict+
              '; financial_certified=false; no publication');
            if(outcome.status!=='done')core.setFailed('Independent QA blocked '+slug);
