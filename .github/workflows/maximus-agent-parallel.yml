name: MaximusSCPI — existing 5 agents parallel audit

on:
  schedule:
    # Twice per day, Paris timezone handled by existing SQL daily quota.
    - cron: "27 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maximus-agent-parallel.yml"
      - "scripts/agents/parallelAuditRunner.mjs"
      - "scripts/agents/parallelAuditRunner.test.mjs"
      - "scripts/agents/candidateDocumentEvidence.test.mjs"
      - "scripts/agents/candidateDocumentEvidence.test.mjs"
      - "supabase/functions/maximus-agent-audit-oidc/index.ts"
      - "supabase/migrations/20261106_recovery117_parallel_readonly_audits.sql"
      - "supabase/migrations/20261106_recovery118_candidate_documentary_handoff.sql"
      - "supabase/migrations/20261106_recovery118_candidate_documentary_handoff.sql"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maximus-agent-parallel.yml"
      - "scripts/agents/parallelAuditRunner.mjs"
      - "scripts/agents/parallelAuditRunner.test.mjs"
      - "supabase/functions/maximus-agent-audit-oidc/index.ts"
      - "supabase/migrations/20261106_recovery117_parallel_readonly_audits.sql"

permissions:
  contents: read

concurrency:
  group: maximus-parallel-audit
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Safety and deterministic parallel audit contract
        run: |
          node --check scripts/agents/parallelAuditRunner.mjs
          node --test scripts/agents/parallelAuditRunner.test.mjs scripts/agents/candidateDocumentEvidence.test.mjs

  control:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: CONTROL — prepare existing task queue through GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const oidc=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const response=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+oidc,'Content-Type':'application/json'},
              body:JSON.stringify({op:'prepare'}),signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('CONTROL OIDC bridge HTTP '+response.status);
            const result=await response.json();
            if(result.prepared!==true||result.cycle?.deploy_allowed!==false)
              throw Error('CONTROL refused unsafe or incomplete preparation');
            core.notice('CONTROL prepared existing tasks; no LLM inference and no release. '+JSON.stringify(result.cycle));
            const candidate=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+oidc,'Content-Type':'application/json'},
              body:JSON.stringify({op:'prepare_candidate'}),signal:AbortSignal.timeout(20000)});
            if(!candidate.ok)throw Error('Candidate evidence bridge HTTP '+candidate.status);
            const candidateResult=await candidate.json();
            if(candidateResult.cycle?.deploy_allowed!==false && candidateResult.prepared===true)
              throw Error('Unsafe candidate handoff');
            core.notice('Candidate documentary handoff: '+JSON.stringify(candidateResult.cycle));

  workers:
    needs: control
    if: needs.control.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        role: [DATA, SEARCH, ANALYST]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Claim exactly one existing audit per role
        id: claim
        uses: actions/github-script@v7
        env:
          WORKER_ROLE: ${{ matrix.role }}
        with:
          script: |
            const fs=require('node:fs');
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const response=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'claim',role:process.env.WORKER_ROLE}),
              signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('Worker claim bridge HTTP '+response.status);
            const result=await response.json();
            if(!result.task){core.setOutput('claimed','no');core.notice('No eligible '+process.env.WORKER_ROLE+' audit, no model call. '+(result.reason||''));}
            else{
              if(result.task.role!==process.env.WORKER_ROLE||result.task.kind!=='audit'||
                 result.task.deploy_allowed!==false||!result.task.lease_token)
                 throw Error('Worker task mismatch');
              fs.writeFileSync(process.env.RUNNER_TEMP+'/maximus-parallel-task.json',
                JSON.stringify(result.task),{mode:0o600});
              core.setOutput('claimed','yes');
            }
      - uses: actions/checkout@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          node-version: "22"
      - name: One bounded DeepSeek read-only investigation
        if: steps.claim.outputs.claimed == 'yes'
        env:
          AGENT_ROLE: ${{ matrix.role }}
          AGENT_TASK_FILE: ${{ runner.temp }}/maximus-parallel-task.json
          AGENT_RESULT_FILE: ${{ runner.temp }}/maximus-parallel-result.json
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/agents/parallelAuditRunner.mjs
      - name: Record actual audit result in existing Supabase run
        if: always() && steps.claim.outputs.claimed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const root=process.env.RUNNER_TEMP+'/maximus-parallel-';
            const task=JSON.parse(fs.readFileSync(root+'task.json','utf8'));
            let outcome;
            try{outcome=JSON.parse(fs.readFileSync(root+'result.json','utf8'));}
            catch{
              outcome={status:'blocked',result:{summary:'No recorded worker result; no PASS or release',
                verdict:'REVIEW',deploy_allowed:false,
                evidence:[{source:'GitHub Actions',observed_at:new Date().toISOString(),
                  finding:'Worker step did not produce verified output'}]}};
            }
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const response=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'complete',task_id:task.id,lease_token:task.lease_token,
                status:outcome.status,result:outcome.result}),
              signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('Cannot record audited run HTTP '+response.status);
            core.notice('Recorded '+task.role+' '+outcome.status+'/'+outcome.result.verdict+'; publication not authorized');

  qa:
    needs: [control, workers]
    if: needs.control.result == 'success' && needs.workers.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: QA — claim only after all three prior audit records
        id: claim
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const endpoint='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc';
            async function call(body){
              const response=await fetch(endpoint,{method:'POST',
                headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw Error('QA bridge HTTP '+response.status);
              return response.json();
            }
            const result=await call({op:'claim',role:'QA'});
            if(!result.task){core.setOutput('claimed','no');core.notice('QA dependencies not ready or daily budget exhausted: '+(result.reason||''));}
            else{
              if(result.task.role!=='QA'||result.task.kind!=='audit'||result.task.deploy_allowed!==false)
                throw Error('Untrusted QA task');
              const upstream=await call({op:'qa_context',task_id:result.task.id,
                lease_token:result.task.lease_token});
              fs.writeFileSync(process.env.RUNNER_TEMP+'/maximus-parallel-task.json',
                JSON.stringify(result.task),{mode:0o600});
              fs.writeFileSync(process.env.RUNNER_TEMP+'/maximus-parallel-qa.json',
                JSON.stringify(upstream),{mode:0o600});
              core.setOutput('claimed','yes');
            }
      - uses: actions/checkout@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.claim.outputs.claimed == 'yes'
        with:
          node-version: "22"
      - name: Deterministic independent QA — never approve publication
        if: steps.claim.outputs.claimed == 'yes'
        env:
          AGENT_ROLE: QA
          AGENT_TASK_FILE: ${{ runner.temp }}/maximus-parallel-task.json
          AGENT_RESULT_FILE: ${{ runner.temp }}/maximus-parallel-result.json
          AGENT_QA_CONTEXT_FILE: ${{ runner.temp }}/maximus-parallel-qa.json
        run: node scripts/agents/parallelAuditRunner.mjs
      - name: Store independent QA audit in existing queue
        if: always() && steps.claim.outputs.claimed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const root=process.env.RUNNER_TEMP+'/maximus-parallel-';
            const task=JSON.parse(fs.readFileSync(root+'task.json','utf8'));
            let outcome;
            try{outcome=JSON.parse(fs.readFileSync(root+'result.json','utf8'));}
            catch{outcome={status:'blocked',result:{summary:'Independent QA failed to produce evidence',
                verdict:'REVIEW',deploy_allowed:false,evidence:[
                {source:'GitHub Actions',observed_at:new Date().toISOString(),
                finding:'QA failed closed; no independent acceptance'}]}};}
            const token=await core.getIDToken('maximus-parallel-audit-ygvsddcpohsnaowofuwc');
            const response=await fetch(
              'https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-agent-audit-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify({op:'complete',task_id:task.id,lease_token:task.lease_token,
                status:outcome.status,result:outcome.result}),
              signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('QA recording failure HTTP '+response.status);
            core.notice('QA completed with '+outcome.result.verdict+' (NOT SCPI admission)');
