name: MaximusSCPI - Advenis issuer original PDF proof, 4 documents
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-advenis-original-source-pilot.yml'
      - 'scripts/agents/publisher_family_proof.py'
      - 'scripts/agents/advenis_first_source_proof_test.py'
      - 'scripts/agents/publisher-families/advenis-*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-advenis-original-source-pilot.yml'
      - 'scripts/agents/publisher_family_proof.py'
      - 'scripts/agents/advenis_first_source_proof_test.py'
      - 'scripts/agents/publisher-families/advenis-*.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: advenis-original-source-${{ github.event_name == 'pull_request' && format('pr-{0}',github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  issuer-contract-security:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native PDF engine
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Test approved issuer allowlist, period, exact fund and regulatory source-only
        run: |
          python -m unittest scripts/agents/advenis_first_source_proof_test.py -v
          python -m unittest scripts/agents/publisher_family_proof_test.py -v

  live-originals:
    needs: issuer-contract-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {slug: eden, docset: 2025-t4}
          - {slug: elialys, docset: 2026-t1}
          - {slug: eurovalys, docset: 2026-t1}
          - {slug: eurovalys, docset: 2026-t2}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original PDF MuPDF and independent Poppler reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify exact issuer HTTPS, fund, period and PDF original SHA
        run: |
          python scripts/agents/publisher_family_proof.py \
            --manifest scripts/agents/publisher-families/advenis-${{ matrix.docset }}.json \
            --slug ${{ matrix.slug }} \
            --output test-results/advenis-original/${{ matrix.slug }}-${{ matrix.docset }}.json
      - name: Retain real original PDF evidence or explicit refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advenis-original-${{ matrix.slug }}-${{ matrix.docset }}-${{ github.run_id }}
          path: test-results/advenis-original/${{ matrix.slug }}-${{ matrix.docset }}.json
          if-no-files-found: error
          retention-days: 14
