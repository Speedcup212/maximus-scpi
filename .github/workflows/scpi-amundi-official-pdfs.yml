name: Amundi official S1 2026 PDF source certification
on:
  push:
    branches:
      - feat/edr-europa-66-scpi-20261031
    paths:
      - 'scripts/scpi-agents/verify-amundi-issuer-pdfs.mjs'
      - '.github/workflows/scpi-amundi-official-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils
      - run: node scripts/scpi-agents/verify-amundi-issuer-pdfs.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amundi-official-s1-2026-${{ github.run_id }}
          path: |
            artifacts/amundi-issuer-pdfs/*.txt
            artifacts/amundi-issuer-pdfs/manifest.json
          retention-days: 30
          if-no-files-found: warn
