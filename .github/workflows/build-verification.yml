name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un seul run utile par branche/PR : chaque nouveau commit annule le run obsolète.
concurrency:
  group: build-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          # Sur une PR, GitHub propose par défaut refs/pull/<n>/merge.
          # Recovery doit certifier le contenu exact de la branche candidate,
          # sans embarquer les commits parallèles présents sur main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked SHA
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED_SHA="${GITHUB_SHA}"
          fi
          echo "candidate_sha=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Marketing conversion tracking deduplication, consent and GA4 privacy
        run: node --import tsx/esm --test scripts/analytics/funnelConversions.test.mjs

      - name: First-party funnel event endpoint, routing and privacy
        run: node --import tsx/esm --test scripts/analytics/funnelEndpoint.test.mjs

      - name: 211 SCPI single-queue delivery gate and privacy regression
        run: node --test scripts/scpi-candidates/delivery211Queue.test.mjs

      - name: Baseline cohort isolation and worker recovery regression
        run: node --test scripts/agents/watchdogCohortInvariant.test.mjs

      - name: Candidate public Data API policy and view-security contract
        run: node --test scripts/scpi-candidates/publicCandidateRls.test.mjs

      - name: SCPI 61-to-65 adversarial release-process crash test (10 cases)
        run: node --test scripts/scpi-candidates/deliveryProcessCrashTest.mjs

      - name: SCPI verified sources to current QA transition and 48-page core metric proof
        run: node --test scripts/scpi-candidates/currentQaTransition.test.mjs

      - name: SCPI candidate stage, public lifecycle and post-Netlify activation regression
        run: node --test scripts/scpi-candidates/stagedReleaseActivation.test.mjs

      - name: CORUM T2 regional allocation crosscheck and divergence provenance
        run: node --test scripts/scpi-candidates/corumT2GeoCrosscheck.test.mjs

      - name: Official SCPI one-point source arbitration without bypassing final release
        run: node --test scripts/scpi-candidates/officialSourceArbitration.test.mjs

      - name: Candidate official allocations same-period PDF and atomic release blocker
        run: node --test scripts/scpi-candidates/candidateAllocationReleaseGate.test.mjs

      - name: CORUM primary issuer source SFDR/ISR QA vintage guard
        run: node --test scripts/scpi-candidates/corumRegulatoryPublisherSource.test.mjs

      - name: Payment cadence reflects the actual publisher source, never inferred from TD
        run: node --import tsx/esm --test scripts/scpi-candidates/scpiPaymentCadence.test.ts

      - name: CORUM issuer source facts without release bypass
        run: node --test scripts/scpi-candidates/corumIssuerPrimaryFacts.test.mjs

      - name: Verified dated CORUM T2 issuer building counts without inferred rental metrics
        run: node --test scripts/scpi-candidates/corumDatedIssuerBuildings.test.mjs

      - name: Post-Netlify CORUM RLS activation and official financial QA safety
        run: node --test scripts/scpi-candidates/corumPostdeployRlsRecovery.test.mjs

      - name: LIVE CORUM crash guard - official reconstitution and substantive source-backed analysis
        run: node --import tsx/esm --test scripts/scpi-candidates/realCorumDisplayCrash.test.ts

      - name: SCPI annual reporting periods distinct from quarterly indicators
        run: node --test scripts/scpi-candidates/annualReportingPeriodProvenance.test.mjs

      - name: Existing certified SCPI pages and consumer tools parity
        run: node --test scripts/scpi-candidates/irokoAtlasTemplateParity.test.mjs

      - name: SCPI official PDF exact period handoff and QA status transitions
        run: node --test scripts/scpi-candidates/scpiExactPeriodHandoff.test.mjs

      - name: CORUM T1 six fields per fund and AI-review versus final signoff
        run: node --test scripts/scpi-candidates/corumQ1SecondSourceTechnicalReview.test.mjs

      - name: CORUM Q1 exact PDF price/TOF source gap and independent-review integrity
        run: node --test scripts/scpi-candidates/corumQ1FiveSourceGaps.test.mjs

      - name: CORUM financial source period and territorial fee audit gate
        run: node --test scripts/scpi-candidates/corumFinancialReconciliation.test.mjs

      - name: CORUM common certification schema parity with no premature release
        run: node --test scripts/scpi-candidates/corumCertificationsParity.test.mjs

      - name: CORUM geographic fee proof from exact legal statutes or certified bulletin in promoter
        run: node --test scripts/scpi-candidates/officialTieredFeeEvidence.test.mjs

      - name: CORUM USA statutory management fee tiers map to comparator and radar
        run: node --test scripts/scpi-candidates/issuerStatutesFeesToolParity.test.mjs

      - name: CORUM geographic fee tiers validated against publisher, shared components and release gates
        run: node --test scripts/scpi-candidates/corumFeeTiers.test.mjs

      - name: CORUM issuer T2 sector and country allocations exact label parity
        run: node --test scripts/scpi-candidates/officialAllocationParity.test.mjs

      - name: Verify official CORUM Q1 archived PDFs are LIVE and SHA-identical
        run: node scripts/scpi-candidates/checkCorumQ1PrimaryLive.mjs

      - name: CORUM regulatory PDFs primary 2026 SHA and full-document extraction
        run: node scripts/scpi-candidates/verifyCorumCurrentDicFromPublisher.mjs

      - name: CORUM latest current valuation issuer-source and old-2025 exclusion
        run: node --test scripts/scpi-candidates/issuerValuationEvidence.test.mjs

      - name: CORUM signed live batch permission precedes promotion and verified browser run
        run: node --test scripts/scpi-candidates/corumLiveApprovalNoDeadlock.test.mjs

      - name: Rebuild private CORUM release payload from canonical candidate registry and PDF evidence
        run: node --test scripts/scpi-candidates/buildCurrentCorumReleaseInput.test.mjs

      - name: One proportional SCPI batch final review and safe private publication gate
        run: node --test scripts/scpi-candidates/proportionalBatchReleaseGate.test.mjs

      - name: CORUM private-browser evidence handoff never approves financial release
        run: node --test scripts/scpi-candidates/corumBrowserEvidenceHandoff.test.mjs

      - name: Authenticated CORUM browser artifact and release QA evidence
        run: node --test scripts/scpi-candidates/verifiedBrowserBatch.test.mjs

      - name: CORUM end-to-end onboarding contract (unpublished candidates)
        run: |
          node --test scripts/scpi-candidates/auditCorumE2e.test.mjs
          node scripts/scpi-candidates/auditCorumE2e.mjs
          node --check scripts/scpi-candidates/promoteApprovedCorum.mjs
          node scripts/scpi-candidates/promoteApprovedCorum.mjs

      - name: SCPI bulletin extraction test
        run: node --import tsx/esm --test scpi-ingestion/src/extractor.test.ts

      - name: Surveillance signal regression tests
        run: npx vitest run src/tests/surveillanceSignals.test.ts src/tests/scpiPublicationFreshness.test.ts

      - name: SCPI certified liquidity gates and structural regime regression tests
        run: npx vitest run src/tests/certifiedLiquidity.test.ts

      - name: SCPI fiscal simulator regression tests
        run: npx vitest run src/tests/simpleDirectFiscal.test.ts

      - name: Production build
        run: npm run build

      - name: CORUM atomic SEO sitemap release verification
        run: node scripts/scpi-candidates/assertCorumReleaseSeo.mjs

      - name: SEO redirects and static shell regression
        run: node --test scripts/test-execution-seo.mjs

      - name: Private SCPI single registry draft source and security checks
        run: node --test scripts/scpi-candidates/singleRegistryPrivateDraft.test.mjs

      - name: Published CORUM 65-fund static catalog through real comparator and analysis
        run: node --import tsx/esm --test scripts/scpi-candidates/corumPublishedConsumerParity.test.ts

      - name: Real CORUM 65-fund production bundle browser crash test (NO private overlay)
        run: node scripts/scpi-candidates/corumPublishedBrowserParity.mjs

      - name: Save production rendering proof and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corum-public-rendering-${{ github.run_id }}
          path: test-results/corum-published-rendering/
          retention-days: 14
          if-no-files-found: warn

      - name: Client space browser smoke
        run: node scripts/client-space-browser-smoke.mjs

      - name: Real existing SCPI Chromium pages and sitemap - baseline ONLY
        run: node scripts/scpi-candidates/scpiExistingReferenceBrowserSmoke.mjs

      - name: Upload actual baseline browser matrix (not CORUM certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpi-existing-browser-${{ github.run_id }}
          path: test-results/scpi-existing-baseline/
          retention-days: 14
          if-no-files-found: warn

      # A source-code build is not an independent remote data certification.
      # Fail closed only when a controlled release is explicitly requested.
      - name: Release-only remote SCPI certification (fail closed)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (contains(github.event.head_commit.message, '[deploy]') ||
           contains(github.event.head_commit.message, '[release]') ||
           contains(github.event.head_commit.message, '[hotfix]') ||
           contains(github.event.head_commit.message, 'DEPLOY_NOW'))
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_SUPABASE_CERTIFICATION: 'true'
        run: npx tsx scripts/checkScpiCertification.ts

      # Le packaging Netlify n'existe plus dans un second workflow concurrent.
      # Il ne s'exécute que sur un push réel de main, jamais sur une PR Recovery.
      - name: Package controlled Netlify source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          rm -f /tmp/maximus-netlify-source.zip
          zip -q -r /tmp/maximus-netlify-source.zip \
            package.json package-lock.json index.html netlify.toml \
            vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json \
            postcss.config.js tailwind.config.js \
            src public scripts netlify
          ls -lh /tmp/maximus-netlify-source.zip

      - name: Publish controlled source package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/maximus-source-package
          mkdir -p /tmp/maximus-source-package
          cp /tmp/maximus-netlify-source.zip /tmp/maximus-source-package/source.zip
          cd /tmp/maximus-source-package
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b netlify-source-package
          git add source.zip
          git commit -m "build: controlled Netlify source ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin netlify-source-package
