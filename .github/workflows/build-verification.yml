name: Build verification

# Manual verification marker 2026-09-26
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SCPI bulletin extraction test
        run: node --import tsx/esm --test scpi-ingestion/src/extractor.test.ts

      - name: Production build
        run: npm run build

      - name: Publish built site snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          rm -rf /tmp/maximus-dist
          mkdir -p /tmp/maximus-dist
          cp -a dist/. /tmp/maximus-dist/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan netlify-dist
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/maximus-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "build: netlify dist ${GITHUB_SHA}"
          git push --force origin HEAD:netlify-dist
