name: Hotfix professionnels route once

on:
  push:
    branches:
      - hotfix/professionnels-route-20261005
    paths:
      - '.github/workflows/hotfix-professionnels-route-once.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch exact route collision
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "if (path.startsWith('pro')) {"
          new = "if (path === 'pro' || path.startsWith('pro/')) {"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one matcher, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
      - name: Verify only intended app change
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/App.tsx
          grep -q "path === 'pro' || path.startsWith('pro/')" src/App.tsx
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Start preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/maximus-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/maximus-vite.log
          exit 1
      - name: Browser smoke professionnels
        run: node scripts/smoke-professionnels.mjs
      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'maximus-repair'
          git config user.email 'maximus-repair@users.noreply.github.com'
          git rm .github/workflows/hotfix-professionnels-route-once.yml
          git add src/App.tsx scripts/smoke-professionnels.mjs
          git commit -m 'fix(pro): stop professionnels matching pro routes [skip netlify]'
          git push origin HEAD:hotfix/professionnels-route-20261005
