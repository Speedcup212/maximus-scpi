name: Hotfix professionnels route once

on:
  push:
    branches:
      - hotfix/professionnels-route-20261005
    paths:
      - '.github/workflows/hotfix-professionnels-route-once.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify isolated Pro fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q "import { AuthProvider } from './contexts/AuthContext';" src/main.tsx
          grep -q "if (path === 'professionnels')" src/main.tsx
          grep -q "import('./components/expert/ProfessionnelsPortal')" src/main.tsx
          grep -q '<AuthProvider>' src/main.tsx
          git diff cf5ee9e158f4f0ef5ab5cd9336163effa83c2427 -- src/main.tsx scripts/smoke-professionnels.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Start preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/maximus-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/maximus-vite.log
          exit 1
      - name: Browser smoke public portal and CGP login
        run: node scripts/smoke-professionnels.mjs
      - name: Mark verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'maximus-repair'
          git config user.email 'maximus-repair@users.noreply.github.com'
          git rm .github/workflows/hotfix-professionnels-route-once.yml
          git add src/main.tsx scripts/smoke-professionnels.mjs
          git commit -m 'test(pro): verify portal and CGP login [skip netlify]'
          git push origin HEAD:hotfix/professionnels-route-20261005
