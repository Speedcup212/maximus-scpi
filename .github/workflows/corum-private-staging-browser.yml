name: CORUM private staging browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corum-private-staging-browser.yml'
      - 'scripts/scpi-candidates/**'
      - 'scripts/generateSitemapFromDB.ts'
      - 'data-import/corum_private_browser_fixture_20261017.json'
      - 'src/components/fintech/AnalysisDetailModal.tsx'
      - 'src/utils/scpiFinancialProvenance.ts'
      - 'src/utils/buildScpiForAnalysis.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/corum-private-staging-browser.yml'
      - 'scripts/scpi-candidates/**'
      - 'scripts/generateSitemapFromDB.ts'
      - 'data-import/corum_private_browser_fixture_20261017.json'
      - 'src/components/fintech/AnalysisDetailModal.tsx'
      - 'src/utils/scpiFinancialProvenance.ts'
      - 'src/utils/buildScpiForAnalysis.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corum-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORUM_PRIVATE_BROWSER_FIXTURE: enabled
      VITE_SUPABASE_URL: https://smoke-test.supabase.co
      VITE_SUPABASE_ANON_KEY: smoke-test-publishable-key
    steps:
      - name: Check out exact candidate code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact checked-out commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare CORUM browser environment for 61, 65 or 66 exact funds
        run: |
          if node -e "const c=require('./src/data/certified_scpi_cohort.json');const s=new Set(c.slugs);const corum=['corum-eurion','corum-origin','corum-usa','corum-xl'];process.exit((c.count===65||c.count===66)&&c.slugs.length===c.count&&corum.every(id=>s.has(id))&&(c.count===65||s.has('edr-europa'))?0:1)"; then
            echo "Four approved CORUM already in cohort; preserve existing 65 or staged 66 funds, no staging overlay permitted."
            node -e "const c=require('./src/data/certified_scpi_cohort.json'); const ids=['corum-eurion','corum-origin','corum-usa','corum-xl'];if(!ids.every(id=>c.slugs.includes(id)))process.exit(1)"
          else
            node scripts/scpi-candidates/preparePrivateCorumBrowserStaging.mjs
          fi
      - name: Build temporary 65-SCPI Vite client
        run: npx vite build
      - name: Generate staged SCPI HTML and real sitemap
        run: |
          node scripts/generateOptimizedStaticPages.js
          npx tsx scripts/generateSitemapFromDB.ts
          cp public/sitemap.xml dist/sitemap.xml
      - name: Real Chromium matrix for CORUM candidates and shared workflows
        run: node scripts/scpi-candidates/scpiPrivateCorumBrowserAcceptance.mjs
      - name: Upload genuine private-browser matrix, including failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corum-private-browser-${{ github.run_id }}
          path: test-results/corum-private-browser/
          retention-days: 14
          if-no-files-found: warn
