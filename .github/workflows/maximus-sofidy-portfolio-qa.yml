name: MaximusSCPI - Sofidy portfolio composition original PDF QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-portfolio-qa.yml'
      - 'scripts/agents/sofidy_allocation_original_check.py'
      - 'scripts/agents/sofidy_allocation_original_check_test.py'
      - 'scripts/agents/publisher-families/sofidy-q2-allocations-2026.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-portfolio-qa.yml'
      - 'scripts/agents/sofidy_allocation_original_check.py'
      - 'scripts/agents/sofidy_allocation_original_check_test.py'
      - 'scripts/agents/publisher-families/sofidy-q2-allocations-2026.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source PDF parser for unit gate
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Enforce 100 percent and source-only proof constraints
        run: python -m unittest scripts/agents/sofidy_allocation_original_check_test.py -v

  verify-original-composition:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slug: [sofiboutique, sofipierre, sofidy-europe-invest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent source PDF engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Validate issuer TLS intermediate against trusted root
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Independently check original chart page, numeric tokens and labels
        run: |
          python scripts/agents/sofidy_allocation_original_check.py \
            --manifest scripts/agents/publisher-families/sofidy-q2-allocations-2026.json \
            --slug ${{ matrix.slug }} \
            --out test-results/sofidy-allocations/${{ matrix.slug }}.json
      - name: Retain blocked or verified source only, no financial approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-alloc-qa-${{ matrix.slug }}-${{ github.run_id }}
          path: test-results/sofidy-allocations/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 14
