name: Typecheck cascade cleanup
on:
  push:
    branches: [agents/typecheck-audit-20261005]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agents/typecheck-audit-20261005
          fetch-depth: 0
      - name: Remove cascade-unused variables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/fintech/AnalysisDetailModal.tsx')
          text = p.read_text()
          for line in [
              '  const actualInvestment = numberOfShares * scpi.price;\n',
              '  const currentYield = scpiForAnalysis?.yield ?? scpi.yield;\n',
          ]:
              if line not in text:
                  raise SystemExit(f'Expected line missing: {line!r}')
              text = text.replace(line, '', 1)
          p.write_text(text)
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "maximus-typecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/fintech/AnalysisDetailModal.tsx
          git commit -m "fix(typecheck): remove cascade-unused modal variables [skip netlify]"
          git push origin HEAD:agents/typecheck-audit-20261005
