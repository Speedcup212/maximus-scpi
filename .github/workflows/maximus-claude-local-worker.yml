name: MaximusSCPI - Claude Code subscription corrective worker (self-hosted)

on:
  workflow_dispatch:
    inputs:
      role:
        description: Existing exact-scope corrective role, no financial release
        required: true
        default: DATA
        type: choice
        options: [DATA, SEARCH]

# No PR events: an untrusted pull request must never execute on the account's
# own machine where Claude Code is signed into an individual subscription.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: maximus-existing-queue-claude-corrective
  cancel-in-progress: false

jobs:
  subscription-corrective:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    # Requires one EXPLICITLY registered dedicated runner; NEVER use ubuntu-latest.
    runs-on: [self-hosted, Windows, X64, maximus-claude]
    timeout-minutes: 24
    env:
      CORRECTIVE_ROLE: ${{ inputs.role }}
    steps:
      - name: Checkout the trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Claude subscription login without model spend
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:CORRECTIVE_ROLE -notin @('DATA','SEARCH')) { throw 'Unsupported corrective role' }
          node scripts/agents/claudeSubscriptionPreflight.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Claude subscription preflight failed: nothing claimed' }
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw 'GitHub CLI gh is required' }

      - name: Claim exactly one existing scoped corrective task via GitHub OIDC
        id: claim
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const url='https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-search-agent-oidc';
            const oidc=await core.getIDToken('maximus-agent-worker-ygvsddcpohsnaowofuwc');
            async function call(body){
              const response=await fetch(url,{method:'POST',
                headers:{Authorization:'Bearer '+oidc,'Content-Type':'application/json'},
                body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw Error('OIDC agent bridge rejected: '+response.status);
              return response.json();
            }
            // Reuse the existing queue and narrow one-file issue selector.
            await call({op:'prepare'});
            const r=await call({op:'claim',role:process.env.CORRECTIVE_ROLE});
            if(!r.task){
              core.notice('NO_ELIGIBLE_SCOPED_TASK; no Claude model call. '+String(r.reason||''));
              core.setOutput('claimed','no');
            }else{
              const t=r.task;
              if(t.role!==process.env.CORRECTIVE_ROLE || t.kind!=='execute' ||
                 !t.id || !t.lease_token || !Array.isArray(t.payload?.issues) ||
                 t.payload.issues.length!==1 || t.payload.issues[0].owner_role!==t.role)
                 throw Error('Existing queue returned invalid task scope');
              const dir=process.env.RUNNER_TEMP;
              const taskFile=path.join(dir,'maximus-claude-task.json');
              const scopeFile=path.join(dir,'maximus-claude-scope.json');
              fs.writeFileSync(taskFile,JSON.stringify(t),{mode:0o600});
              fs.writeFileSync(scopeFile,JSON.stringify(t.payload.issues[0].scope),{mode:0o600});
              core.setOutput('task_file',taskFile);
              core.setOutput('scope_file',scopeFile);
              core.setOutput('claimed','yes');
            }

      - name: Run bounded subscription correction on isolated candidate branch
        if: steps.claim.outputs.claimed == 'yes'
        id: propose
        shell: pwsh
        env:
          CLAUDE_TASK_FILE: ${{ steps.claim.outputs.task_file }}
          CANDIDATE_BRANCH: agents/execution-claude-${{ inputs.role }}-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          node --test scripts/agents/claudeSubscriptionPreflight.test.mjs scripts/agents/subscriptionCliRunner.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Adapter contract test failed' }
          git switch -c $env:CANDIDATE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Isolated branch creation failed' }
          $out = node scripts/agents/subscriptionCliRunner.mjs --provider claude --task $env:CLAUDE_TASK_FILE
          if ($LASTEXITCODE -ne 0) { throw 'Claude subscription proposal failed' }
          $candidate = ($out | Out-String | ConvertFrom-Json)
          if ($candidate.status -ne 'LOCAL_ONE_FILE_CANDIDATE_REQUIRES_TESTS_AND_QA') {
            throw 'Claude refused or returned no scoped replacement; no PASS claimed'
          }
          "file=$($candidate.file)" >> $env:GITHUB_OUTPUT

      - name: Validate exact file diff, run build and submit DRAFT PR
        if: steps.claim.outputs.claimed == 'yes' && steps.propose.outcome == 'success'
        id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_SCOPE_FILE: ${{ steps.claim.outputs.scope_file }}
          CANDIDATE_BRANCH: agents/execution-claude-${{ inputs.role }}-${{ github.run_id }}
          PROPOSED_FILE: ${{ steps.propose.outputs.file }}
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git diff --name-only | Where-Object { $_ -ne '' })
          $untracked=@(git ls-files --others --exclude-standard | Where-Object { $_ -ne '' })
          if ($changed.Count -ne 1 -or $untracked.Count -ne 0 -or $changed[0] -ne $env:PROPOSED_FILE) {
            throw 'Model diff is not exactly the approved one-file scope'
          }
          $pathsFile=Join-Path $env:RUNNER_TEMP 'maximus-claude-paths.json'
          @($env:PROPOSED_FILE) | ConvertTo-Json -Compress | Set-Content -Encoding utf8 $pathsFile
          node agents/autonomous/validate-change-scope.mjs --scope $env:CLAUDE_SCOPE_FILE --paths $pathsFile --branch $env:CANDIDATE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Static scope guard rejected candidate' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff whitespace check failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed' }
          node scripts/scpi-candidates/auditCorumE2e.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Static CORUM guard failed' }
          git config user.name 'maximus-claude-corrective[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:PROPOSED_FILE
          git commit -m "fix(agents): Claude subscription scoped $($env:CORRECTIVE_ROLE) candidate [no-deploy]"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate commit failed' }
          git push origin "HEAD:refs/heads/$env:CANDIDATE_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate push failed' }
          $pr=gh pr create --draft --base main --head $env:CANDIDATE_BRANCH --title "fix(agents): Claude $($env:CORRECTIVE_ROLE) scoped candidate - QA required" --body "Exactly one approved scoped file. Build and static guards passed. No financial certification or production release. Requires independent QA before merge. [no-deploy]"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($pr)) { throw 'Candidate PR creation failed' }
          "url=$pr" >> $env:GITHUB_OUTPUT

      - name: Record genuine result through the existing OIDC/lease contract
        if: always() && steps.claim.outputs.claimed == 'yes'
        uses: actions/github-script@v7
        env:
          TASK_FILE: ${{ steps.claim.outputs.task_file }}
          CANDIDATE_PR: ${{ steps.pr.outputs.url }}
        with:
          script: |
            const fs=require('fs');
            const task=JSON.parse(fs.readFileSync(process.env.TASK_FILE,'utf8'));
            const pr=String(process.env.CANDIDATE_PR||'');
            const passed=/^https:\/\/github\.com\/Speedcup212\/maximus-scpi\/pull\/[1-9][0-9]*$/.test(pr);
            const evidence=[{source:'GitHub Actions local Claude subscription worker',
              observed_at:new Date().toISOString(),
              finding:passed?pr:'No verified draft PR produced; no final review or release'}];
            const result={
              summary:passed?'One Claude subscription scoped correction compiled and submitted as DRAFT PR; independent QA pending':
                'Local Claude correction not finalized: BLOCKED; inspect GitHub job logs, no release',
              verdict:passed?'PASS':'REVIEW',evidence,
              ...(passed?{implementation_reference:pr,
                 tests:[{name:'one exact file scope',status:'PASS'},
                        {name:'GitHub build',status:'PASS'},
                        {name:'existing CORUM guard',status:'PASS'}]}:{})
            };
            const oidc=await core.getIDToken('maximus-agent-worker-ygvsddcpohsnaowofuwc');
            const response=await fetch('https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-search-agent-oidc',{
              method:'POST',headers:{Authorization:'Bearer '+oidc,'Content-Type':'application/json'},
              body:JSON.stringify({op:'complete',task_id:task.id,lease_token:task.lease_token,
                status:passed?'done':'blocked',result}),signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('Cannot verify Supabase task completion: '+response.status);
            core.notice(passed?'Draft PR recorded; no auto-merge or publish':'Failure retained; no false PASS');
