name: Audit issuers four pending SCPI original PDFs
on:
  push:
    branches:
      - feat/edr-europa-66-scpi-20261031
    paths:
      - 'scripts/scpi-agents/verify-remaining-issuer-pdfs.mjs'
      - '.github/workflows/scpi-remaining-issuer-audit.yml'
  pull_request:
    paths:
      - 'scripts/scpi-agents/verify-remaining-issuer-pdfs.mjs'
      - '.github/workflows/scpi-remaining-issuer-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Verify exact issuer-authored sources and SHA256
        run: node scripts/scpi-agents/verify-remaining-issuer-pdfs.mjs
      - name: Upload controlled source evidence for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-scpi-issuer-evidence-${{ github.run_id }}
          path: |
            artifacts/remaining-scpi-issuer-docs/*.txt
            artifacts/remaining-scpi-issuer-docs/manifest.json
          if-no-files-found: warn
          retention-days: 14
