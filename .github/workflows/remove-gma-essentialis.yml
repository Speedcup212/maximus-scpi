name: Remove GMA Essentialis completely

on:
  push:
    paths:
      - '.github/workflows/remove-gma-essentialis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove all GMA Essentialis references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json, re, unicodedata, shutil

          ROOT = Path('.')
          SOURCE_EXT = {'.ts', '.tsx', '.js', '.jsx'}
          TEXT_EXT = SOURCE_EXT | {'.json', '.md', '.txt', '.csv', '.yml', '.yaml', '.html', '.xml'}

          def normalized(value):
              s = unicodedata.normalize('NFKD', str(value)).encode('ascii', 'ignore').decode('ascii').lower()
              return re.sub(r'[^a-z0-9]+', '', s)

          def banned_text(value):
              s = normalized(value)
              return 'gmaessentialis' in s or 'greenmanarth' in s

          # 1) Delete files/folders explicitly named after the removed product/manager.
          named_paths = []
          for p in ROOT.rglob('*'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              if banned_text(p.as_posix()):
                  named_paths.append(p)
          for p in sorted(named_paths, key=lambda x: len(x.parts), reverse=True):
              if not p.exists():
                  continue
              if p.is_dir():
                  shutil.rmtree(p)
                  print(f'DELETED_DIR: {p}')
              else:
                  p.unlink()
                  print(f'DELETED_FILE: {p}')

          # 2) JSON: remove any list record directly identifying or mentioning the product/manager,
          #    plus matching keys/scalar values in nested dictionaries.
          def direct_target_record(obj):
              if not isinstance(obj, dict):
                  return False
              return any(isinstance(v, (str, int, float)) and banned_text(v) for v in obj.values())

          def clean_json(node):
              if isinstance(node, list):
                  out = []
                  for item in node:
                      if isinstance(item, dict) and direct_target_record(item):
                          continue
                      if isinstance(item, str) and banned_text(item):
                          continue
                      out.append(clean_json(item))
                  return out
              if isinstance(node, dict):
                  out = {}
                  for k, v in node.items():
                      if banned_text(k):
                          continue
                      if isinstance(v, str) and banned_text(v):
                          continue
                      out[k] = clean_json(v)
                  return out
              return node

          for p in ROOT.rglob('*.json'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  raw = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if not banned_text(raw):
                  continue
              try:
                  data = json.loads(raw)
              except Exception:
                  print(f'NON_STANDARD_JSON_REQUIRES_REVIEW: {p}')
                  continue
              cleaned = clean_json(data)
              new = json.dumps(cleaned, ensure_ascii=False, indent=2) + '\n'
              p.write_text(new, encoding='utf-8')
              print(f'CLEANED_JSON: {p}')

          # Lexical container scanner for TS/JS catalogs.
          def container_spans(text):
              stack=[]; spans=[]
              i=0; quote=None; esc=False; line_comment=False; block_comment=False
              pairs={'}':'{', ']':'['}
              while i < len(text):
                  c=text[i]; n=text[i+1] if i+1 < len(text) else ''
                  if line_comment:
                      if c=='\n': line_comment=False
                      i+=1; continue
                  if block_comment:
                      if c=='*' and n=='/': block_comment=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c in ('\"', "'", '`'):
                      quote=c; i+=1; continue
                  if c=='/' and n=='/': line_comment=True; i+=2; continue
                  if c=='/' and n=='*': block_comment=True; i+=2; continue
                  if c in '{[':
                      stack.append((c,i))
                  elif c in '}]' and stack and stack[-1][0] == pairs[c]:
                      opener,start=stack.pop(); spans.append((start,i+1,opener))
                  i+=1
              return spans

          def extend_removal(text, start, end):
              line_start=text.rfind('\n', 0, start)+1
              if text[line_start:start].strip()=='' :
                  start=line_start
              j=end
              while j < len(text) and text[j] in ' \t': j+=1
              if j < len(text) and text[j]==',': j+=1
              while j < len(text) and text[j] in ' \t': j+=1
              if j < len(text) and text[j]=='\r': j+=1
              if j < len(text) and text[j]=='\n': j+=1
              return start,j

          def remove_enclosing_object(path, marker):
              p=Path(path)
              if not p.exists(): return
              text=p.read_text(encoding='utf-8')
              changed=False
              while marker.lower() in text.lower():
                  pos=text.lower().find(marker.lower())
                  candidates=[(s,e) for s,e,o in container_spans(text) if o=='{' and s <= pos < e]
                  if not candidates:
                      raise RuntimeError(f'Cannot locate enclosing object for {marker} in {path}')
                  s,e=min(candidates, key=lambda x:x[1]-x[0])
                  s,e=extend_removal(text,s,e)
                  text=text[:s]+text[e:]
                  changed=True
              if changed:
                  p.write_text(text, encoding='utf-8')
                  print(f'CLEANED_OBJECT: {path}')

          def remove_keyed_container(path, marker):
              p=Path(path)
              if not p.exists(): return
              text=p.read_text(encoding='utf-8')
              changed=False
              while marker.lower() in text.lower():
                  pos=text.lower().find(marker.lower())
                  candidates=[(s,e) for s,e,o in container_spans(text) if s >= pos and s-pos < 400]
                  if not candidates:
                      raise RuntimeError(f'Cannot locate keyed container for {marker} in {path}')
                  s0,e0=min(candidates, key=lambda x:x[0])
                  start=text.rfind('\n',0,pos)+1
                  start,end=extend_removal(text,start,e0)
                  text=text[:start]+text[end:]
                  changed=True
              if changed:
                  p.write_text(text, encoding='utf-8')
                  print(f'CLEANED_KEYED_CONTAINER: {path}')

          # 3) Structured TS/JS records.
          enclosing_targets = [
              ('data/scpiDataExtended.ts', '"name": "GMA Essentialis"'),
              ('src/data/scpiDataExtended.ts', '"name": "GMA Essentialis"'),
              ('data/managementCompanyArticlesConfig.ts', "slug: 'greenman-arth'"),
              ('src/data/managementCompanyArticlesConfig.ts', "slug: 'greenman-arth'"),
              ('src/data/articleTemplatesConfig.ts', "slug: 'greenman-arth'"),
              ('src/data/semanticCocon.ts', "url: '/greenman-arth-scpi'"),
          ]
          for path,marker in enclosing_targets:
              remove_enclosing_object(path, marker)

          keyed_targets = [
              ('src/data/landingPagesData.ts', "'gma-essentialis':"),
              ('src/data/thematicLandingPages.ts', "'greenman-arth-scpi':"),
              ('src/data/semanticCocon.ts', "'/greenman-arth-scpi':"),
              ('scripts/generateOptimizedThematicPages.js', "'greenman-arth-scpi':"),
          ]
          for path,marker in keyed_targets:
              remove_keyed_container(path, marker)

          # 4) Remove URL blocks from generated sitemaps/XML.
          for p in ROOT.rglob('*.xml'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              raw=p.read_text(encoding='utf-8', errors='ignore')
              if not banned_text(raw): continue
              blocks=re.compile(r'<url>.*?</url>\s*', re.S)
              new=blocks.sub(lambda m: '' if banned_text(m.group(0)) else m.group(0), raw)
              p.write_text(new, encoding='utf-8')
              print(f'CLEANED_XML: {p}')

          # 5) Remove exact catalog tokens from mixed list lines without dropping unrelated entries.
          literal_tokens = [
              'GMA Essentialis', 'gma-essentialis', 'greenman-arth', 'greenman-arth-scpi',
              'Greenman Arth', 'GREENMAN ARTH'
          ]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts or p.suffix.lower() not in SOURCE_EXT:
                  continue
              raw=p.read_text(encoding='utf-8', errors='ignore')
              if not banned_text(raw): continue
              text=raw
              for token in literal_tokens:
                  q=re.escape(token)
                  # Quoted list element followed by comma.
                  text=re.sub(rf"(['\"])({q})\1\s*,\s*", '', text, flags=re.I)
                  # Quoted list element preceded by comma.
                  text=re.sub(rf",\s*(['\"])({q})\1", '', text, flags=re.I)
              # Safe removal of residual single-line source constructs that are wholly about the removed entity.
              kept=[]
              for line in text.splitlines(True):
                  if not banned_text(line):
                      kept.append(line); continue
                  s=line.strip()
                  removable = (
                      s.startswith(('//','/*','*','<span','<h4','<li')) or
                      s.startswith(('{ name:', '{name:', '"GMA Essentialis"', "'GMA Essentialis'", '"gma-essentialis"', "'gma-essentialis'", '"greenman-', "'greenman-"))
                  )
                  if removable:
                      print(f'CLEANED_SOURCE_LINE: {p}: {s[:120]}')
                      continue
                  kept.append(line)
              new=''.join(kept)
              if new != raw:
                  p.write_text(new, encoding='utf-8')

          # 6) Historical reports, CSV ledgers, text exports: remove rows/lines mentioning the entity.
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              if p.suffix.lower() not in {'.md','.txt','.csv'}:
                  continue
              raw=p.read_text(encoding='utf-8', errors='ignore')
              if not banned_text(raw): continue
              new=''.join(line for line in raw.splitlines(True) if not banned_text(line))
              if new != raw:
                  p.write_text(new, encoding='utf-8')
                  print(f'CLEANED_TEXT_ROWS: {p}')

          # 7) Remove this one-off workflow itself so the final branch has no self-reference.
          wf=Path('.github/workflows/remove-gma-essentialis.yml')
          if wf.exists():
              wf.unlink()

          # 8) Strict repository audit. Any remaining current-branch reference blocks the commit.
          leftovers=[]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              if p.suffix.lower() not in TEXT_EXT:
                  continue
              raw=p.read_text(encoding='utf-8', errors='ignore')
              for lineno,line in enumerate(raw.splitlines(),1):
                  if banned_text(line):
                      leftovers.append(f'{p}:{lineno}:{line[:260]}')
          if leftovers:
              print('REMAINING_REFERENCES:')
              print('\n'.join(leftovers[:300]))
              raise SystemExit(2)
          print('AUDIT_OK: zero current-branch text references')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: purge GMA Essentialis references"
          git push origin HEAD:main
