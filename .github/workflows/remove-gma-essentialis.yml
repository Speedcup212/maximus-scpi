name: Remove GMA Essentialis completely

on:
  push:
    paths:
      - '.github/workflows/remove-gma-essentialis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove GMA Essentialis references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('.')
          BANNED = ('gma essentialis', 'gma-essentialis', 'greenman arth', 'greenman-arth', 'greenmanarth')
          ID_FIELDS = {
              'name','nom','nom_scpi','scpi_name','slug','scpi_slug','managementcompany',
              'management_company','societe_gestion','société_gestion','displayname','company','gestionnaire'
          }

          def banned_text(value):
              s = str(value).lower()
              return any(token in s for token in BANNED)

          def is_target_record(obj):
              if not isinstance(obj, dict):
                  return False
              for k, v in obj.items():
                  if str(k).lower() in ID_FIELDS and isinstance(v, (str, int, float)) and banned_text(v):
                      return True
              return False

          def clean_json(node):
              if isinstance(node, list):
                  out = []
                  for item in node:
                      if is_target_record(item):
                          continue
                      if isinstance(item, str) and banned_text(item):
                          continue
                      out.append(clean_json(item))
                  return out
              if isinstance(node, dict):
                  out = {}
                  for k, v in node.items():
                      if banned_text(k):
                          continue
                      out[k] = clean_json(v)
                  return out
              return node

          # Clean every JSON source/catalog that still contains the product or manager.
          for p in ROOT.rglob('*.json'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  raw = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if not banned_text(raw):
                  continue
              try:
                  data = json.loads(raw)
              except Exception:
                  # Do not silently corrupt non-standard JSON.
                  print(f'NON_STANDARD_JSON_REQUIRES_REVIEW: {p}')
                  continue
              cleaned = clean_json(data)
              new = json.dumps(cleaned, ensure_ascii=False, indent=2) + '\n'
              p.write_text(new, encoding='utf-8')
              print(f'CLEANED_JSON: {p}')

          def brace_spans(text):
              stack=[]; spans=[]
              i=0; quote=None; esc=False; line_comment=False; block_comment=False
              while i < len(text):
                  c=text[i]; n=text[i+1] if i+1 < len(text) else ''
                  if line_comment:
                      if c=='\n': line_comment=False
                      i+=1; continue
                  if block_comment:
                      if c=='*' and n=='/': block_comment=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c in ('\"', "'", '`'):
                      quote=c; i+=1; continue
                  if c=='/' and n=='/': line_comment=True; i+=2; continue
                  if c=='/' and n=='*': block_comment=True; i+=2; continue
                  if c=='{': stack.append(i)
                  elif c=='}' and stack:
                      start=stack.pop(); spans.append((start,i+1))
                  i+=1
              return spans

          def remove_enclosing_object(path, marker):
              p=Path(path)
              if not p.exists(): return
              text=p.read_text(encoding='utf-8')
              changed=False
              while marker.lower() in text.lower():
                  pos=text.lower().find(marker.lower())
                  candidates=[(s,e) for s,e in brace_spans(text) if s <= pos < e]
                  if not candidates:
                      raise RuntimeError(f'Cannot locate enclosing object for {marker} in {path}')
                  # Smallest enclosing object that contains the identifying marker.
                  s,e=min(candidates, key=lambda x: x[1]-x[0])
                  # For these catalog files the marker is a direct property of the top-level record.
                  # If a smaller nested object somehow captured it, climb until the preceding text looks like an array item.
                  ordered=sorted(candidates, key=lambda x: x[1]-x[0])
                  for cs,ce in ordered:
                      prefix=text[max(0,cs-8):cs]
                      if '\n  ' in prefix or '\n    ' in prefix:
                          s,e=cs,ce
                          break
                  # Include trailing comma and one newline when present.
                  j=e
                  while j < len(text) and text[j] in ' \t': j+=1
                  if j < len(text) and text[j]==',':
                      j+=1
                  if j < len(text) and text[j]=='\r': j+=1
                  if j < len(text) and text[j]=='\n': j+=1
                  text=text[:s]+text[j:]
                  changed=True
              if changed:
                  p.write_text(text, encoding='utf-8')
                  print(f'CLEANED_OBJECT: {path}')

          # Hard-coded TypeScript catalogs that are not JSON-parseable.
          remove_enclosing_object('data/scpiDataExtended.ts', '"name": "GMA Essentialis"')
          remove_enclosing_object('data/managementCompanyArticlesConfig.ts', "slug: 'greenman-arth'")

          # Remove editorial slug registration.
          slug_file=Path('utils/scpiSlugMapper.ts')
          if slug_file.exists():
              text=slug_file.read_text(encoding='utf-8')
              new='\n'.join(line for line in text.splitlines() if not banned_text(line)) + ('\n' if text.endswith('\n') else '')
              if new != text:
                  slug_file.write_text(new, encoding='utf-8')
                  print('CLEANED_SLUG: utils/scpiSlugMapper.ts')

          # Remove the one-off workflow itself so no current-branch trace remains.
          wf=Path('.github/workflows/remove-gma-essentialis.yml')
          if wf.exists():
              wf.unlink()

          # Strict post-clean audit. Any remaining occurrence blocks the commit.
          leftovers=[]
          text_ext={'.ts','.tsx','.js','.jsx','.json','.md','.txt','.csv','.yml','.yaml','.html','.xml'}
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              if p.suffix.lower() not in text_ext:
                  continue
              try:
                  raw=p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for lineno,line in enumerate(raw.splitlines(),1):
                  if banned_text(line):
                      leftovers.append(f'{p}:{lineno}:{line[:240]}')
          if leftovers:
              print('REMAINING_REFERENCES:')
              print('\n'.join(leftovers[:200]))
              raise SystemExit(2)
          print('AUDIT_OK: zero current-branch references')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: purge GMA Essentialis references"
          git push origin HEAD:main
