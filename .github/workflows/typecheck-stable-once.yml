name: Measure stable TypeScript debt once

on:
  push:
    branches:
      - diagnostic/typescript-stable-20261005
    paths:
      - '.github/workflows/typecheck-stable-once.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Measure TypeScript debt
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          total=$(grep -E -c 'error TS[0-9]+:' /tmp/typecheck.log || true)
          unused=$(grep -E -c 'error TS(6133|6192|6196|6198):' /tmp/typecheck.log || true)
          echo "TypeScript diagnostics: ${total}"
          echo "Unused diagnostics: ${unused}"
          echo "Runtime/typing diagnostics: $((total-unused))"
          echo "tsc exit code: ${status}"
          echo
          echo "Top files by diagnostic count:"
          grep -E 'error TS[0-9]+:' /tmp/typecheck.log | sed -E 's/^([^(:]+).*/\1/' | sort | uniq -c | sort -nr | head -30 || true
          echo
          echo "First 220 runtime/typing diagnostics excluding Auth/Pro:"
          grep -E 'error TS[0-9]+:' /tmp/typecheck.log \
            | grep -v -E 'error TS(6133|6192|6196|6198):' \
            | grep -v -E '^src/(contexts/AuthContext|contexts/ProReportContext|components/pro/|components/expert/)' \
            | head -220 || true
          echo
          echo "ArticleCtaBlock/bottom diagnostics:"
          grep -E 'ArticleCtaBlock|Type '\''"bottom"'\''' /tmp/typecheck.log || true
          echo
          echo "Missing-module diagnostics:"
          grep -E 'error TS2307:' /tmp/typecheck.log | head -80 || true
          exit 0
