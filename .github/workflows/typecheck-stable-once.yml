name: Validate risk profile type contract once

on:
  push:
    branches:
      - diagnostic/typescript-stable-20261005
    paths:
      - '.github/workflows/typecheck-stable-once.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify risk profile contract
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          set -e
          total=$(grep -E -c 'error TS[0-9]+:' /tmp/typecheck.log || true)
          unused=$(grep -E -c 'error TS(6133|6192|6196|6198):' /tmp/typecheck.log || true)
          echo "TypeScript diagnostics: ${total}"
          echo "Unused diagnostics: ${unused}"
          echo "Runtime/typing diagnostics: $((total-unused))"
          echo
          echo "riskProfile diagnostics:"
          grep -E 'riskProfile|ClientProfile|RiskProfile' /tmp/typecheck.log | head -120 || true
          if grep -E "Cannot find module '../types/riskProfile'|Cannot find module './types/riskProfile'|Property 'tmi' does not exist on type 'ClientProfile'" /tmp/typecheck.log; then
            echo 'riskProfile contract remains incomplete.' >&2
            exit 1
          fi
          if [ "$total" -gt 996 ]; then
            echo "Expected <= 996 diagnostics after riskProfile contract, got ${total}." >&2
            exit 1
          fi
      - name: Production build
        run: npm run build
