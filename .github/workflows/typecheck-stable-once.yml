name: Promote validated MoneyPageTools once

on:
  push:
    branches:
      - diagnostic/typescript-stable-20261005
    paths:
      - '.github/workflows/typecheck-stable-once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote exact validated file to main
        shell: bash
        run: |
          set -euo pipefail
          expected_main='32af252c8e9bebe06f4fb2448f5c0eda1933a9a5'
          expected_blob='69d5cd815cf682c78a3761aaba9d3af13ca27269'
          actual_blob=$(git hash-object src/components/MoneyPageTools.tsx)
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "Validated MoneyPageTools blob mismatch: $actual_blob" >&2
            exit 1
          fi
          cp src/components/MoneyPageTools.tsx /tmp/MoneyPageTools.tsx
          git fetch origin main
          actual_main=$(git rev-parse origin/main)
          if [ "$actual_main" != "$expected_main" ]; then
            echo "Main moved from expected $expected_main to $actual_main; refusing promotion." >&2
            exit 1
          fi
          git checkout -B main origin/main
          cp /tmp/MoneyPageTools.tsx src/components/MoneyPageTools.tsx
          changed=$(git diff --name-only)
          if [ "$changed" != 'src/components/MoneyPageTools.tsx' ]; then
            echo "Unexpected promotion diff: $changed" >&2
            exit 1
          fi
          git config user.name 'maximus-agents'
          git config user.email 'maximus-agents@users.noreply.github.com'
          git add src/components/MoneyPageTools.tsx
          git commit -m 'fix(types): preserve Supabase narrowing in MoneyPageTools [skip netlify]'
          git push origin HEAD:main
