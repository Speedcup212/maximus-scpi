name: Step A restore articles handler

on:
  push:
    branches:
      - fix/step-a-home-navigation

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[handler-restored]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/step-a-home-navigation
          fetch-depth: 1
      - name: Restore exact articles handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()
          anchor = """  const handleActualitesClick = () => {
    navigateToView('actualites', '/actualites');
  };
"""
          handler = """  const handleArticlesClick = () => {
    console.log('[Navigation] handleArticlesClick appelé');
    navigateToView('articles-list', '/articles');
  };

"""
          if 'const handleArticlesClick = () =>' in text:
              raise SystemExit('handleArticlesClick already present')
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one handleActualitesClick anchor, got {text.count(anchor)}')
          p.write_text(text.replace(anchor, handler + anchor, 1))
          PY
          git diff --check
          git diff -- src/App.tsx
      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix(step-a): preserve articles navigation handler [handler-restored]"
          git push origin HEAD:fix/step-a-home-navigation
