name: Typecheck runtime batch
on:
  push:
    branches: [fix/typecheck-runtime-batch-20261005]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typecheck-runtime-batch-20261005
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return 1
              if new in text:
                  return 0
              raise SystemExit(f'Expected pattern missing in {path}')

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == expected:
                  p.write_text(text.replace(old, new))
                  return count
              if count == 0 and text.count(new) == expected:
                  return 0
              raise SystemExit(f'Unexpected count in {path}: {count}, expected {expected}')

          replace_once(
              'src/main.tsx',
              "  rootElement.innerHTML = '';\n  rootElement.appendChild(errorDiv);",
              "  const rootElement = document.getElementById('root');\n  if (rootElement) {\n    rootElement.innerHTML = '';\n    rootElement.appendChild(errorDiv);\n  } else {\n    document.body.appendChild(errorDiv);\n  }"
          )
          replace_once(
              'src/components/Logo.tsx',
              '      fetchpriority="high"',
              '      fetchPriority="high"'
          )
          replace_once(
              'src/components/GenericScpiLandingPage.tsx',
              '  ChevronRight, ChevronLeft, Zap\n',
              '  ChevronRight, ChevronLeft, Zap, Calendar\n'
          )
          replace_count(
              'src/components/ScpiLandingPage.tsx',
              'landingData.simulator',
              'scpiData.simulator',
              6
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript targeted verification
        shell: bash
        run: |
          set +e
          npx tsc -b --pretty false 2>&1 | tee /tmp/tsc.log
          code=${PIPESTATUS[0]}
          echo "TSC_EXIT=$code"
          echo "DIAGNOSTIC_LINES=$(grep -cE 'error TS[0-9]+' /tmp/tsc.log || true)"
          TARGET=$(grep -E '^(src/main\.tsx|src/components/Logo\.tsx|src/components/GenericScpiLandingPage\.tsx|src/components/ScpiLandingPage\.tsx).*error TS' /tmp/tsc.log || true)
          if [ -n "$TARGET" ]; then
            echo "$TARGET"
            exit 1
          fi
          exit 0
      - name: Production build
        run: npm run build
      - name: Commit bounded fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "maximus-typecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.tsx src/components/Logo.tsx src/components/GenericScpiLandingPage.tsx src/components/ScpiLandingPage.tsx
          git commit -m "fix(typecheck): resolve runtime-relevant diagnostics [skip netlify]"
          git push origin HEAD:fix/typecheck-runtime-batch-20261005
