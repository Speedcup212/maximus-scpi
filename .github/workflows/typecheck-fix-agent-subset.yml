name: Typecheck bounded agent cleanup

on:
  push:
    branches: [agents/typecheck-audit-20261005]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agents/typecheck-audit-20261005
          fetch-depth: 0

      - name: Apply bounded safe fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, required=True):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f'Pattern not found in {path}: {old[:80]!r}')
                  return False
              p.write_text(text.replace(old, new))
              return True

          def replace_re(path, pattern, new, required=True):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, new, text, flags=re.MULTILINE | re.DOTALL)
              if count == 0 and required:
                  raise SystemExit(f'Regex not found in {path}: {pattern[:80]!r}')
              if count:
                  p.write_text(updated)
              return count

          replace('src/components/ScpiDetailPage.tsx',
                  "import { formatCurrency, getPerformanceColor, resolveDisplayedDiscount } from '../utils/formatters';",
                  "import { formatCurrency, resolveDisplayedDiscount } from '../utils/formatters';")
          replace('src/components/ScpiPremiumAnalysis.tsx', '  ShieldCheck,\n', '')
          replace('src/components/TMIExplanationModal.tsx',
                  'import { X, HelpCircle, Calculator, FileText, Euro, AlertTriangle, Target } from \'lucide-react\';',
                  'import { X, HelpCircle, Calculator, FileText, Euro, Target } from \'lucide-react\';')
          replace('src/data/scpiData.ts', '  const lowerStr = repartitionStr.toLowerCase();\n\n', '')
          replace('src/data/scpiData.ts', "  const isAtPar = scpi['Surcote/décote (%)'] === 0;\n", '')

          for line in [
              '  const walb = scpi.walb;\n',
              '  const nombreLocataires = scpi.nombreLocataires;\n',
              '  const isr = scpi.isr;\n',
              '  const company = scpi.company;\n',
              '  const isSmallCap = capitalizationM < 100;\n',
              '  const isMediumLease = walt !== undefined && walt >= 4 && walt < 7;\n',
              "  const isMensuel = versementLoyers === 'Mensuel';\n",
          ]:
              replace('src/utils/scpiAnalysis.ts', line, '')

          path = 'src/components/fintech/AnalysisDetailModal.tsx'
          replace(path,
                  "import { X, TrendingUp, PieChart, DollarSign, Calendar, BarChart3, AlertCircle, Clock, Shield, Tag, Building2, Percent, TrendingDown, CheckCircle2, XCircle, Star, FileText, Newspaper, Plus, Check } from 'lucide-react';",
                  "import { X, TrendingUp, PieChart, DollarSign, Calendar, BarChart3, AlertCircle, Clock, Shield, Tag, Building2, Percent, TrendingDown, CheckCircle2, Star, FileText, Newspaper, Plus } from 'lucide-react';")
          replace(path,
                  "import { PieChart as RechartsPie, Pie, Cell, ResponsiveContainer, Tooltip, Legend, BarChart, Bar, XAxis, YAxis, CartesianGrid, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar } from 'recharts';",
                  "import { PieChart as RechartsPie, Pie, Cell, ResponsiveContainer, Tooltip, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar } from 'recharts';")
          replace(path,
                  "import { getScpiAdvantages, getScpiPointsAttention, getScpiNews, getScpiKeyTakeaways, getCapitalizationCategory, formatCapitalizationWithLiquidity } from '../../utils/scpiAnalysis';",
                  "import { getScpiAdvantages, getScpiPointsAttention, getScpiNews, getScpiKeyTakeaways, getCapitalizationCategory } from '../../utils/scpiAnalysis';")
          replace(path,
                  "import { checkScpiDataCompleteness, getCompletenessDisplay } from '../../utils/scpiDataCompleteness';\n",
                  '')
          replace(path, '  const [investmentAmount, setInvestmentAmount] = useState<number>(50000);',
                        '  const [investmentAmount] = useState<number>(50000);')
          replace(path, '  const [investmentYears, setInvestmentYears] = useState<number>(15);\n', '')
          replace_re(path,
                     r"  // Vérifier la complétude des données\n  const completenessResult = useMemo\(\(\) => \{\n.*?  \}, \[scpiForAnalysis, scpi\]\);\n\n",
                     '')
          replace(path, '  const monthlyRevenue = annualRevenue / 12;\n', '')
          replace(path, '  const netYield = currentYield - 0.5;\n', '')
          replace(path, '  const annualNetRevenue = actualInvestment * (netYield / 100);\n', '')
          replace_re(path,
                     r"  const projectionData = Array\.from\(\{ length: investmentYears \+ 1 \}, \(_, year\) => \{\n.*?  \}\);\n\n",
                     '')
          replace(path,
                  "                const cap = scpiForAnalysis?.capitalization ?? scpi.capitalization;\n                const capCategory = getCapitalizationCategory(cap);\n",
                  "                const rawCap = scpiForAnalysis?.capitalization ?? scpi.capitalization;\n                const cap = typeof rawCap === 'number'\n                  ? rawCap\n                  : (() => {\n                      const normalized = rawCap.trim().replace(/\\s/g, '').replace(',', '.').toUpperCase();\n                      const parsed = Number.parseFloat(normalized.replace(/[^0-9.-]/g, ''));\n                      if (!Number.isFinite(parsed)) return 0;\n                      if (normalized.includes('MD')) return parsed * 1_000_000_000;\n                      if (normalized.includes('M')) return parsed * 1_000_000;\n                      return parsed;\n                    })();\n                const capCategory = getCapitalizationCategory(cap);\n")
          replace(path, '                        ticks={[0, 25, 50, 75, 100]}\n', '                        tickCount={5}\n')
          replace(path, '                        formatter={(value: number) => [`${value}/100`, \'Score\']}\n',
                        "                        formatter={(value: number | undefined) => [`${value ?? 0}/100`, 'Score']}\n")
          replace(path, '.map((entry, index) => (\n                        <Cell', '.map((_, index) => (\n                        <Cell')
          replace(path, '(scpi.managementFees !== undefined || scpi.fraisGestion !== undefined) ? (', 'scpi.managementFees !== undefined ? (')
          replace(path, '{(scpi.managementFees ?? scpi.fraisGestion)}% TTC', '{scpi.managementFees}% TTC')
          replace(path, '(scpi.reconstitutionValue !== undefined || scpi.valeurReconstitution !== undefined) ? (', 'scpi.reconstitutionValue !== undefined ? (')
          replace(path, '{(scpi.reconstitutionValue ?? scpi.valeurReconstitution)?.toFixed(2)}€', '{scpi.reconstitutionValue.toFixed(2)}€')
          replace(path, '(scpi.valeurRetrait !== undefined || scpi.reconstitutionValue !== undefined || scpi.valeurReconstitution !== undefined) && (', '(scpi.valeurRetrait !== undefined || scpi.reconstitutionValue !== undefined) && (')
          PY

      - name: Commit fixes when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No bounded fixes left to apply."
            exit 0
          fi
          git config user.name "maximus-typecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/ScpiDetailPage.tsx src/components/ScpiPremiumAnalysis.tsx src/components/TMIExplanationModal.tsx src/data/scpiData.ts src/utils/scpiAnalysis.ts src/components/fintech/AnalysisDetailModal.tsx
          git commit -m "fix(typecheck): clean validated agent subset [skip netlify]"
          git push origin HEAD:agents/typecheck-audit-20261005
