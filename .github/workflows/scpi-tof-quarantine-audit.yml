name: Audit 77 quarantined TOF official issuer bulletins
on:
  push:
    branches: [audit/scpi-tof-quarantine-proof-20261028]
    paths:
      - scripts/tof_quarantine_issuer_audit.py
      - .github/workflows/scpi-tof-quarantine-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-issuer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'requests>=2.31,<3'
      - name: Read and classify original issuer PDFs (no database writes)
        run: python scripts/tof_quarantine_issuer_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tof-quarantine-issuer-evidence-20261028
          path: tof_quarantine_issuer_audit.json
          retention-days: 10
