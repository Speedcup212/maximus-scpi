name: MaximusSCPI - independent watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maximus-watchdog.yml"
      - "scripts/agents/durableOrchestrator.mjs"
      - "scripts/agents/durableOrchestrator.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maximus-watchdog.yml"
      - "scripts/agents/durableOrchestrator.mjs"
      - "scripts/agents/durableOrchestrator.test.mjs"
  schedule:
    # UTC; two distinct daily controls, no AI API and no Netlify deployment.
    - cron: "17 6,18 * * *"
    # Late independent observation of missed candidate20 daily dispatch.\n    # RECOVERY-195: refresh cron registration/actor; keep bounded recovery.
    - cron: "59 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

concurrency:
  group: maximus-watchdog
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Durable orchestration contract and adversarial regression
        run: node --test scripts/agents/durableOrchestrator.test.mjs

  watchdog:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check protected Supabase watchdog through GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "MaximusSCPI — incident d'orchestration ou qualité";
            const endpoint = "https://ygvsddcpohsnaowofuwc.supabase.co/functions/v1/maximus-watchdog-oidc";
            const audience = "maximus-watchdog-ygvsddcpohsnaowofuwc";
            let data;
            let bridgeError = "";
            try {
              const token = await core.getIDToken(audience);
              const response = await fetch(endpoint, {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
                signal: AbortSignal.timeout(20000)
              });
              if (!response.ok) throw new Error(`Supabase bridge HTTP ${response.status}`);
              data = await response.json();
            } catch (error) {
              bridgeError = String(error.message || error);
              core.warning(`Maximus bridge failed: ${bridgeError}`);
            }
            const ageMinutes = data?.observed_at
              ? Math.floor((Date.now() - new Date(data.observed_at).getTime()) / 60000)
              : null;
            const staleMonitor = ageMinutes === null || ageMinutes < 0 || ageMinutes > 90;
            const runner = data?.runner_state || "UNAVAILABLE";
            const passCount = Number(data?.strict_pass);
            const failCount = Number(data?.strict_fail);
            const strictTotal = Number.isInteger(passCount) && passCount >= 0 &&
              Number.isInteger(failCount) && failCount >= 0
              ? passCount + failCount : null;
            const incidents = Array.isArray(data?.active_incidents)
              ? data.active_incidents.slice().sort() : [];
            const unhealthy = !!bridgeError || staleMonitor ||
              runner === "STALE" || runner === "DISABLED" ||
              Number(data?.strict_fail || 0) > 0 || incidents.length > 0;
            const body = [
              "## MaximusSCPI — supervision indépendante",
              "",
              "Contrôle automatique GitHub Actions / Supabase. Ce workflow ne corrige aucune donnée",
              "financière et ne déclenche jamais de déploiement Netlify.",
              "",
              `- Exécuteur : **${runner}**`,
              `- Tâches non terminées : **${data?.pending_tasks ?? "inconnu"}**`,
              `- Issues bloquées : **${data?.blocked_issues ?? "inconnu"}**`,
              `- Crash test documentaire strict : **${data?.strict_pass ?? "?"}/${strictTotal ?? "?"} PASS ; ${data?.strict_fail ?? "?"} échecs**`,
              `- Supervision Supabase actualisée : **${staleMonitor ? "NON" : "OUI"}**`,
              `- Incidents : **${incidents.length ? incidents.join(", ") : "aucun"}**`,
              `- Accès au pont : **${bridgeError ? "ERREUR" : "OK"}**`,
              "",
              "Priorité : diagnostiquer et relancer un exécuteur IA externe indépendant,",
              "puis traiter les anomalies strictes avec les preuves source et QA.",
              "",
              "Le suivi interne ne constitue pas une preuve d'exécution des agents.",
              "",
              "[Consulter l'architecture](https://github.com/Speedcup212/maximus-scpi/blob/agents/autonomous-control-20261005/agents/autonomous/watchdog-2026-10-14.md)"
            ].join("\n");
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", per_page: 100
            });
            const issue = all.find(x => !x.pull_request && x.title === title);
            if (unhealthy) {
              if (!issue) {
                const created = await github.rest.issues.create({ owner, repo, title, body });
                core.notice(`Created Maximus watchdog incident #${created.data.number}`);
              } else {
                if (issue.state !== "open" || issue.body !== body) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: issue.number, state: "open", body
                  });
                }
                core.notice(`Maximus watchdog incident #${issue.number} remains open`);
              }
            } else if (issue && issue.state === "open") {
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed",
                state_reason: "completed"
              });
              core.notice(`Closed resolved Maximus watchdog incident #${issue.number}`);
            } else {
              core.notice("Maximus watchdog healthy; no issue required");
            }
            if (bridgeError) core.setFailed(`Supabase watchdog unreachable: ${bridgeError}`);

      - name: Recover missed existing workflows (bounded, fail closed)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            // Only reschedule an existing workflow if today's scheduled run is absent.
            // No retry of failed runs, no AI-provider calls, no financial QA override.
            const path=require('node:path');
            const {pathToFileURL}=require('node:url');
            const {RECOVERY_TARGETS,decideWorkflowRecovery}=await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,
                'scripts/agents/durableOrchestrator.mjs')).href);
            const owner=context.repo.owner,repo=context.repo.repo;
            const problems=[];
            for(const target of RECOVERY_TARGETS){
              const runs=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:target.workflow,branch:'main',per_page:100
              });
              // API failure or an unexpected response MUST NOT cause a blind dispatch.
              const decision=decideWorkflowRecovery({
                now:new Date(),runs:runs.data?.workflow_runs,target
              });
              core.notice(target.key+': '+decision.decision+' ('+decision.day+')');
              if(decision.decision==='DISPATCH_ONCE'){
                await github.rest.actions.createWorkflowDispatch({
                  owner,repo,workflow_id:target.workflow,ref:'main'
                });
                core.warning('Recovered missing '+target.workflow+' trigger once');
              }else if(decision.decision==='FAILED'){
                problems.push({target,decision});
              }
            }
            const title='MaximusSCPI — orchestrateur : échec d’un workflow durable';
            const all=await github.paginate(github.rest.issues.listForRepo,{
              owner,repo,state:'all',per_page:100
            });
            const old=all.find(x=>!x.pull_request&&x.title===title);
            if(problems.length){
              const body=[
                '## Incidents des workflows existants',
                '',
                'Aucun rejeu aveugle : la preuve et les contrôles QA restent obligatoires.',
                'Cette alerte ne constitue ni une certification financière ni un GO publication.',
                '',
                ...problems.map(p=>'- **'+p.target.key+'** : '+
                  (p.decision.url||p.target.workflow)+' — '+p.decision.conclusion),
                '',
                'File persistante : `maximus_agents.tasks` / `maximus_agents.runs`.',
                'Consulter les échecs, corriger la cause puis relancer le workflow existant.',
                'Aucun nouveau gestionnaire de tâches ou exécuteur IA créé.'
              ].join('\n');
              if(!old)await github.rest.issues.create({owner,repo,title,body});
              else if(old.state!=='open'||old.body!==body)
                await github.rest.issues.update({
                  owner,repo,issue_number:old.number,state:'open',body
                });
              core.setFailed(problems.length+' existing workflow(s) failed; no automatic retry');
            }else if(old?.state==='open'){
              await github.rest.issues.update({
                owner,repo,issue_number:old.number,state:'closed',state_reason:'completed'
              });
            }
