name: Step A home navigation fix

on:
  push:
    branches:
      - fix/step-a-home-navigation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[step-a-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/step-a-home-navigation
          fetch-depth: 1

      - name: Normalize authoritative home navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text()
          pattern = re.compile(
              r"^  const handleBackToHome = \(\) => \{\n.*?^\s*\};\n",
              re.MULTILINE | re.DOTALL,
          )
          replacement = (
              "  const handleBackToHome = () => {\n"
              "    // La home autoritaire est montée par main.tsx via HomeApp.\n"
              "    // Depuis les routes legacy, une simple mutation de currentView conservait\n"
              "    // l'ancienne home embarquée dans App.tsx. Une navigation réelle garantit\n"
              "    // qu'un retour accueil charge toujours la même HomeApp.\n"
              "    window.location.assign('/');\n"
              "  };\n"
          )
          matches = pattern.findall(text)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one handleBackToHome block, found {len(matches)}')
          updated = pattern.sub(replacement, text, count=1)
          if updated == text:
              raise SystemExit('No source change produced')
          path.write_text(updated)
          PY

          git diff --check
          git diff -- src/App.tsx

      - name: Commit normalized source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "style(step-a): normalize authoritative home handler [step-a-applied]"
          git push origin HEAD:fix/step-a-home-navigation
