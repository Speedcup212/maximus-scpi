name: Espace client - contrôle qualité
on:
  pull_request:
    paths:
      - 'src/app/pages/ClientDashboard.tsx'
      - 'src/app/pages/ClientCases.tsx'
      - 'src/app/pages/ClientCaseDetail.tsx'
      - 'src/app/pages/AccountPage.tsx'
      - 'src/app/pages/AppLogin.tsx'
      - 'src/app/pages/AppOnboarding.tsx'
      - 'src/app/components/AppLayout.tsx'
      - 'src/app/components/ClientScpiCard.tsx'
      - 'src/app/components/ClientPortfolioRadarTrajectory.tsx'
      - 'src/components/ScpiPremiumAnalysis.tsx'
      - 'src/app/components/ClientHistoricalTofChart.tsx'
      - 'src/utils/clientPortfolio*.ts'
      - 'src/utils/surveillanceSignals.ts'
      - 'src/tests/clientPortfolio*.test.ts'
      - 'src/tests/clientExposureVisibility.test.ts'
      - 'src/tests/clientRadarPedagogy.test.ts'
      - 'src/tests/clientPremiumUx.test.ts'
      - 'src/tests/clientFuturePurchaseDateUx.test.ts'
      - 'src/tests/clientPositionForm.test.ts'
      - 'src/tests/clientPositionEditDate.test.ts'
      - 'src/utils/clientPositionForm.ts'
      - 'src/tests/surveillanceTofClassification.test.ts'
      - 'src/tests/tofPresentationConsistency.test.ts'
      - 'src/components/ScpiQuarterlyAnalysis.tsx'
      - 'src/components/AnalysesLiveFeed.tsx'
      - 'src/components/SurveillancePage.tsx'
      - 'src/components/trajectory/TrajectorySurveillanceTable.tsx'
      - '.github/workflows/client-space-quality.yml'
  workflow_dispatch:
jobs:
  check:
    name: TypeScript et tests métier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund
      - name: Tests portefeuille et ventilations
        run: npx vitest run src/tests/clientPortfolioMath.test.ts src/tests/clientPortfolioExposure.test.ts src/tests/clientPortfolioTrajectory.test.ts src/tests/clientPortfolioHistory.test.ts src/tests/clientFormalAddress.test.ts src/tests/clientExposureVisibility.test.ts src/tests/clientRadarPedagogy.test.ts src/tests/clientPremiumUx.test.ts src/tests/clientFuturePurchaseDateUx.test.ts src/tests/clientPositionForm.test.ts src/tests/clientPositionEditDate.test.ts src/tests/surveillanceTofClassification.test.ts src/tests/tofPresentationConsistency.test.ts
      - name: Vérification TypeScript sur les fichiers modifiés
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-client.log 2>&1
          status=$?
          set -e
          if grep -E 'src/(app/pages/ClientDashboard|app/components/AppLayout|app/components/ClientScpiCard|app/components/ClientPortfolioRadarTrajectory|components/ScpiPremiumAnalysis|components/ScpiQuarterlyAnalysis|components/AnalysesLiveFeed|components/SurveillancePage|components/trajectory/TrajectorySurveillanceTable|utils/surveillanceSignals|utils/clientPositionForm|app/components/ClientHistoricalTofChart|utils/clientPortfolioHistory|utils/clientPortfolioExposure|utils/clientPortfolioMath|utils/clientPortfolioTrajectory)(\\.test)?\\.tsx?\\([0-9]+,[0-9]+\\): error TS' /tmp/typecheck-client.log; then
            echo 'Des erreurs TypeScript affectent les fichiers de la refonte.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Typecheck global non vert : erreurs préexistantes hors fichiers modifiés.'
            grep -c 'error TS' /tmp/typecheck-client.log || true
          fi
          echo 'Aucune erreur TypeScript dans les fichiers de la refonte.'
