name: Typecheck investment amount cleanup
on:
  push:
    branches: [agents/typecheck-audit-20261005]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agents/typecheck-audit-20261005
          fetch-depth: 0
      - name: Remove cascade-unused state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/fintech/AnalysisDetailModal.tsx')
          text = p.read_text()
          line = '  const [investmentAmount] = useState<number>(50000);\n'
          if line not in text:
              raise SystemExit('Expected investmentAmount declaration missing')
          p.write_text(text.replace(line, '', 1))
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "maximus-typecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/fintech/AnalysisDetailModal.tsx
          git commit -m "fix(typecheck): remove cascade-unused investment amount [skip netlify]"
          git push origin HEAD:agents/typecheck-audit-20261005
