name: Buroboutic 2026 T1 T2 original issuer document review

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/agents/buroHistoricalTofProbe.py'
      - 'scripts/agents/buroHistoricalTofProbe_test.py'
      - 'scripts/agents/fixtures/buro_historical_t1_t2_issuer_sources.json'
      - '.github/workflows/buro-historical-official-pdf-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/agents/buroHistoricalTofProbe.py'
      - 'scripts/agents/buroHistoricalTofProbe_test.py'
      - 'scripts/agents/fixtures/buro_historical_t1_t2_issuer_sources.json'
      - '.github/workflows/buro-historical-official-pdf-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-issuer-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Test source integrity and no certification fabrication
        run: python -m unittest discover -s scripts/agents -p 'buroHistoricalTofProbe_test.py' -v
      - name: Check issuer originals and report strict redirects
        run: |
          python scripts/agents/buroHistoricalTofProbe.py \
            --manifest scripts/agents/fixtures/buro_historical_t1_t2_issuer_sources.json \
            --out test-results/buro-historical-sources
      - name: Save exact-hash PDF evidence or source gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buro-historical-source-evidence-${{ github.run_id }}
          path: test-results/buro-historical-sources/
          if-no-files-found: warn
          retention-days: 7
