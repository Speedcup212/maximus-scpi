name: Batch TypeScript inventory current main

on:
  push:
    branches:
      - diagnostic/calendly-declarations-20261005
    paths:
      - '.github/workflows/inventory-calendly-once.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checkout current main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B current-main origin/main
          echo "MAIN_SHA=$(git rev-parse HEAD)"
      - name: Install dependencies
        run: npm ci
      - name: Inventory TypeScript debt
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          set -e
          total=$(grep -E -c 'error TS[0-9]+:' /tmp/typecheck.log || true)
          unused=$(grep -E -c 'error TS(6133|6192|6196|6198):' /tmp/typecheck.log || true)
          runtime=$((total-unused))
          echo "TOTAL=${total} UNUSED=${unused} RUNTIME=${runtime}"
          echo '=== Runtime/type errors by file ==='
          grep -E 'error TS[0-9]+:' /tmp/typecheck.log | grep -Ev 'error TS(6133|6192|6196|6198):' | sed -E 's#^([^(:]+).*#\1#' | sort | uniq -c | sort -nr | head -40
          echo '=== First 160 runtime/type diagnostics (excluding Auth/Pro/Expert) ==='
          grep -E 'error TS[0-9]+:' /tmp/typecheck.log | grep -Ev 'error TS(6133|6192|6196|6198):' | grep -Ev 'src/(contexts/AuthContext|contexts/ProReportContext|components/pro/|components/expert/|components/app/)' | head -160 || true
