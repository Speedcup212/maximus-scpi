name: Repair analysis catalog and verify build

on:
  push:
    paths:
      - '.github/workflows/fix-analysis-build.yml'

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair malformed catalog entry
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/utils/scpiAnalysis.ts')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          changed = False
          out = []
          for line in lines:
              if '"Foncière des Praticiens":' in line and '": "SCPI diversifiée créée en 2019 par Groupama Immobilier' in line:
                  marker = '": "SCPI diversifiée créée en 2019 par Groupama Immobilier'
                  line = line.split(marker, 1)[0] + '",\n'
                  changed = True
              out.append(line)
          if not changed:
              raise SystemExit('Expected malformed catalog line not found')
          p.write_text(''.join(out), encoding='utf-8')
          wf = Path('.github/workflows/fix-analysis-build.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore valid SCPI analysis catalog syntax"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
