name: Validate readonly FAQ schema input once

on:
  push:
    branches:
      - diagnostic/typescript-seo-readonly-20261005
    paths:
      - '.github/workflows/typecheck-seo-readonly-once.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript reduction
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          set -e
          total=$(grep -E -c 'error TS[0-9]+:' /tmp/typecheck.log || true)
          unused=$(grep -E -c 'error TS(6133|6192|6196|6198):' /tmp/typecheck.log || true)
          runtime=$((total-unused))
          echo "TypeScript diagnostics: ${total}"
          echo "Unused diagnostics: ${unused}"
          echo "Runtime/typing diagnostics: ${runtime}"
          grep -E 'simulatorSeoConfig.ts\(127,51\)|generateFAQSchema' /tmp/typecheck.log || true
          if grep -E 'simulatorSeoConfig.ts\(127,51\)' /tmp/typecheck.log; then
            echo 'Readonly FAQ mismatch remains.' >&2
            exit 1
          fi
          if [ "$total" -gt 1004 ]; then
            echo "Expected <= 1004 diagnostics, got ${total}." >&2
            exit 1
          fi
      - name: Production build
        run: npm run build
