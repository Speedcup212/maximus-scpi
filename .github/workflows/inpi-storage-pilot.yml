name: INPI PRIVATE STORAGE PILOT - one SCPI
on:
  push:
    branches: ['feat/inpi-rne-scpi-actes']
    paths: ['.github/workflows/inpi-storage-pilot.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked runtime dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Persist and verify one official INPI PDF in private Supabase
        env:
          INPI_API_USERNAME: ${{ secrets.INPI_API_USERNAME }}
          INPI_API_PASSWORD: ${{ secrets.INPI_API_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createClient} from '@supabase/supabase-js';
          import {authenticate} from './scripts/inpi/lib.mjs';
          import {syncEntity} from './scripts/inpi/sync.mjs';
          import {createHash} from 'node:crypto';
          for(const k of ['INPI_API_USERNAME','INPI_API_PASSWORD','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY']){
            if(!process.env[k]){console.error('BLOCKED: Missing GitHub secret '+k);process.exit(2);}
          }
          console.log('All four required secrets are present; values suppressed');
          const db=createClient(process.env.SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY,{
            auth:{persistSession:false,autoRefreshToken:false}
          });
          const token=await authenticate({username:process.env.INPI_API_USERNAME,password:process.env.INPI_API_PASSWORD});
          const counters={entities:0,downloaded:0,unchanged:0,deferred:0,restricted:0,withdrawn:0,errors:0};
          await syncEntity({db,entity:{scpi_slug:'corum-origin',siren:'749907507'},token,maxDownloads:1,counters});
          console.log('SYNC_RESULT:',JSON.stringify(counters));
          if(counters.errors || (counters.downloaded!==1 && counters.unchanged!==1919)) throw new Error('Pilot ingestion incomplete');
          const {data:docs,error}=await db.from('scpi_inpi_documents')
            .select('storage_path,sha256,inpi_id,status').eq('scpi_slug','corum-origin').eq('status','available').limit(1);
          if(error || !docs?.length) throw new Error('No verified database record');
          const {data:file,error:downloadError}=await db.storage.from('scpi-bulletins').download(docs[0].storage_path);
          if(downloadError) throw new Error('Archived PDF cannot be read from private storage');
          const bytes=Buffer.from(await file.arrayBuffer());
          const digest=createHash('sha256').update(bytes).digest('hex');
          if(digest!==docs[0].sha256 || bytes.subarray(0,5).toString()!=='%PDF-') throw new Error('Archived PDF digest mismatch');
          console.log('STORAGE_OK:',JSON.stringify({scpi:'corum-origin',bytes:bytes.length,sha256:digest}));
          NODE