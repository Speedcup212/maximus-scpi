name: All SCPI bulletins - complete archive replay
on:
  schedule:
    - cron: '43 5,11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main, recovery/all-bulletins-completeness-20261027]
    paths:
      - scripts/agents/bulletin_complete_pipeline*
      - scripts/agents/bulletin_fields.py
      - scripts/agents/bulletin_source_resolver*
      - scripts/agents/bulletin_source_transport*
      - scripts/agents/certificates/**
      - supabase/functions/scpi-bulletin-replay-oidc/**
      - .github/workflows/maximus-all-bulletins-replay.yml
  pull_request:
    paths:
      - scripts/agents/bulletin_complete_pipeline*
      - scripts/agents/bulletin_fields.py
      - scripts/agents/bulletin_source_resolver*
      - scripts/agents/bulletin_source_transport*
      - scripts/agents/certificates/**
      - supabase/functions/scpi-bulletin-replay-oidc/**
      - .github/workflows/maximus-all-bulletins-replay.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: all-scpi-bulletin-replay-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent native PDF readers and complete-page OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Adversarial financial field and source tests
        run: |
          python -m unittest discover -s scripts/agents -p 'bulletin*_test.py' -v
          python -m unittest discover -s scripts/agents -p 'corum*_test.py' -v
      - name: Verify actual service role permissions and durable queue health
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: python scripts/agents/bulletin_complete_pipeline.py --preflight --out test-results/bulletin-replay-${{ matrix.slot }}
      - name: Drain durable queue - all 65 SCPI and all registered periods
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: python scripts/agents/bulletin_complete_pipeline.py --run --out test-results/bulletin-replay-${{ matrix.slot }}
      - name: Keep document outcomes and checkpoints
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-replay-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
          path: |
            test-results/bulletin-replay-${{ matrix.slot }}/run-summary.json
            test-results/bulletin-replay-${{ matrix.slot }}/preflight.json
            test-results/bulletin-replay-${{ matrix.slot }}/source-resolution/*.json
          if-no-files-found: ignore
      # No readiness override, public release, marketing or Netlify deployment.

  source-access-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify issuer intermediate against existing system roots
        run: openssl verify scripts/agents/certificates/tbs-rsa-organization-validation-ca4.pem
      - name: Read-only official publisher access and certificate proof
        run: python scripts/agents/bulletin_source_resolver_probe.py --registry data-import/scpi_archive_sources_20261028.json --out test-results/source-access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/source-access/
          if-no-files-found: error
