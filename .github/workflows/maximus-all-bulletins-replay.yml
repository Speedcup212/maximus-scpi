name: All SCPI bulletins - complete archive replay
on:
  schedule:
    - cron: '43 5,11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main, recovery/all-bulletins-completeness-20261027]
    paths:
      - scripts/agents/bulletin_complete_pipeline*
      - scripts/agents/missing_metric_policy.py
      - scripts/agents/bulletin_fields.py
      - scripts/agents/bulletin_fields_semantic_guard_test.py
      - scripts/agents/novaxia_exact_semantic_regression.py
      - scripts/agents/corum_bulletin_fields.py
      - supabase/migrations/20261107_recovery175_missing_metric_evidence_triage.sql
      - supabase/migrations/20261107_recovery176_missing_metric_triage_semantics.sql
      - 'supabase/migrations/*_source_qa.sql'
      - scripts/agents/bulletin_source_resolver*
      - scripts/agents/bulletin_source_transport*
      - scripts/agents/ncap_t3_source_probe.py
      - scripts/agents/paref_private_archived_tof_oidc_probe*
      - scripts/agents/certificates/**
      - supabase/functions/scpi-bulletin-replay-oidc/**
      - .github/workflows/maximus-all-bulletins-replay.yml
  pull_request:
    paths:
      - scripts/agents/bulletin_complete_pipeline*
      - scripts/agents/missing_metric_policy.py
      - scripts/agents/bulletin_fields.py
      - scripts/agents/bulletin_fields_semantic_guard_test.py
      - scripts/agents/novaxia_exact_semantic_regression.py
      - scripts/agents/corum_bulletin_fields.py
      - supabase/migrations/20261107_recovery175_missing_metric_evidence_triage.sql
      - supabase/migrations/20261107_recovery176_missing_metric_triage_semantics.sql
      - 'supabase/migrations/*_source_qa.sql'
      - scripts/agents/bulletin_source_resolver*
      - scripts/agents/bulletin_source_transport*
      - scripts/agents/ncap_t3_source_probe.py
      - scripts/agents/paref_private_archived_tof_oidc_probe*
      - scripts/agents/certificates/**
      - supabase/functions/scpi-bulletin-replay-oidc/**
      - .github/workflows/maximus-all-bulletins-replay.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: all-scpi-bulletin-replay-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false
jobs:
  ncap-original-proof-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned issuer source allowlist and syntax offline
        run: |
          python -m py_compile scripts/agents/ncap_t3_source_probe.py
          python - <<'PY'
          from pathlib import Path
          edge=Path('supabase/functions/scpi-bulletin-replay-oidc/index.ts').read_text()
          flow=Path('.github/workflows/maximus-all-bulletins-replay.yml').read_text()
          assert "ncap-education-sante" in edge
          assert "cd81cb7ec3750dd7fef05d3720729748896acc3f659f7b7a872ad6ff242cbf96" in edge
          assert "body.op==='archived_exact_source_probe'" in edge
          assert "jwt.workflow_ref!==repo+'/.github/workflows/maximus-all-bulletins-replay.yml@'+jwt.ref" in edge
          assert "ncap_t3_source_probe.py" in flow
          PY

  ncap-private-original-tof-diagnostic:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent original PDF engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Authenticate OIDC and read exact NCap T3 archive (read-only)
        run: python scripts/agents/ncap_t3_source_probe.py
      - name: Keep bounded source report, never signed URL or raw private PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncap-t3-exact-issuer-tof-proof
          path: test-results/ncap-t3-source-proof/bounded-source-evidence.json
          retention-days: 14
          if-no-files-found: warn

  novaxia-original-semantic-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify exact original Novaxia 2026-T3 semantic reconciliation, read-only
        run: python scripts/agents/novaxia_exact_semantic_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaxia-exact-original-semantic-proof
          path: test-results/novaxia-exact-semantic.json
          retention-days: 14
          if-no-files-found: warn

  seed-replay:
    # Single authenticated source-index mutation: do NOT run this inside
    # the 4-slot matrix (RECOVERY-174 lock contention incident).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reader dependency required by the protected bridge
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Protected preflight and serialized source-index seed
        run: |
          python scripts/agents/bulletin_complete_pipeline.py --seed-only \
            --out test-results/bulletin-replay-seed
      - name: Retain seed result for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-replay-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/bulletin-replay-seed/seed.json
            test-results/bulletin-replay-seed/preflight.json
          if-no-files-found: ignore
          retention-days: 7

  replay:
    needs: seed-replay
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') || needs.seed-replay.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent native PDF readers and complete-page OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Adversarial financial field and source tests
        run: |
          python -m unittest discover -s scripts/agents -p 'bulletin*_test.py' -v
          python -m unittest discover -s scripts/agents -p 'corum*_test.py' -v
      - name: Verify actual service role permissions and durable queue health
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: python scripts/agents/bulletin_complete_pipeline.py --preflight --out test-results/bulletin-replay-${{ matrix.slot }}
      - name: Drain durable queue - all 65 SCPI and all registered periods
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: python scripts/agents/bulletin_complete_pipeline.py --run --preseeded --out test-results/bulletin-replay-${{ matrix.slot }}
      - name: Keep document outcomes and checkpoints
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-replay-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
          path: |
            test-results/bulletin-replay-${{ matrix.slot }}/run-summary.json
            test-results/bulletin-replay-${{ matrix.slot }}/preflight.json
            test-results/bulletin-replay-${{ matrix.slot }}/source-resolution/*.json
          if-no-files-found: ignore
      # No readiness override, public release, marketing or Netlify deployment.

  source-access-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify issuer intermediate against existing system roots
        run: openssl verify scripts/agents/certificates/tbs-rsa-organization-validation-ca4.pem
      - name: Read-only official publisher access and certificate proof
        run: python scripts/agents/bulletin_source_resolver_probe.py --registry data-import/scpi_archive_sources_20261028.json --out test-results/source-access
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/source-access/
          if-no-files-found: error

  archive-source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF import dependency for offline contract tests
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Guard narrow publisher registry + original OIDC trust boundaries
        run: python -m unittest discover -s scripts/agents -p 'paref_private_archived_tof_oidc_probe_test.py' -v

  archive-source-probe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Read ONLY two pinned private PAREF original bulletins with existing GitHub OIDC
        run: python scripts/agents/paref_private_archived_tof_oidc_probe.py test-results/paref-private-archive
      - name: Store source proof JSON only (NO signed URL, JWT, private PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paref-private-source-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/paref-private-archive/source-qa.json
          if-no-files-found: warn
          retention-days: 7
