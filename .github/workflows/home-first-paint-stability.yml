name: Stabilize homepage first paint

on:
  push:
    paths:
      - '.github/workflows/home-first-paint-stability.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply homepage startup optimizations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # 1. Make homepage entry synchronous to remove the HomeApp
          #    dynamic-import waterfall on the site's most important page.
          # ------------------------------------------------------------
          p = Path('src/main.tsx')
          text = p.read_text(encoding='utf-8')
          anchor = "import './index.css';\n"
          if "import HomeApp from './HomeApp';" not in text:
              if anchor not in text:
                  raise SystemExit('main.tsx import anchor not found')
              text = text.replace(anchor, anchor + "import HomeApp from './HomeApp';\n", 1)

          old = """  // The plain homepage gets its own minimal bundle.\n  if (!path && !hasLegacyLandingParams) {\n    const module = await import('./HomeApp');\n    return module.default;\n  }\n"""
          new = """  // The homepage is imported eagerly on purpose: this removes one full\n  // network round-trip before the first interactive paint and prevents the\n  // static shell from lingering visibly before React takes over.\n  if (!path && !hasLegacyLandingParams) {\n    return HomeApp;\n  }\n"""
          if old not in text:
              raise SystemExit('main.tsx homepage entry block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # 2. HomeApp: keep the hero as the only startup screen.
          #    Below-fold content and floating UI are loaded after intent.
          # ------------------------------------------------------------
          p = Path('src/HomeApp.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "import React, { lazy, Suspense, useEffect, useRef, useState } from 'react';",
              "import React, { lazy, Suspense, useEffect, useState } from 'react';",
              1,
          )
          text = text.replace("  const belowFoldTriggerRef = useRef<HTMLDivElement>(null);\n", "", 1)

          old_effect = """  useEffect(() => {\n    const target = belowFoldTriggerRef.current;\n    if (!target || showBelowFold) return;\n\n    const observer = new IntersectionObserver(\n      (entries) => {\n        if (entries.some(entry => entry.isIntersecting)) {\n          setShowBelowFold(true);\n          observer.disconnect();\n        }\n      },\n      { rootMargin: '120px 0px' }\n    );\n\n    observer.observe(target);\n\n    // Safety fallback for non-scrolling users/crawlers, outside the critical startup window.\n    const fallback = window.setTimeout(() => setShowBelowFold(true), 6000);\n\n    return () => {\n      observer.disconnect();\n      window.clearTimeout(fallback);\n    };\n  }, [showBelowFold]);\n"""
          new_effect = """  useEffect(() => {\n    if (showBelowFold) return;\n\n    // Keep all secondary homepage sections out of the startup waterfall.\n    // They load as soon as the visitor shows intent to continue, with a\n    // conservative fallback for crawlers/non-scrolling visitors.\n    const revealBelowFold = () => setShowBelowFold(true);\n    const onScroll = () => {\n      if (window.scrollY > 96) revealBelowFold();\n    };\n\n    window.addEventListener('scroll', onScroll, { passive: true });\n    const fallback = window.setTimeout(revealBelowFold, 3500);\n\n    return () => {\n      window.removeEventListener('scroll', onScroll);\n      window.clearTimeout(fallback);\n    };\n  }, [showBelowFold]);\n"""
          if old_effect not in text:
              raise SystemExit('HomeApp below-fold effect not found')
          text = text.replace(old_effect, new_effect, 1)

          old_section = '<section className="relative overflow-hidden" style={{ backgroundColor: \'#0D1117\' }}>'
          new_section = '<section className="relative overflow-hidden min-h-[calc(100svh-4rem)] flex items-center" style={{ backgroundColor: \'#0D1117\' }}>'
          if old_section not in text:
              raise SystemExit('HomeApp hero section not found')
          text = text.replace(old_section, new_section, 1)

          text = text.replace(
              "\n      <div ref={belowFoldTriggerRef} className=\"h-px w-full\" aria-hidden=\"true\" />",
              "",
              1,
          )

          old_floating = """      <Suspense fallback={null}>\n        <FloatingButton\n          isVisible={showFloatingButton}\n          onClick={() => setIsRdvModalOpen(true)}\n        />\n        {isRdvModalOpen && (\n          <RdvModal\n            isOpen={isRdvModalOpen}\n            onClose={() => setIsRdvModalOpen(false)}\n          />\n        )}\n      </Suspense>\n"""
          new_floating = """      {showFloatingButton && (\n        <Suspense fallback={null}>\n          <FloatingButton\n            isVisible={showFloatingButton}\n            onClick={() => setIsRdvModalOpen(true)}\n          />\n        </Suspense>\n      )}\n\n      {isRdvModalOpen && (\n        <Suspense fallback={null}>\n          <RdvModal\n            isOpen={isRdvModalOpen}\n            onClose={() => setIsRdvModalOpen(false)}\n          />\n        </Suspense>\n      )}\n"""
          if old_floating not in text:
              raise SystemExit('HomeApp floating block not found')
          text = text.replace(old_floating, new_floating, 1)
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # 3. Reserve realistic space for delayed sections so they do not
          #    create a second visible layout jump when they load.
          # ------------------------------------------------------------
          p = Path('src/HomeBelowFold.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '<Suspense fallback={<div className="py-12" aria-hidden="true" />}>\n        <Testimonials />',
              '<Suspense fallback={<div className="min-h-[360px]" aria-hidden="true" />}>\n        <Testimonials />',
              1,
          )
          text = text.replace(
              '<Suspense fallback={<div className="py-12" aria-hidden="true" />}>\n      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">',
              '<Suspense fallback={<div className="min-h-[420px]" aria-hidden="true" />}>\n      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # 4. Static first paint: make the right-hand quiz look like the
          #    real first React state instead of a generic skeleton.
          # ------------------------------------------------------------
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_quiz = """            <aside class=\"initial-quiz\" aria-hidden=\"true\">\n              <div class=\"initial-quiz-kicker\">Votre profil SCPI</div>\n              <div class=\"initial-quiz-title\">Première orientation en 4 questions</div>\n              <div class=\"initial-skeleton-row\"></div>\n              <div class=\"initial-skeleton-row\"></div>\n              <div class=\"initial-skeleton-row short\"></div>\n              <div class=\"initial-skeleton-button\"></div>\n            </aside>\n"""
          new_quiz = """            <aside class=\"initial-quiz\" aria-hidden=\"true\">\n              <div class=\"initial-quiz-head\">\n                <div class=\"initial-quiz-label\"><span class=\"initial-live-dot\"></span>Simulation pédagogique</div>\n                <span class=\"initial-pill\">4 questions</span>\n              </div>\n              <div class=\"initial-progress-meta\"><span>ÉTAPE 1 SUR 4</span><strong>0%</strong></div>\n              <div class=\"initial-progress-track\"><span></span></div>\n              <div class=\"initial-progress-steps\"><i></i><i></i><i></i><i></i></div>\n              <div class=\"initial-question\">Quel montant souhaitez-vous investir ?</div>\n              <div class=\"initial-options\">\n                <div>Moins de 10 000 €</div>\n                <div>10 000 – 50 000 €</div>\n                <div>50 000 – 150 000 €</div>\n                <div>Plus de 150 000 €</div>\n              </div>\n            </aside>\n"""
          if old_quiz not in text:
              raise SystemExit('index.html initial quiz block not found')
          text = text.replace(old_quiz, new_quiz, 1)

          old_css = """        .initial-quiz{border:1px solid rgba(51,65,85,.9);background:rgba(15,23,42,.82);border-radius:20px;padding:26px;min-height:360px;box-shadow:0 22px 60px rgba(0,0,0,.25)}\n        .initial-quiz-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6ee7b7;font-weight:800}\n        .initial-quiz-title{font-size:22px;font-weight:800;color:#f8fafc;margin:10px 0 28px}\n        .initial-skeleton-row{height:52px;border-radius:12px;background:#1e293b;margin:0 0 14px}\n        .initial-skeleton-row.short{width:72%}\n        .initial-skeleton-button{height:52px;border-radius:12px;background:#00C896;margin-top:24px}\n"""
          new_css = """        .initial-quiz{border:1px solid rgba(52,211,153,.2);background:rgba(15,23,42,.80);border-radius:24px;padding:28px;min-height:382px;box-shadow:0 22px 60px rgba(16,185,129,.10)}\n        .initial-quiz-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(51,65,85,.6);padding-bottom:16px;margin-bottom:28px}\n        .initial-quiz-label{display:flex;align-items:center;gap:8px;color:#e2e8f0;font-size:14px;font-weight:650}\n        .initial-live-dot{display:inline-block;width:10px;height:10px;border-radius:999px;background:#00C896;box-shadow:0 0 0 5px rgba(0,200,150,.10)}\n        .initial-pill{border:1px solid rgba(51,65,85,.7);background:rgba(30,41,59,.6);border-radius:999px;padding:4px 10px;color:#cbd5e1;font-size:12px;font-weight:650}\n        .initial-progress-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#94a3b8;font-size:12px;font-weight:700;letter-spacing:.05em}\n        .initial-progress-meta strong{color:#00C896}\n        .initial-progress-track{height:10px;border-radius:999px;background:#1e293b;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(51,65,85,.6)}\n        .initial-progress-track span{display:block;width:0;height:100%;background:linear-gradient(90deg,#0056b3,#00C896)}\n        .initial-progress-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;margin-bottom:28px}\n        .initial-progress-steps i{height:4px;border-radius:999px;background:rgba(148,163,184,.25)}\n        .initial-progress-steps i:first-child{background:#00C896}\n        .initial-question{font-size:20px;line-height:1.35;font-weight:650;color:#fff;margin-bottom:20px}\n        .initial-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n        .initial-options div{min-height:52px;display:flex;align-items:center;border:1px solid rgba(51,65,85,.7);background:rgba(30,41,59,.4);border-radius:12px;padding:12px 16px;color:#f1f5f9;font-size:14px;font-weight:600}\n"""
          if old_css not in text:
              raise SystemExit('index.html initial quiz CSS block not found')
          text = text.replace(old_css, new_css, 1)

          # Make the static first paint occupy the same viewport height as React.
          text = text.replace(
              '.initial-hero-grid{max-width:1280px;margin:0 auto;padding:72px 24px 80px;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.8fr);gap:56px;align-items:center}',
              '.initial-hero-grid{max-width:1280px;min-height:calc(100svh - 64px);margin:0 auto;padding:52px 24px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.8fr);gap:56px;align-items:center}',
              1,
          )

          # ------------------------------------------------------------
          # 5. Push GTM out of the rendering window. Load on first visitor
          #    interaction, otherwise after 6 s. This preserves analytics for
          #    engaged users without making GTM part of the startup chain.
          # ------------------------------------------------------------
          old_gtm = """    <script>\n      window.dataLayer = window.dataLayer || [];\n      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });\n      window.addEventListener('load', function () {\n        var loadGtm = function () {\n          var script = document.createElement('script');\n          script.async = true;\n          script.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-N2JLWKH';\n          document.head.appendChild(script);\n        };\n        if ('requestIdleCallback' in window) {\n          requestIdleCallback(loadGtm, { timeout: 1800 });\n        } else {\n          setTimeout(loadGtm, 800);\n        }\n      }, { once: true });\n    </script>\n"""
          new_gtm = """    <script>\n      window.dataLayer = window.dataLayer || [];\n      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });\n      window.addEventListener('load', function () {\n        var loaded = false;\n        var loadGtm = function () {\n          if (loaded) return;\n          loaded = true;\n          var script = document.createElement('script');\n          script.async = true;\n          script.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-N2JLWKH';\n          document.head.appendChild(script);\n        };\n        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (eventName) {\n          window.addEventListener(eventName, loadGtm, { once: true, passive: true });\n        });\n        setTimeout(loadGtm, 6000);\n      }, { once: true });\n    </script>\n"""
          if old_gtm not in text:
              raise SystemExit('index.html GTM block not found')
          text = text.replace(old_gtm, new_gtm, 1)

          p.write_text(text, encoding='utf-8')

          # Self-remove workflow before the final commit.
          wf = Path('.github/workflows/home-first-paint-stability.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Full production build
        run: npm run build

      - name: Commit optimized homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: stabilize homepage first paint"
          git push origin HEAD:main
