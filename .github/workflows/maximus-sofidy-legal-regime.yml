name: MaximusSCPI - Sofidy 2026 DIC legal capital regime proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-legal-regime.yml'
      - 'scripts/agents/sofidy_legal_capital_check.py'
      - 'scripts/agents/sofidy_legal_capital_check_test.py'
      - 'scripts/agents/publisher-families/sofidy-legal-capital-regime-2026.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-legal-regime.yml'
      - 'scripts/agents/sofidy_legal_capital_check.py'
      - 'scripts/agents/sofidy_legal_capital_check_test.py'
      - 'scripts/agents/publisher-families/sofidy-legal-capital-regime-2026.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF source reader
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify explicit capital regime rules against fake identities
        run: python -m unittest scripts/agents/sofidy_legal_capital_check_test.py -v

  issuer-dic:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slug: [sofiboutique, sofipierre, sofidy-europe-invest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poppler and MuPDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify publisher intermediate signed by OS trusted root
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Check source PDF exact hash, identity and two legal clauses
        run: |
          python scripts/agents/sofidy_legal_capital_check.py \
            --manifest scripts/agents/publisher-families/sofidy-legal-capital-regime-2026.json \
            --slug ${{ matrix.slug }} \
            --out test-results/sofidy-legal/${{ matrix.slug }}.json
      - name: Keep audit proof and block summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-dic-legal-${{ matrix.slug }}-${{ github.run_id }}
          path: test-results/sofidy-legal/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 14
