name: BNP official T3 PDF discovery (branch only)
on:
  push:
    branches:
      - feature/scpi-67-68-release-gates
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect official BNP publisher listing (no financial publication)
        shell: bash
        run: |
          mkdir -p evidence
          curl -L --retry 2 --max-time 45 -sS -A 'Mozilla/5.0 (compatible; MaximusSCPI-document-research/1.0)' \
            'https://reim.bnpparibas-am.com/fr-fr/documentation' -o evidence/issuer-documentation.html
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('evidence/issuer-documentation.html').read_text(errors='replace')
          chunks=[]
          for term in ['T3 2026','Accès Valeur Pierre','Accimmo Pierre','ACCIMMO','ACCES']:
              occ=list(re.finditer(re.escape(term),s,re.I))
              chunks.append('QUERY '+term+' HITS '+str(len(occ)))
              for m in occ[-20:]:
                  chunks.append(s[max(0,m.start()-350):min(len(s),m.end()+650)])
          links=re.findall(r'(?:href|data-url|src)\\s*=\\s*["\\x27]([^"\\x27]{1,1000})["\\x27]',s,re.I)
          chunks.append('POTENTIAL PDF URLS: '+str(len(links)))
          for url in links:
              u=html.unescape(url)
              if '.pdf' in u.lower() and (any(x in u.lower() for x in ('t3','2026','accim','acces'))):
                  chunks.append(u)
          Path('evidence/discovery.txt').write_text('\\n'.join(chunks))
          print('official html bytes:',len(s),'matched snippets:',len(chunks))
          print(Path('evidence/discovery.txt').read_text()[:12000])
          PY
      - name: Verify official T3 PDFs, SHA256, page text and render evidence
        shell: bash
        run: |
          curl -fLS --retry 2 --max-time 80 -A 'Mozilla/5.0' \
            'https://reim.bnpparibas-am.com/sites/default/files/docs/2026-10/BT_AVP_3T2026_5%20def.pdf' -o evidence/acces-valeur-pierre-T3-2026.pdf
          curl -fLS --retry 2 --max-time 80 -A 'Mozilla/5.0' \
            'https://reim.bnpparibas-am.com/sites/default/files/docs/2026-10/BT_AP_3T2026_4%20vdef.pdf' -o evidence/accimmo-pierre-T3-2026.pdf
          python3 -m pip install --quiet pymupdf==1.26.5
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import pymupdf
          for slug in ('acces-valeur-pierre','accimmo-pierre'):
              src=Path('evidence')/(slug+'-T3-2026.pdf')
              data=src.read_bytes()
              assert data[:4]==b'%PDF',slug+' returned non-PDF'
              doc=pymupdf.open(src)
              texts=[]
              for i,page in enumerate(doc):
                  texts.append('=== PDF PAGE '+str(i+1)+' ===\n'+page.get_text(sort=True))
              alltext='\n'.join(texts)
              assert ('2026' in alltext and len(alltext)>2000),slug+' PDF lacks expected searchable content'
              Path('evidence',slug+'-T3-2026.txt').write_text(alltext)
              sha=hashlib.sha256(data).hexdigest()
              print('SOURCE',slug,'PAGES',len(doc),'BYTES',len(data),'SHA256',sha)
              for pno in (2,4,5,6):
                  if pno<=len(doc):
                      pg=doc[pno-1]
                      bitmap=pg.get_pixmap(matrix=pymupdf.Matrix(1.25,1.25),alpha=False)
                      bitmap.save('evidence/'+slug+'-page-'+str(pno)+'.png')
              for term in ('Capitalisation','TOF','taux d’occupation','Taux d’occupation','RECONSTITUTION','endettement','retrait'):
                  idx=alltext.lower().find(term.lower())
                  if idx>=0:print('MATCH',slug,term,repr(alltext[max(0,idx-120):idx+250]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnpp-t3-official-index
          path: evidence/
          retention-days: 1
