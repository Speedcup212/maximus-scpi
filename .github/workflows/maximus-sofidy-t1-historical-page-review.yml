name: MaximusSCPI - Sofidy original T1 historical shares and occupancy (review-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-t1-historical-page-review.yml'
      - 'scripts/agents/sofidy_t3_page_review.py'
      - 'scripts/agents/sofidy_2026_t1_history_review_test.py'
      - 'scripts/agents/publisher-families/sofidy-2026-t1-historical-originals.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-sofidy-t1-historical-page-review.yml'
      - 'scripts/agents/sofidy_t3_page_review.py'
      - 'scripts/agents/sofidy_2026_t1_history_review_test.py'
      - 'scripts/agents/publisher-families/sofidy-2026-t1-historical-originals.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - run: python -m unittest scripts/agents/sofidy_2026_t1_history_review_test.py -v
  inspect-source-pages:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        slug: [sofiboutique, sofipierre, sofidy-europe-invest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install two PDF readers for independent source original check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify issuer TLS intermediate against pretrusted system CA
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Render original physical T1 page 1 and 5 and preserve source text contexts
        run: |
          python scripts/agents/sofidy_t3_page_review.py \
            --manifest scripts/agents/publisher-families/sofidy-2026-t1-historical-originals.json \
            --slug ${{ matrix.slug }} \
            --out test-results/sofidy-t1-historical/${{ matrix.slug }}
      - name: Archive non-certifying historical PDF page proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-t1-historical-${{ matrix.slug }}-${{ github.run_id }}
          path: test-results/sofidy-t1-historical/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 14
