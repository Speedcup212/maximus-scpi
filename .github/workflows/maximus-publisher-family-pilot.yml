name: MaximusSCPI - family PDF binary proof (not financial certification)
on:
  workflow_dispatch:
  schedule:
    - cron: '18 9 * * 1,4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maximus-publisher-family-pilot.yml'
      - 'scripts/agents/publisher_family_proof.py'
      - 'scripts/agents/candidate_pdf_binary_proof.py'
      - 'scripts/agents/candidate_pdf_binary_proof_test.py'
      - 'scripts/agents/prepare_verified_sofidy_ca.sh'
      - 'scripts/agents/publisher_family_proof_test.py'
      - 'scripts/agents/publisher-families/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maximus-publisher-family-pilot.yml'
      - 'scripts/agents/publisher_family_proof.py'
      - 'scripts/agents/candidate_pdf_binary_proof.py'
      - 'scripts/agents/candidate_pdf_binary_proof_test.py'
      - 'scripts/agents/prepare_verified_sofidy_ca.sh'
      - 'scripts/agents/publisher_family_proof_test.py'
      - 'scripts/agents/publisher-families/**'

permissions:
  contents: read

concurrency:
  group: scpi-publisher-family-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MuPDF
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Validate issuer allowlist and fail-closed source proof
        run: python -m unittest scripts/agents/publisher_family_proof_test.py -v
      - name: Existing independent binary evidence security tests
        run: python -m unittest scripts/agents/candidate_pdf_binary_proof_test.py -v

  publisher-tls-pr-probe:
    needs: unit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        document_set: [2026-t2, 2025-ra]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent issuer PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Diagnose issuer certificate chain with OpenSSL (read-only)
        run: |
          printf '\n' | openssl s_client -connect www.sofidy.com:443 -servername www.sofidy.com -showcerts 2>&1 | grep -E 'verify error|Verify return code|depth=|subject=|issuer=' | tail -n 18 || true
          printf '\n' | openssl s_client -connect www.sofidy.com:443 -servername www.sofidy.com 2>/dev/null | openssl x509 -noout -subject -issuer -ext authorityInfoAccess || true
      - name: Verify Sectigo intermediate against system roots (no new trust anchor)
        shell: bash
        run: |
          set -euo pipefail
          # HTTP is the issuer's AIA distribution endpoint, not a trusted issuer PDF.
          # Treat these CA bytes as UNTRUSTED until OpenSSL verifies their issuer
          # signature against the already-trusted OS roots (below).
          curl --fail --silent --show-error --proto '=http' --max-redirs 0 --max-time 25 --max-filesize 25000 \
            --output "$RUNNER_TEMP/tbs-ca4.crt" \
            'http://crt.sectigo.com/TBSRSAOrganizationValidationSecureServerCA4.crt'
          openssl x509 -inform DER -in "$RUNNER_TEMP/tbs-ca4.crt" -out "$RUNNER_TEMP/tbs-ca4.pem"
          openssl x509 -in "$RUNNER_TEMP/tbs-ca4.pem" -noout -subject -issuer
          openssl x509 -in "$RUNNER_TEMP/tbs-ca4.pem" -noout -subject | grep -F 'TBS RSA Organization Validation Secure Server CA 4'
          openssl x509 -in "$RUNNER_TEMP/tbs-ca4.pem" -noout -text | grep -F 'CA:TRUE'
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/tbs-ca4.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/tbs-ca4.pem" > "$RUNNER_TEMP/sofidy-ca-chain.pem"
          echo "SCPI_PUBLISHER_CA_BUNDLE=$RUNNER_TEMP/sofidy-ca-chain.pem" >> "$GITHUB_ENV"
      - name: Prove original Sofiboutique PDF over trusted TLS (read-only)
        run: |
          python scripts/agents/publisher_family_proof.py \
            --manifest scripts/agents/publisher-families/sofidy-${{ matrix.document_set }}.json \
            --slug sofiboutique \
            --output test-results/publisher-families/sofidy-pr-${{ matrix.document_set }}.json
      - name: Retain independent original proof or explicit blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-tls-pr-${{ matrix.document_set }}-${{ github.run_id }}
          path: test-results/publisher-families/sofidy-pr-${{ matrix.document_set }}.json
          if-no-files-found: error
          retention-days: 7

  candidate-daily-tls-pr-probe:
    needs: unit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify issuer intermediate against pretrusted OS roots
        run: bash scripts/agents/prepare_verified_sofidy_ca.sh
      - name: Prove daily agent reader accepts two exact registered Sofiboutique originals
        run: |
          python scripts/agents/candidate_pdf_binary_proof.py \
            --manifest scripts/agents/publisher-families/sofidy-independent-candidate-probe.json \
            --out "$RUNNER_TEMP/sofidy-daily-agent-proof"
      - name: Verify proof status and no financial admission
        run: |
          python -c 'import json,os,pathlib; x=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"sofidy-daily-agent-proof/proof.json").read_text()); assert x["status"]=="verified" and len(x["documents"])==2 and all(y["status"]=="verified" and y["binary_hash_matches_registered"] and y["reader_engines"]==["MuPDF","Poppler"] and not y["financial_certified"] for y in x["documents"]) and x["financial_certified"] is False and x["deploy_allowed"] is False'
      - name: Retain read-only daily candidate source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofidy-candidate-daily-tls-${{ github.run_id }}
          path: ${{ runner.temp }}/sofidy-daily-agent-proof/proof.json
          if-no-files-found: warn
          retention-days: 7
  live:
    needs: unit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        slug: [sofiboutique, sofipierre, sofidy-europe-invest]
        document_set: [2026-t2, 2025-ra]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.5'
      - name: Verify Sectigo intermediate against system roots (no new trust anchor)
        shell: bash
        run: |
          set -euo pipefail
          # HTTP is the issuer's AIA distribution endpoint, not a trusted issuer PDF.
          # Treat these CA bytes as UNTRUSTED until OpenSSL verifies their issuer
          # signature against the already-trusted OS roots (below).
          curl --fail --silent --show-error --proto '=http' --max-redirs 0 --max-time 25 --max-filesize 25000 \
            --output "$RUNNER_TEMP/tbs-ca4.crt" \
            'http://crt.sectigo.com/TBSRSAOrganizationValidationSecureServerCA4.crt'
          openssl x509 -inform DER -in "$RUNNER_TEMP/tbs-ca4.crt" -out "$RUNNER_TEMP/tbs-ca4.pem"
          openssl x509 -in "$RUNNER_TEMP/tbs-ca4.pem" -noout -subject -issuer
          openssl x509 -in "$RUNNER_TEMP/tbs-ca4.pem" -noout -subject | grep -F 'TBS RSA Organization Validation Secure Server CA 4'
          openssl x509 -in "$RUNNER_TEMP/tbs-ca4.pem" -noout -text | grep -F 'CA:TRUE'
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/tbs-ca4.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/tbs-ca4.pem" > "$RUNNER_TEMP/sofidy-ca-chain.pem"
          echo "SCPI_PUBLISHER_CA_BUNDLE=$RUNNER_TEMP/sofidy-ca-chain.pem" >> "$GITHUB_ENV"
      - name: Read real Sofidy PDF, verify fund, period and original SHA using two readers
        run: |
          python scripts/agents/publisher_family_proof.py \
            --manifest scripts/agents/publisher-families/sofidy-${{ matrix.document_set }}.json \
            --slug ${{ matrix.slug }} \
            --output test-results/publisher-families/${{ matrix.slug }}-${{ matrix.document_set }}.json
      - name: Save actual proof or explicit source failure for independent QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-family-${{ matrix.slug }}-${{ matrix.document_set }}-${{ github.run_id }}
          path: test-results/publisher-families/${{ matrix.slug }}-${{ matrix.document_set }}.json
          if-no-files-found: error
          retention-days: 14
