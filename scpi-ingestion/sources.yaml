# SCPI bulletin sources — pipeline MaximusSCPI
# Format : slug SCPI (minuscules, tirets) + URL de la page documentation officielle
#
# Champs optionnels :
#   document_type : "bulletin_trimestriel" (défaut) | "rapport_annuel"
#   ra_year       : année de reporting pour rapport_annuel (ex: 2024)
#
# Le pipeline charge pageUrl avec Playwright → extrait le lien PDF → télécharge
# → analyse → stocke dans Supabase.
#
# Pour bulletin_trimestriel : pipeline complet (extraction + scoring + QA)
# Pour rapport_annuel       : extraction ciblée du taux de distribution uniquement
#                             Mise à jour partielle de scpi_indicators.td
#
# Statuts :
#   ✅ vérifié  — URL testée, document accessible
#   🔍 à tester — URL probable, non vérifiée manuellement
#   ❌ à compléter — URL inconnue, nécessite vérification manuelle
#
# Pour tester une SCPI seule :
#   npx tsx src/index.ts --slug iroko-zen
#   npx tsx src/index.ts --slug iroko-zen:ra    (rapport annuel)

sources:

